/* ---------------- EVENT LOGS ---------------- */
S('recent-errors','info','Critical and error events in the last 24 hours',[],
'The first line of every System and Application error from the last day. Look for patterns rather than single events.',
String.raw`
Get-WinEvent -FilterHashtable @{ LogName='System','Application'; Level=1,2; StartTime=(Get-Date).AddHours(-24) } -ErrorAction SilentlyContinue |
  Select-Object TimeCreated, LogName, ProviderName, Id, @{n='Message';e={ ($_.Message -split "\r?\n")[0] }} |
  Format-Table -AutoSize -Wrap`);

S('app-crashes','info','Application crashes (last 7 days)',[],
'Event 1000. Shows which app crashed and which module (DLL) it crashed in, which often points to the real culprit such as an add-in or AV hook.',
String.raw`
Get-WinEvent -FilterHashtable @{ LogName='Application'; Id=1000; StartTime=(Get-Date).AddDays(-7) } -ErrorAction SilentlyContinue |
  Select-Object TimeCreated,
    @{n='App';e={ $_.Properties[0].Value }},
    @{n='FaultingModule';e={ $_.Properties[3].Value }} |
  Format-Table -AutoSize`);

/* ============================================================
   GUIDES   —   [[script-id]] becomes a clickable chip
   ============================================================ */
/* ============================================================================
   LINUX

   Written for the machine you have just been given a shell on and know nothing
   about. Where a command forks between distribution families the script works
   out which one it is looking at rather than assuming, because a script that
   assumes wrong fails in a way that looks like the machine is broken.

   Nothing here uses a dollar sign followed by a brace: the browser reads that
   as its own substitution and it breaks the file. Plain $var throughout,
   and $( ) for command substitution, which is safe.
   ============================================================================ */

S('lx-snapshot','linux','What is this box',['linux'],
'Run this first on any machine you have just connected to. Distribution and version, kernel, whether it is a virtual machine and on what, uptime, and how much of it is in use. Everything else you do depends on these answers, and it takes two seconds.',
String.raw`
echo "--- identity ---"
hostnamectl 2>/dev/null || { uname -a; cat /etc/os-release | grep -E '^(NAME|VERSION)='; }
echo
echo "--- uptime and load ---"
uptime
echo "cores: $(nproc)"
echo
echo "--- memory ---"
free -h
echo
echo "--- root filesystem ---"
df -hT / | tail -n +1
echo
echo "--- virtualisation ---"
systemd-detect-virt 2>/dev/null || echo "systemd-detect-virt not available"`);

S('lx-load','linux','Is it actually busy, or just slow',['linux'],
'Load average only means something next to the core count: a load of 8 is idle on a 32-core box and on fire on a 2-core one. This prints both, then the run queue and the iowait, which is what tells you whether it is stuck on CPU or stuck on disk.',
String.raw`
cores=$(nproc)
echo "cores: $cores"
echo "load : $(cut -d' ' -f1-3 /proc/loadavg)"
echo
awk -v c="$cores" '{ printf "1-minute load per core: %.2f\n", $1 / c }' /proc/loadavg
echo "Above 1.00 per core means work is queueing. Above 2.00 it is struggling."
echo
echo "--- where the time goes (2 samples) ---"
if command -v vmstat >/dev/null 2>&1; then
  vmstat 1 2 | tail -2
  echo "Columns to read: r = waiting to run, b = blocked on I/O, wa = % time waiting on disk."
else
  top -b -n 1 | head -5
fi`);

S('lx-top-cpu','linux','Top processes by CPU',['linux'],
'The ten processes using the most CPU right now, with their full command line so you can tell which of six java processes it actually is. A single process pinned at 100% of one core looks very different to everything using a little.',
String.raw`
ps -eo pid,ppid,user,pcpu,pmem,etime,args --sort=-pcpu | head -11`);

S('lx-top-mem','linux','Top processes by memory',['linux'],
'The ten hungriest processes by resident memory. RSS is what is actually in RAM, which is the number that matters, not the virtual size.',
String.raw`
ps -eo pid,user,pmem,rss,etime,args --sort=-rss | head -11 |
  awk 'NR==1 { print; next } { $4 = sprintf("%.0fMB", $4/1024); print }' | column -t`);

S('lx-memory','linux','Memory, swap and whether the kernel has been killing things',['linux'],
'Free memory on Linux is misleading by design: the kernel uses everything spare for cache and gives it back on demand. <b>available</b> is the number to read, not <b>free</b>. This also checks whether the OOM killer has been at work, which is the answer to a surprising number of "the application keeps disappearing" tickets.',
String.raw`
free -h
echo
echo "--- swap in use by process (top 10) ---"
for f in /proc/*/status; do
  awk '/^Name:/ { n=$2 } /^VmSwap:/ { if ($2 > 0) printf "%8d kB  %s\n", $2, n }' "$f" 2>/dev/null
done | sort -rn | head -10
echo
echo "--- has the OOM killer run? ---"
if journalctl -k --no-pager 2>/dev/null | grep -i "out of memory" | tail -5; then :; fi
dmesg 2>/dev/null | grep -i "killed process" | tail -5
echo "(nothing above means it has not, at least not within the log retained)"`);

S('lx-disk','linux','Disk space, including the one everybody forgets',['linux','net'],
'df for the real filesystems, with tmpfs and squashfs filtered out so you can see what matters. Then <b>inode</b> usage, which is the one people miss: a filesystem can be 4% full and still refuse to write because it has run out of inodes, usually from millions of tiny session or cache files.',
String.raw`
echo "--- space ---"
df -hT -x tmpfs -x devtmpfs -x squashfs -x overlay
echo
echo "--- inodes ---"
df -i -x tmpfs -x devtmpfs -x squashfs -x overlay
echo
echo "If IUse% is high but Use% is not, you are out of inodes, not out of space."
echo "That is almost always millions of small files in one directory - look at"
echo "session, cache and mail spool directories first."`);

S('lx-big','linux','What is eating the disk',['linux'],
'Walks down from the root of the full filesystem showing the biggest directory at each level, which finds the culprit far faster than du on everything. Change the starting path if the full filesystem is not /.',
String.raw`
target=/
echo "Largest directories under $target"
du -xh --max-depth=1 "$target" 2>/dev/null | sort -rh | head -15
echo
echo "--- largest individual files under $target (top 15) ---"
find "$target" -xdev -type f -printf '%s %p\n' 2>/dev/null |
  sort -rn | head -15 |
  awk '{ printf "%8.1f MB  %s\n", $1/1048576, $2 }'`);

S('lx-deleted','linux','df says full, du says it is not',['linux'],
'The classic. A process still holds a file open that has been deleted, so the space is not returned until that process closes it or restarts. du cannot see it because the filename is gone; df can, because the blocks are still allocated. This lists them and names the process to restart.',
String.raw`
if ! command -v lsof >/dev/null 2>&1; then
  echo "lsof is not installed. Install it, or use the /proc walk below."
  for p in /proc/[0-9]*; do
    for fd in "$p"/fd/*; do
      readlink "$fd" 2>/dev/null | grep -q '(deleted)' && echo "$p $(readlink "$fd")"
    done
  done 2>/dev/null | head -20
else
  echo "Deleted files still held open, largest first:"
  lsof -nP 2>/dev/null | awk '/deleted/ { printf "%10.1f MB  pid %-8s %-16s %s\n", $7/1048576, $2, $1, $9 }' |
    sort -rn | head -20
fi
echo
echo "Restart the process that holds it and the space comes back immediately."
echo "Nothing needs deleting, and rebooting is not the fix, it is the workaround."`);

S('lx-reclaim','linux','Reclaim disk space',['linux','admin'],
'Adds up everything safe to remove on either distribution family and prints the command for each, rather than running it. Package caches, orphaned packages, old kernels, the journal, old snap revisions, and Docker if it is here. Snap revisions in particular catch people out: Ubuntu keeps the last two of every snap and it quietly adds up to gigabytes.',
String.raw`
echo "=== free now ==="
df -h / | tail -1
echo

size() { [ -e "$1" ] && du -sh "$1" 2>/dev/null | cut -f1 || echo "-"; }

echo "=== package cache ==="
if command -v apt-get >/dev/null 2>&1; then
  echo "  $(size /var/cache/apt/archives)  /var/cache/apt/archives"
  echo "    sudo apt-get clean"
  echo
  echo "  orphaned packages no longer needed:"
  apt-get -s autoremove 2>/dev/null | grep -E "^[0-9]+ upgraded" || true
  echo "    sudo apt-get autoremove --purge"
elif command -v dnf >/dev/null 2>&1; then
  echo "  $(size /var/cache/dnf)  /var/cache/dnf"
  echo "    sudo dnf clean all"
  echo "    sudo dnf autoremove"
fi
echo

echo "=== old kernels ==="
echo "  running: $(uname -r)"
if command -v dpkg >/dev/null 2>&1; then
  dpkg -l 'linux-image-*' 2>/dev/null | awk '/^ii/ { print "  installed: " $2 }'
  echo "    sudo apt-get autoremove --purge   (this is what removes them)"
elif command -v rpm >/dev/null 2>&1; then
  rpm -q kernel | sed 's/^/  installed: /'
  echo "    sudo dnf remove --oldinstallonly --setopt installonly_limit=2"
fi
echo "  Never remove the kernel you are currently booted from."
echo

echo "=== systemd journal ==="
journalctl --disk-usage 2>/dev/null
echo "    sudo journalctl --vacuum-time=7d"
echo

if command -v snap >/dev/null 2>&1; then
  echo "=== snap ==="
  echo "  $(size /var/lib/snapd/snaps)  /var/lib/snapd/snaps"
  echo "  disabled revisions still on disk:"
  snap list --all 2>/dev/null | awk '/disabled/ { print "    " $1 " " $3 }'
  echo "    sudo snap set system refresh.retain=2"
  echo "    then remove each disabled revision:  sudo snap remove <name> --revision=<rev>"
  echo
fi

if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
  echo "=== docker ==="
  docker system df 2>/dev/null
  echo "    docker system prune -a     <- removes every image not used by a running container"
  echo
fi

echo "=== caches and temp ==="
echo "  $(size "$HOME/.cache")  $HOME/.cache"
echo "  $(size /tmp)  /tmp"
echo "  $(size /var/tmp)  /var/tmp"
echo "    rm -rf ~/.cache/*     (safe, applications rebuild it)"
echo
echo "Nothing above has been deleted. Read each one, decide, then run it."`);


S('lx-journal-size','linux','The journal has eaten the disk',['linux','admin','changes'],
'The systemd journal grows until it hits a limit that is often larger than anyone intended. Shows what it is using, then trims it. <b>Read the second command before running it</b> - it permanently discards log history, so make sure nobody needs it for an investigation first.',
String.raw`
journalctl --disk-usage
echo
echo "To keep only the last 7 days, run:"
echo "  sudo journalctl --vacuum-time=7d"
echo
echo "To cap it at 500MB instead, run:"
echo "  sudo journalctl --vacuum-size=500M"
echo
echo "To make it permanent, set SystemMaxUse in /etc/systemd/journald.conf"
echo "and run: sudo systemctl restart systemd-journald"`);

S('lx-mounts','linux','Mounts, disks and anything in fstab that is not mounted',['linux'],
'The whole storage picture: block devices, what is mounted where, and a check for entries in fstab that are not currently mounted - which is why a machine came back from a reboot with a missing directory.',
String.raw`
echo "--- block devices ---"
lsblk -o NAME,SIZE,FSTYPE,MOUNTPOINT,LABEL 2>/dev/null || lsblk
echo
echo "--- mounted, real filesystems only ---"
findmnt -t nosquashfs,notmpfs,nodevtmpfs 2>/dev/null || mount | grep -v -E 'tmpfs|cgroup|proc|sysfs'
echo
echo "--- in fstab but not mounted ---"
awk '$1 !~ /^#/ && $2 ~ /^\// { print $2 }' /etc/fstab 2>/dev/null | while read -r m; do
  mountpoint -q "$m" 2>/dev/null || echo "NOT MOUNTED: $m"
done
echo "(nothing listed means everything in fstab is mounted)"`);

S('lx-failed','linux','What is broken right now',['linux'],
'Start every "the server is not working" ticket here. Lists every systemd unit in a failed state, then the ones currently trying and failing to start. If this is empty, the problem is inside an application rather than a service that will not run.',
String.raw`
echo "--- failed units ---"
systemctl --failed --no-pager
echo
echo "--- units in an activating or deactivating state ---"
systemctl list-units --state=activating,deactivating --no-pager 2>/dev/null
echo
echo "--- degraded? ---"
systemctl is-system-running`);

S('lx-service','linux','Is {{SERVICE}} running, and since when',['linux'],
'Status, whether it starts at boot, how long it has been up and the last few log lines, in one go. The "since" is often the whole answer: a service that restarted four minutes ago when the user says it broke an hour ago is not your problem.',
String.raw`
svc="{{SERVICE}}"
systemctl status "$svc" --no-pager -l
echo
echo "--- starts at boot? ---"
systemctl is-enabled "$svc" 2>/dev/null
echo
echo "--- how many times has it restarted ---"
systemctl show "$svc" -p NRestarts --value 2>/dev/null`);

S('lx-service-logs','linux','Why did {{SERVICE}} fail',['linux'],
'The logs for one unit since the last boot, errors only, newest last. This is where the actual reason lives - systemctl status shows you three lines and the reason is usually the fourth.',
String.raw`
svc="{{SERVICE}}"
echo "--- errors since boot ---"
journalctl -u "$svc" -b -p err --no-pager | tail -40
echo
echo "--- everything, last 60 lines ---"
journalctl -u "$svc" -b --no-pager | tail -60
echo
echo "To watch it while you reproduce the fault:  journalctl -u $svc -f"`);

S('lx-service-restart','linux','Restart {{SERVICE}}',['linux','admin','changes','risk'],
'Restarts one unit and shows what it looks like afterwards. <b>This interrupts whatever the service is doing</b>, including other people connected to it, so say so first. Try <span class="mono">reload</span> instead if the service supports it and you are only changing config.',
String.raw`
svc="{{SERVICE}}"
echo "Before:"
systemctl is-active "$svc"
sudo systemctl restart "$svc"
sleep 2
echo "After:"
systemctl is-active "$svc"
systemctl status "$svc" --no-pager -l | head -15
echo
echo "If it failed, the reason is in: journalctl -u $svc -b -p err"`);

S('lx-journal-errors','linux','Every error since this boot',['linux'],
'The whole system journal filtered to errors and worse, since the machine last started. Long output is normal; read it from the bottom, because the newest is usually the one that matters and the older ones are often consequences of it.',
String.raw`
journalctl -p err -b --no-pager | tail -60
echo
echo "--- count by unit, so you can see what is noisy ---"
journalctl -p err -b --no-pager -o json 2>/dev/null |
  grep -o '"_SYSTEMD_UNIT":"[^"]*"' | cut -d'"' -f4 | sort | uniq -c | sort -rn | head -10`);

S('lx-dmesg','linux','Hardware and kernel complaints',['linux'],
'The kernel ring buffer with human-readable timestamps, warnings and worse. This is where disk errors, out-of-memory kills, network interface resets and failing hardware show up before anything else notices.',
String.raw`
dmesg -T --level=err,warn 2>/dev/null | tail -40 ||
  sudo dmesg -T --level=err,warn | tail -40
echo
echo "--- anything mentioning I/O errors, which usually means a failing disk ---"
dmesg -T 2>/dev/null | grep -iE "i/o error|ata.*failed|medium error|smart" | tail -10
echo "(nothing above is good news)"`);

S('lx-ip','linux','Addresses, routes and default gateway',['linux'],
'The three things a networking problem always comes down to: does the interface have an address, is there a default route, and does it point somewhere sensible. ifconfig has been deprecated for years - ip is what is actually there.',
String.raw`
echo "--- interfaces with addresses ---"
ip -brief address
echo
echo "--- routing table ---"
ip route
echo
echo "--- default gateway ---"
ip route | awk '/^default/ { print "via " $3 " on " $5 }' || echo "NO DEFAULT ROUTE - that is your problem"
echo
echo "--- link state ---"
ip -brief link`);

S('lx-dns','linux','What is this machine using for DNS',['linux'],
'Where DNS actually comes from, which on a modern distribution is systemd-resolved rather than the /etc/resolv.conf everyone still looks at - that file is frequently a symlink to a stub that says 127.0.0.53 and tells you nothing.',
String.raw`
if command -v resolvectl >/dev/null 2>&1; then
  echo "--- systemd-resolved ---"
  resolvectl status | grep -E "Current DNS|DNS Servers|DNS Domain|Link " | head -20
  echo
  echo "--- test ---"
  resolvectl query google.com 2>&1 | head -5
else
  echo "--- resolv.conf ---"
  cat /etc/resolv.conf | grep -v '^#'
  echo
  command -v dig >/dev/null 2>&1 && dig +short google.com || getent hosts google.com
fi
echo
echo "If /etc/resolv.conf says 127.0.0.53 that is the resolved stub, not the real server."`);

S('lx-dns-flush','linux','Flush the DNS cache',['linux','admin','changes'],
'After a DNS record has been changed and the machine is still using the old answer. Harmless, and it only affects this machine.',
String.raw`
if command -v resolvectl >/dev/null 2>&1; then
  sudo resolvectl flush-caches && echo "systemd-resolved cache flushed"
  resolvectl statistics 2>/dev/null | head -8
elif systemctl is-active nscd >/dev/null 2>&1; then
  sudo systemctl restart nscd && echo "nscd restarted"
elif systemctl is-active dnsmasq >/dev/null 2>&1; then
  sudo systemctl restart dnsmasq && echo "dnsmasq restarted"
else
  echo "No local DNS cache found. This machine asks the server every time,"
  echo "so there is nothing to flush and the stale answer is upstream."
fi`);

S('lx-listening','linux','What is listening, and what put it there',['linux','admin'],
'Every listening socket with the process behind it. Needs sudo to show process names for anything not yours. This answers both "is the service actually up" and "what on earth is that".',
String.raw`
sudo ss -tulpn 2>/dev/null || ss -tuln
echo
echo "--- listening on all interfaces rather than localhost ---"
sudo ss -tulpn 2>/dev/null | awk '$5 ~ /^(0\.0\.0\.0|\*|\[::\]):/ { print }'
echo "Anything above is reachable from the network. Make sure it is meant to be."`);

S('lx-conn','linux','Can this box reach {{IP}}',['linux','net'],
'Works down the layers in order rather than guessing: name resolution, route, ICMP, then the actual TCP port. Each step tells you something different, and the first one that fails is where the problem is.',
String.raw`
target="{{IP}}"
port=443
echo "--- 1. does the name resolve (skip if it is already an address) ---"
getent hosts "$target" || echo "no DNS answer"
echo
echo "--- 2. which route would it take ---"
ip route get "$target" 2>/dev/null || echo "no route to host"
echo
echo "--- 3. does it answer a ping (many hosts block this, so a failure here proves little) ---"
ping -c 2 -W 2 "$target" 2>&1 | tail -3
echo
echo "--- 4. is the port actually open ---"
if command -v nc >/dev/null 2>&1; then
  nc -z -w 3 "$target" "$port" && echo "port $port OPEN" || echo "port $port closed or filtered"
else
  timeout 3 bash -c "cat < /dev/null > /dev/tcp/$target/$port" 2>/dev/null \
    && echo "port $port OPEN" || echo "port $port closed or filtered"
fi`);

S('lx-firewall','linux','Which firewall is running, and what does it allow',['linux','admin'],
'There are four common answers and most machines have more than one installed while only one is doing anything. This finds the one that is actually in charge and prints its rules.',
String.raw`
found=0
if command -v ufw >/dev/null 2>&1 && sudo ufw status 2>/dev/null | grep -q "Status: active"; then
  echo "=== ufw is active ==="; sudo ufw status verbose; found=1
fi
if systemctl is-active firewalld >/dev/null 2>&1; then
  echo "=== firewalld is active ==="
  sudo firewall-cmd --list-all; found=1
fi
if command -v nft >/dev/null 2>&1 && sudo nft list ruleset 2>/dev/null | grep -q .; then
  echo "=== nftables has rules ==="; sudo nft list ruleset | head -40; found=1
fi
if [ "$found" -eq 0 ]; then
  echo "No active ufw, firewalld or nftables ruleset. Checking iptables directly:"
  sudo iptables -L -n -v --line-numbers 2>/dev/null | head -40
fi
echo
echo "Remember the host firewall is only one of three places traffic can be dropped."
echo "The others are a security group or network ACL in front of it, and the"
echo "service itself only binding to 127.0.0.1."`);

S('lx-netmanager','linux','Who is managing the network on this box',['linux'],
'NetworkManager, netplan, systemd-networkd or old-style interfaces files - servers and desktops usually differ, and editing the wrong one changes nothing at all. This tells you which is in charge before you touch anything.',
String.raw`
echo "--- NetworkManager ---"
systemctl is-active NetworkManager 2>/dev/null || echo "not running"
command -v nmcli >/dev/null 2>&1 && nmcli -t -f DEVICE,TYPE,STATE,CONNECTION device 2>/dev/null
echo
echo "--- systemd-networkd ---"
systemctl is-active systemd-networkd 2>/dev/null || echo "not running"
command -v networkctl >/dev/null 2>&1 && networkctl list 2>/dev/null
echo
echo "--- netplan config (Ubuntu) ---"
ls -1 /etc/netplan/*.yaml 2>/dev/null || echo "none"
echo
echo "--- legacy interfaces file ---"
[ -f /etc/network/interfaces ] && echo "/etc/network/interfaces exists" || echo "none"
echo
echo "Edit whichever of these is actually active. Changing the others does nothing."`);

S('lx-whoami','linux','Who am I and what can I do here',['linux'],
'Your identity, your groups and exactly which commands you may run with sudo. Run it before you start, not after something is refused - "permission denied" on a command you assumed you had is a slow way to find out.',
String.raw`
id
echo
echo "--- groups ---"
groups
echo
echo "--- what sudo will let me do ---"
sudo -l 2>&1 | tail -20
echo
echo "--- am I in a container? ---"
systemd-detect-virt --container 2>/dev/null || echo "not a container, or cannot tell"`);

S('lx-user','linux','Everything about {{USER}}',['linux'],
'Account details, group memberships, whether the account or password is locked or expired, shell, home directory and when they last logged in. The whole picture for a "cannot log in" ticket in one place.',
String.raw`
u="{{USER}}"
echo "--- account ---"
getent passwd "$u" || { echo "No such user on this machine."; exit 1; }
echo
echo "--- groups ---"
id "$u"
echo
echo "--- password and account state ---"
sudo passwd -S "$u" 2>/dev/null || echo "(needs sudo)"
sudo chage -l "$u" 2>/dev/null || echo "(needs sudo)"
echo
echo "--- recent logins ---"
last -n 10 "$u" 2>/dev/null
echo
echo "--- failed attempts ---"
sudo faillock --user "$u" 2>/dev/null || sudo pam_tally2 -u "$u" 2>/dev/null || echo "(no faillock or pam_tally2)"
echo
echo "In passwd -S: L means locked, P means a usable password, NP means no password at all."`);

S('lx-authfail','linux','Who has been failing to log in',['linux','admin'],
'Failed SSH and sudo attempts. Read it for two different reasons: a user who cannot get in, and a machine being brute-forced. On an internet-facing box the second is constant and normal, which is itself worth knowing.',
String.raw`
echo "--- failed SSH, most recent last ---"
if journalctl -u ssh -u sshd --no-pager -b 2>/dev/null | grep -qi "failed"; then
  journalctl -u ssh -u sshd --no-pager -b | grep -i "failed password\|invalid user" | tail -25
elif [ -f /var/log/auth.log ]; then
  sudo grep -i "failed password\|invalid user" /var/log/auth.log | tail -25
elif [ -f /var/log/secure ]; then
  sudo grep -i "failed password\|invalid user" /var/log/secure | tail -25
fi
echo
echo "--- top source addresses ---"
{ journalctl -u ssh -u sshd --no-pager -b 2>/dev/null; sudo cat /var/log/auth.log /var/log/secure 2>/dev/null; } |
  grep -oE "from [0-9]{1,3}(\.[0-9]{1,3}){3}" | awk '{print $2}' | sort | uniq -c | sort -rn | head -10
echo
echo "--- failed sudo ---"
{ journalctl --no-pager -b 2>/dev/null; sudo cat /var/log/auth.log /var/log/secure 2>/dev/null; } |
  grep -i "sudo.*authentication failure\|NOT in the sudoers" | tail -10`);

S('lx-sudoers','linux','Who can become root here',['linux','admin'],
'Everyone with administrative rights, from the sudo and wheel groups and from the sudoers files. Worth running on any machine you inherit, and it is the Linux half of a leaver check.',
String.raw`
echo "--- members of sudo / wheel / admin ---"
for g in sudo wheel admin; do
  getent group "$g" 2>/dev/null | awk -F: -v g="$g" '{ if ($4 != "") print g ": " $4 }'
done
echo
echo "--- rules in sudoers and sudoers.d ---"
sudo grep -rhE "^[^#]*ALL" /etc/sudoers /etc/sudoers.d/ 2>/dev/null | grep -v '^Defaults' | sed 's/^/  /'
echo
echo "--- accounts with UID 0 (there should be exactly one: root) ---"
awk -F: '$3 == 0 { print $1 }' /etc/passwd
echo
echo "--- NOPASSWD rules, which are the ones worth questioning ---"
sudo grep -rh "NOPASSWD" /etc/sudoers /etc/sudoers.d/ 2>/dev/null | sed 's/^/  /' || echo "  none"`);

S('lx-sshkeys','linux','Which SSH keys can get into this box',['linux','admin'],
'Every authorized_keys file on the machine with the key comments, which are usually the only clue about whose key it is. A departed colleague’s key sitting in root’s authorized_keys is a common and quiet finding.',
String.raw`
echo "--- authorized_keys by user ---"
for home in /root /home/*; do
  f="$home/.ssh/authorized_keys"
  [ -f "$f" ] || continue
  echo "== $f =="
  sudo awk '!/^#/ && NF { print "   " $1 "  ..." substr($2, length($2)-12) "  " $3 }' "$f" 2>/dev/null
done
echo
echo "--- does the server even allow password logins ---"
sudo sshd -T 2>/dev/null | grep -E "^(passwordauthentication|permitrootlogin|pubkeyauthentication)" ||
  grep -iE "^(PasswordAuthentication|PermitRootLogin)" /etc/ssh/sshd_config 2>/dev/null`);

S('lx-leaver','linux','Disable an account without deleting it',['linux','admin','changes','risk'],
'The right way to offboard on a Linux box. Locks the password, expires the account, removes their keys and ends any session they have open - but leaves the files and the UID alone, because deleting a user orphans everything they own and you cannot undo it. <b>Read every line before you run it.</b>',
String.raw`
u="{{USER}}"
echo "This will disable $u. Review each command before running it."
echo
echo "# 1. Lock the password and expire the account"
echo "sudo usermod --lock --expiredate 1 $u"
echo
echo "# 2. Stop them using a shell"
echo "sudo usermod --shell /usr/sbin/nologin $u"
echo
echo "# 3. Remove their SSH keys, keeping a copy first"
echo "sudo cp /home/$u/.ssh/authorized_keys /root/$u-authorized_keys.bak"
echo "sudo truncate -s 0 /home/$u/.ssh/authorized_keys"
echo
echo "# 4. End any session they have open right now"
echo "sudo pkill -KILL -u $u"
echo
echo "# 5. Check what they own before anybody talks about deleting the account"
echo "sudo find / -xdev -user $u -printf '%p\n' 2>/dev/null | head -50"
echo
echo "Deleting the user is a separate decision made later. A UID gets reused,"
echo "and then the next person to hold it owns all of their old files."`);

S('lx-perms','linux','Why can nobody read {{FILE}}',['linux'],
'Ownership and mode of the file and of every directory above it, because a perfectly readable file inside a directory without execute permission is unreachable. That is the answer far more often than the file itself.',
String.raw`
f="{{FILE}}"
echo "--- the file ---"
ls -l "$f" 2>/dev/null || echo "does not exist, or you cannot see the directory it is in"
echo
echo "--- the whole path down to it ---"
namei -l "$f" 2>/dev/null || {
  p="$f"
  while [ "$p" != "/" ]; do ls -ld "$p" 2>/dev/null; p=$(dirname "$p"); done
}
echo
echo "--- extended attributes and ACLs ---"
lsattr "$f" 2>/dev/null
getfacl "$f" 2>/dev/null | grep -v '^#'
echo
echo "--- SELinux or AppArmor, which deny things that look permitted ---"
command -v getenforce >/dev/null 2>&1 && echo "SELinux: $(getenforce)"
command -v aa-status >/dev/null 2>&1 && sudo aa-status --enabled 2>/dev/null && echo "AppArmor: enabled"
echo
echo "A directory needs x, not r, for anything inside it to be reachable."`);

S('lx-updates','linux','What updates are waiting',['linux','net','admin'],
'Pending updates, and separately which of them are security updates, on either family. Read-only - it lists, it does not install.',
String.raw`
if command -v apt-get >/dev/null 2>&1; then
  echo "=== Debian / Ubuntu ==="
  sudo apt-get update -qq
  apt list --upgradable 2>/dev/null | tail -n +2
  echo
  echo "--- security updates among them ---"
  apt list --upgradable 2>/dev/null | grep -i security | wc -l
  echo
  [ -f /var/run/reboot-required ] && cat /var/run/reboot-required || echo "No reboot flagged."
elif command -v dnf >/dev/null 2>&1; then
  echo "=== RHEL family ==="
  sudo dnf check-update 2>/dev/null | tail -n +3
  echo
  echo "--- security updates among them ---"
  sudo dnf updateinfo list security 2>/dev/null | tail -20
  echo
  command -v needs-restarting >/dev/null 2>&1 && sudo needs-restarting -r
else
  echo "Neither apt nor dnf found. Check zypper, pacman or apk by hand."
fi`);

S('lx-pkg','linux','Find and install a package on either family',['linux','net','admin','changes'],
'Works out which package manager is present and searches for whatever you put in the App box, then shows you the install command rather than running it. Installing software on somebody else’s server is a decision, not a step.',
String.raw`
pkg="{{APP}}"
if command -v apt-get >/dev/null 2>&1; then
  echo "=== apt ==="
  apt-cache search "$pkg" | head -10
  echo
  echo "Installed version, if any:"
  dpkg -l "$pkg" 2>/dev/null | tail -1
  echo
  echo "To install:  sudo apt-get install -y $pkg"
elif command -v dnf >/dev/null 2>&1; then
  echo "=== dnf ==="
  dnf search "$pkg" 2>/dev/null | head -10
  echo
  echo "Installed version, if any:"
  rpm -q "$pkg" 2>/dev/null
  echo
  echo "To install:  sudo dnf install -y $pkg"
else
  echo "Neither apt nor dnf. Try: zypper se $pkg   or   pacman -Ss $pkg"
fi`);

S('lx-whichpkg','linux','Which package put this file here',['linux'],
'Traces a file back to the package that installed it, which tells you what to reinstall when a binary has gone missing or been modified, and who to blame when something appeared that nobody remembers installing.',
String.raw`
f="{{FILE}}"
if command -v dpkg >/dev/null 2>&1; then
  dpkg -S "$f" 2>/dev/null || echo "Not owned by any package - installed by hand, or from a tarball."
  echo
  p=$(dpkg -S "$f" 2>/dev/null | cut -d: -f1)
  [ -n "$p" ] && echo "Reinstall with:  sudo apt-get install --reinstall $p"
elif command -v rpm >/dev/null 2>&1; then
  rpm -qf "$f" 2>/dev/null || echo "Not owned by any package."
  echo
  p=$(rpm -qf --qf '%{NAME}' "$f" 2>/dev/null)
  [ -n "$p" ] && echo "Reinstall with:  sudo dnf reinstall $p"
else
  echo "No dpkg or rpm on this machine."
fi`);

S('lx-reboot','linux','Does it need a reboot, and why',['linux'],
'Whether a restart is actually pending, and which running processes are still using libraries that have since been replaced - which is the real reason a patched machine is still vulnerable until it is restarted.',
String.raw`
echo "--- flagged? ---"
if [ -f /var/run/reboot-required ]; then
  cat /var/run/reboot-required
  cat /var/run/reboot-required.pkgs 2>/dev/null | sed 's/^/  /'
elif command -v needs-restarting >/dev/null 2>&1; then
  sudo needs-restarting -r
else
  echo "No reboot flag found."
fi
echo
echo "--- running kernel vs newest installed ---"
echo "running: $(uname -r)"
ls -1 /boot/vmlinuz-* 2>/dev/null | sed 's|.*/vmlinuz-||' | sort -V | tail -1 | sed 's/^/newest : /'
echo
echo "--- processes using deleted libraries ---"
sudo lsof -nP 2>/dev/null | awk '/DEL.*lib/ { print $1, $2 }' | sort -u | head -15
echo "(those are still running the old code until they restart)"`);

S('lx-display','linux','Displays, resolution and which graphics stack',['linux'],
'For a Linux desktop with a monitor problem. Tells you whether the session is Wayland or X11 first, because half the advice on the internet only applies to one of them and it is usually the other one.',
String.raw`
echo "session type: $XDG_SESSION_TYPE"
echo "desktop     : $XDG_CURRENT_DESKTOP"
echo "(blank above means the variable is not set, which usually means you are"
echo " on a console or over SSH rather than in a graphical session)"
echo
if [ "$XDG_SESSION_TYPE" = "x11" ] && command -v xrandr >/dev/null 2>&1; then
  xrandr --query | grep -E " connected|^Screen"
elif command -v wlr-randr >/dev/null 2>&1; then
  wlr-randr
else
  echo "--- connected outputs, from the kernel ---"
  for c in /sys/class/drm/card*/status; do
    [ -f "$c" ] && echo "$(basename "$(dirname "$c")"): $(cat "$c")"
  done
fi
echo
echo "--- graphics hardware and driver ---"
lspci -k 2>/dev/null | grep -A3 -iE "vga|3d|display" | head -12`);

S('lx-audio','linux','No sound on a Linux desktop',['linux'],
'Which audio server is running, what it thinks the default output is, and whether anything is muted. PipeWire has replaced PulseAudio on most current distributions, and the commands differ.',
String.raw`
echo "--- which audio server ---"
if command -v wpctl >/dev/null 2>&1 && systemctl --user is-active pipewire >/dev/null 2>&1; then
  echo "PipeWire"
  wpctl status | head -30
  echo
  echo "default sink volume:"
  wpctl get-volume @DEFAULT_AUDIO_SINK@ 2>/dev/null
elif command -v pactl >/dev/null 2>&1; then
  echo "PulseAudio"
  pactl info | grep -E "Server Name|Default Sink"
  echo
  pactl list short sinks
  pactl list sinks | grep -E "Name:|Mute:|Volume:" | head -12
else
  echo "Neither wpctl nor pactl. Falling back to ALSA:"
  aplay -l 2>/dev/null
  amixer 2>/dev/null | head -20
fi
echo
echo "--- is anything muted ---"
amixer 2>/dev/null | grep -i "\[off\]" && echo "^ something is muted" || echo "nothing muted at the ALSA level"`);

S('lx-wifi','linux','Wifi on a Linux laptop',['linux','net'],
'Whether the radio is on, what it is connected to and how good the signal is. Needs NetworkManager, which is on desktops and almost never on servers.',
String.raw`
if ! command -v nmcli >/dev/null 2>&1; then
  echo "nmcli is not here, so NetworkManager is probably not managing this machine."
  echo "Run the network manager script to find out what is."
  exit 0
fi
echo "--- radio ---"
nmcli radio
echo
echo "--- devices ---"
nmcli -t -f DEVICE,TYPE,STATE,CONNECTION device | grep wifi
echo
echo "--- current connection and signal ---"
nmcli -f IN-USE,SSID,SIGNAL,RATE,SECURITY device wifi list | head -12
echo
echo "To reconnect:      nmcli device disconnect <dev> && nmcli device connect <dev>"
echo "To join a network: nmcli device wifi connect \"<SSID>\" password \"<password>\""
echo
echo "SIGNAL under about 40 is where things start dropping."`);

S('lx-collect','linux','Collect everything into one file for the ticket',['linux'],
'Runs the read-only checks in one pass and writes them to a file in /tmp with a timestamp. Attach that rather than pasting output a piece at a time - it gives whoever picks the ticket up next the whole picture instead of the one command you happened to run.',
String.raw`
out="/tmp/triage-$(hostname -s)-$(date +%Y%m%d-%H%M%S).txt"
{
  echo "=== collected $(date) on $(hostname -f 2>/dev/null || hostname) ==="
  echo
  echo "### identity"; hostnamectl 2>/dev/null || uname -a
  echo; echo "### uptime and load"; uptime; echo "cores: $(nproc)"
  echo; echo "### memory"; free -h
  echo; echo "### disk"; df -hT -x tmpfs -x devtmpfs -x squashfs
  echo; echo "### inodes"; df -i -x tmpfs -x devtmpfs -x squashfs
  echo; echo "### failed units"; systemctl --failed --no-pager
  echo; echo "### top by cpu"; ps -eo pid,user,pcpu,pmem,args --sort=-pcpu | head -11
  echo; echo "### top by memory"; ps -eo pid,user,pcpu,pmem,args --sort=-rss | head -11
  echo; echo "### network"; ip -brief address; echo; ip route
  echo; echo "### listening"; ss -tuln
  echo; echo "### recent errors"; journalctl -p err -b --no-pager 2>/dev/null | tail -40
} > "$out" 2>&1
echo "Written to: $out"
ls -lh "$out"
echo
echo "Copy it off with:  scp $(whoami)@$(hostname -s):$out ."`);

const GUIDES = [
{id:'g-software', title:'Software install or update request', sub:'Usually the biggest category of all',
 steps:[
  'This is a request, not a fault. Most of these come down to a standard user having no rights to install or update anything, so treat it as routine work rather than troubleshooting.',
  'Check it is approved. If colleagues already have it, carry on. If it is new to the business, it needs signing off before anything is installed.',
  'Check whether it is already on the machine before you install anything. Half of these tickets are an app that is installed but not found. [[find-app]] [[installed-apps]]',
  'Check winget is there, then find the exact package Id. Put the name in the App box at the top first. [[winget-check]] [[winget-search]]',
  'Before you install anything, see what else on the machine is out of date. People raise one app and three more are due. One visit beats three. [[winget-outdated]]',
  'Install or update. Warn the user first, because the app closes while it works. [[winget-install]] [[winget-upgrade-one]]',
  'If an install fails, check the installer events before retrying. 1603 is usually a pending reboot or a file in use. [[install-failures]] [[pending-reboot]]',
  'On a Mac, macOS updates go through Software Update rather than winget. [[mac-updates]]',
  'Removing something rather than adding it, or clearing a broken install before you retry. [[winget-uninstall]]',
  'A machine that is badly behind on everything, agreed with the user in advance. [[winget-upgrade-all]]',
  'Close the loop: confirm the version with the user rather than assuming it took.'
 ]},
{id:'g-vpn', title:'VPN will not connect', sub:'No access to internal systems, stuck connecting',
 steps:[
  'First, read the message properly. Does it say it cannot connect, or is it asking to update? A client asking to update is a request, not a fault.',
  'Check plain internet works with the VPN off. If that fails too, the VPN is not the problem and you are in the wrong guide.',
  'Find out which client is installed, whether its service is running and whether a tunnel adapter actually came up. That last one is the honest answer, whatever the client says on screen. [[vpn-status]]',
  'Read the client logs. They say why it failed, which beats the message on screen every time. Attach the newest one to the ticket. [[vpn-logs]]',
  'Restart the client service. This drops any live tunnel, so not over a remote session that depends on it, and tell the user first. [[vpn-restart]]',
  'Check DNS resolves internal names once connected. A tunnel that is up but cannot resolve anything looks identical to the user. [[dns-lookup]] [[flush-dns]]',
  'Check the clock. More than a few minutes out and certificate-based authentication will fail with a message that mentions neither time nor certificates.',
  'If the client is old, update it. [[winget-upgrade-one]]',
  'Still stuck: note the exact error wording, attach the log, and escalate to whoever owns the concentrator.'
 ]},
{id:'g-slow', title:'PC is slow', sub:'Sluggish, freezing, takes ages to open things',
 steps:[
  'Ask what slow means: slow to boot, slow all the time, one app slow, or slow since a certain day. It changes where you look.',
  'Take the snapshot first so you know what you are dealing with: model, age, RAM, uptime. [[sys-snapshot]]',
  'Check uptime in Task Manager, Performance tab. A huge number of slow PCs have not been restarted in weeks, and Fast Startup means shutting down does not reset it - only Restart does. [[pending-reboot]]',
  'Open Task Manager (Ctrl + Shift + Esc), go to Performance and watch CPU, Memory and Disk for a minute of normal use. Memory above about 85% means RAM pressure. Disk pinned at 100% suggests a failing drive or an AV scan.',
  'Find the culprit processes. [[top-cpu]] [[top-mem]]',
  'Check free space. Under 10% free on C: will slow everything down. [[disk-space]] [[clear-temp]] [[big-folders]]',
  'Review startup apps in Task Manager > Startup apps. Never disable security, VPN or management agents. [[startup-items]]',
  'Check disk health and power plan. [[disk-health]] [[power-plan]]',
  'If Windows itself is odd, repair system files. [[sfc-dism]]',
  'Look at what the machine has been complaining about. [[recent-errors]] [[app-crashes]]',
  'On a laptop that is slow and hot, check the battery: a worn one throttles the whole machine. [[battery-report]]',
  'Run perfmon /rel (Reliability Monitor) for a timeline of crashes and failed updates.',
  'If one app is slow rather than the whole machine, that is a different problem: check its own logs, and whether it is waiting on the network or a mapped drive rather than on this PC.',
  'If the hardware is simply underpowered, raise it for replacement rather than chasing software fixes. Put the model, age and RAM from the first step on the ticket.'
 ]},
{id:'g-mac', title:'Mac triage', sub:'Where to start on a MacBook',
 steps:[
  'Everything else in this toolkit is Windows. On a Mac, open Terminal (Command + Space, type Terminal) and paste these instead.',
  'Start with the snapshot: model, serial, chip, macOS version, uptime and free space. [[mac-snapshot]] [[mac-serial]]',
  'Slow or hot: check what is using the CPU and memory, then check disk space. [[mac-top]] [[mac-disk]]',
  'Network problems: interfaces, router, DNS and Wi-Fi in one pass, then flush DNS if names are not resolving. [[mac-network]] [[mac-dns-flush]]',
  'macOS asking to update is a request, not a fault. [[mac-updates]]',
  'No sound or no microphone: restart Core Audio. Fixes more than you would expect. [[mac-audio]]',
  'Screen not detected: check what the Mac can actually see before touching settings. [[mac-displays]]',
  'Frozen Finder or Dock. [[mac-finder]]',
  'Slack playing up on a Mac. [[mac-slack-cache]]',
  'Battery complaints: cycle count and condition. [[mac-battery]]',
  'What is actually installed, with dates. [[mac-apps]]',
  'Before you close it off, check FileVault, the firewall and MDM enrolment are all as they should be. [[mac-security]]',
  'Put what you found and what you changed on the ticket before you hand it on.'
 ]},
{id:'g-slack', title:'Slack not working', sub:'Will not load, blank screen, sign-in loop, no audio',
 steps:[
  'If it is asking to update, that is a request. [[slack-version]] [[winget-upgrade-one]]',
  'Check status.slack.com. If Slack is having an incident then everyone is affected and there is nothing to fix at this end.',
  'Fully quit Slack from the system tray, not just the window, and reopen. Then try slack.com in a browser: if the browser works, it is the desktop app.',
  'Clear the cache. This fixes most of them. [[slack-cache]]',
  'Wrong account or cannot sign in: Slack SSO follows whichever work identity the browser is already signed into, so check that before touching Slack itself. [[chrome-profiles]]',
  'No audio in a Slack huddle: check the Windows device list and then Slack Preferences, Audio and video. They keep separate lists. [[call-apps-audio]] [[audio-devices]] [[audio-restart]]',
  'Last resort, and ask the user first because drafts go with it. [[slack-reset]]',
  'On a Mac. [[mac-slack-cache]]'
 ]},
{id:'g-gmail', stack:'google', title:'Gmail and Google sign-in problems', sub:'Cannot sign in, wrong account, mail missing',
 steps:[
  'Check which accounts the browser is signed into. A personal Gmail alongside the work account is the single most common cause, and the error looks exactly like a wrong password. [[chrome-profiles]]',
  'Sign out of all accounts and back in with work only, or give work its own Chrome profile.',
  'Check they are using the right address. Plenty of places run more than one mail domain, so it is whichever one their own address ends with, not a guess based on a colleague.',
  'Try an incognito window. If it works there, it is a stale saved session or the wrong account being remembered.',
  'Mail appears to have vanished: check Spam, then Settings, See all settings, Filters and blocked addresses. A filter set up months ago quietly archiving things is the usual answer.',
  'Could not send: check the address character by character and keep any bounce-back message. The wording usually identifies the problem on its own.',
  'A locked Windows account is a separate job with its own guide. [[net-user]] [[lockout-source]]'
 ]},
{id:'g-gdrive', stack:'google', title:'Google Drive not syncing', sub:'Files not appearing, stuck uploading, no G: drive',
 steps:[
  'Click the Drive icon and read the error. Common ones: file name has invalid characters, path too long, file open in another app, out of storage.',
  'Check they are signed in to the right account in Drive settings.',
  'Restart Drive for desktop. [[gdrive-restart]]',
  'Check there is free disk space, because Drive stops syncing when the disk fills. [[disk-space]]',
  'A laptop filling up for no obvious reason is often a folder set to Available offline. [[gdrive-space]]',
  'Still stuck: reset the local cache. Check the Drive window for pending uploads first, warn about the re-scan. [[gdrive-reset]]',
  'Sign-in loop: check which Google account the browser is on. [[chrome-profiles]]'
 ]},
{id:'g-outlook', stack:'microsoft', title:'Outlook problems', sub:'Will not open, disconnected, search broken, mailbox enormous',
 steps:[
  'Classic Outlook or new Outlook? Ask first, because they share almost no troubleshooting and plenty of people have both. [[ol-which]]',
  'Read the status bar at the bottom. "Disconnected" or "Working offline" is a different fault from a crash, and Work Offline is a toggle somebody has usually pressed by accident.',
  'Try Outlook on the web. If the mail is all there, the problem is local and nothing server-side needs touching.',
  'Will not open or crashes on launch: start in safe mode to rule out add-ins. If it behaves there, disable COM add-ins one at a time. [[ol-safe]]',
  '"Cannot start Microsoft Outlook. Cannot open the Outlook window" is the navigation pane, and there is a switch for it in the same script.',
  'Now look at the data files, because this is where most of the interesting problems live. [[ol-datafiles]]',
  'Search not finding anything, folders stuck, stale mail, or a data file error: rebuild the OST. It loses nothing, but it re-downloads the whole mailbox, so pick the time with them. [[ol-rebuild-ost]]',
  'An OST over about 40 GB is a problem in itself, and shortening how much is kept offline usually helps more than deleting mail. [[ol-cached]]',
  'A PST that will not open needs the Inbox Repair Tool. Copy the PST somewhere safe first. And if it is sitting on a network drive, that is your root cause, not the corruption. [[ol-scanpst]]',
  'Odd behaviour that follows the user rather than the machine: check for a stray second profile. [[ol-profiles]]',
  'Endless password prompts are an identity fault, not an Outlook one. [[ms-identity]] [[ms-creds]] [[ms-wam-reset]]',
  'Still broken after all that: repair Office, then check it is up to date. [[ms-office-repair]] [[ms-office-update]]',
  'If the mailbox itself looks wrong, quota, forwarding or type, check the server side. [[ms-mailbox]]'
 ]},
{id:'g-msauth', stack:'microsoft', title:'Office keeps asking for a password', sub:'Sign-in loop, repeated prompts, will not stay signed in',
 steps:[
  'Resist resetting the password. If the password were wrong they would get an error, not a loop. This is nearly always a broken token, and a reset just creates a second problem.',
  'Check the device identity. AzureAdPrt NO means single sign-on is dead and every Microsoft app will nag until it is back. [[ms-identity]]',
  'If the PRT is missing or stale, clear the token broker cache and re-register the device. This is the fix for most of these. [[ms-wam-reset]]',
  'Clear old saved credentials, which otherwise keep re-presenting a stale password. [[ms-creds]]',
  'If Office specifically complains about the licence or is signed in as the wrong person, clear its identity cache. [[ms-office-identity]]',
  'Find out what the service actually said. The error code names the cause: 50126 wrong password, 50076 or 50079 MFA needed, 53003 blocked by Conditional Access, 50053 locked. [[ms-signin-logs]]',
  'A 53003 is policy doing its job, not a fault. Check whether the device is compliant and enrolled before you argue with it. [[ms-intune-sync]]',
  'If it is one app and not the others, repair that app rather than chasing identity further. [[ms-office-repair]]'
 ]},
{id:'g-msleaver', stack:'microsoft', title:'Leaver: the Microsoft side', sub:'Sessions, mailbox, licence, in the order that works',
 steps:[
  'Agree the date and whether the exit is immediate before you touch anything. An immediate exit reverses the order below: revoke first, ask questions after.',
  'Connect to the services. Both modules install per user and only need doing once on a machine. [[ms-connect]]',
  'Look at the mailbox before you change it: size, type, existing forwarding, any hold. A mailbox on litigation hold is not yours to convert. [[ms-mailbox]]',
  'Revoke every active session. This is the step people skip. Resetting a password does not sign anyone out, and a phone with a live token keeps working for hours. [[ms-revoke]]',
  'Check whether their Desktop and Documents were actually redirected to OneDrive before anyone wipes the device, because if Known Folder Move was off those files are local only. [[ms-kfm]]',
  'Convert the mailbox, set forwarding and grant delegate access. Read each line before you run it and agree the recipient with HR first. [[ms-leaver]]',
  'Only then reclaim the licence. Converting to a shared mailbox first is what makes that safe.',
  'Write down what you removed and when. On the day someone asks whether an account was really closed, that note is the only answer you will have.'
 ]},
{id:'g-teams', stack:'microsoft', title:'Teams not working', sub:'Will not load, blank screen, no audio, missing chats',
 steps:[
  'Quit Teams properly from the system tray rather than closing the window, then reopen. Then try teams.microsoft.com: if the browser is fine, it is the desktop app.',
  'Clear the cache. This fixes the majority of Teams faults on its own. [[ms-teams-cache]]',
  'No audio or no microphone: check the Windows device list, then check inside Teams, because they keep separate lists and disagree. [[call-apps-audio]] [[audio-devices]] [[audio-restart]]',
  'No camera: privacy shutter, function key, then Windows Settings, Privacy, Camera.',
  'Keeps asking to sign in: that is identity, not Teams. [[ms-identity]] [[ms-wam-reset]] [[ms-creds]]',
  'Poor call quality: check the Wi-Fi signal and whether the VPN is dragging call traffic the long way round. [[wifi-info]] [[conn-owners]]',
  'Nothing has worked: full reset, and warn them that anything unsent goes with it. [[ms-teams-reset]]'
 ]},
{id:'g-onedrive', stack:'microsoft', title:'OneDrive not syncing', sub:'Red X, stuck processing, files missing',
 steps:[
  'Click the cloud icon and read the error. Invalid characters in a file name, a path too long, a file open in another app and a full quota cover most of them.',
  'Check they are signed into the right account in OneDrive settings. A personal account signed in alongside the work one causes chaos.',
  'Pause sync, wait, resume. Sounds trivial, clears a surprising number.',
  'Reset OneDrive. Nothing is deleted, but it re-scans from scratch, which takes a while on a large library. [[ms-onedrive-reset]]',
  'Check there is actually free disk space, because OneDrive stops quietly when there is not. [[disk-space]]',
  'Before anyone wipes the machine, confirm whether Desktop and Documents are really redirected into OneDrive. If Known Folder Move is off, they are local only and a rebuild loses them. [[ms-kfm]]',
  'Stuck at sign-in: identity again. [[ms-wam-reset]] [[ms-creds]]'
 ]},
{id:'g-display', title:'Second monitor / display problems', sub:'Screen not detected, wrong input, some screens blank',
 steps:[
  'Work out how the desk is wired first, because the three types fail for completely different reasons. Screens chained one into the next off a desktop, which is the usual hotdesk setup; a laptop into a dock; or a laptop into a screen that is acting as the dock.',
  'Read what the blank screen says. No signal or check cable means the screen is fine and is not being sent a picture. Completely black with no light means power.',
  'Change the input on the screen itself. Buttons are on the monitor, under the bottom edge or round the back. On a hotdesk the person before may have left it on a different input.',
  'Count which screens are blank and where they sit in the line. Chained screens blank after a certain point means the break is at the last one that still works. All blank means the first cable. On a dock, one blank means that screen or cable, all blank means the dock.',
  'Chained screens: check each one is allowed to pass the picture along. Look for DisplayPort 1.2, DP 1.2, MST or Multi-Stream in the monitor menu and switch it on for every screen except the last in the line. It turns itself off after a screen swap or reset, which is why this bites hotdesks most.',
  'Power things down in the right order. Chained screens: each off at its own button, ten seconds, back on starting nearest the computer. Dock: unplug its power and the laptop cable, ten seconds, power first then laptop. Leave the wall and floor sockets alone.',
  'Make Windows look again. Windows + P then Extend, or Settings, System, Display, Detect. Windows + Ctrl + Shift + B restarts the graphics driver. [[monitors]]',
  'Swap a cable between two screens. If the fault moves with the cable it is the cable; if it stays put it is the screen.',
  'Update the display and dock drivers, and check for device problems. [[drivers]] [[problem-devices]]',
  'On a Mac. [[mac-displays]]',
  'Put the desk number in the ticket, especially on a hotdesk. One bad morning is a ticket; the same desk three times is kit we should replace.'
 ]},
{id:'g-internet', title:'No internet / network not working', sub:'No connection, limited connectivity, some sites fail',
 steps:[
  'Is it just this PC or everyone nearby? If everyone, it is the network: escalate to networks.',
  'Check the basics: cable seated, Wi-Fi on, airplane mode off, dock lights on.',
  'Look at the IP. A 169.254.x.x address means DHCP failed. No gateway means no route out. [[net-overview]]',
  'Test in stages: gateway, then an internal server, then the internet. [[test-port]] [[traceroute]]',
  'If names do not resolve but IPs work, it is DNS. [[dns-lookup]] [[flush-dns]]',
  'If some apps work and others do not, check the proxy. [[proxy-check]]',
  'On Wi-Fi, check signal and band, and look at the saved profiles if it keeps joining the wrong network. [[wifi-info]] [[wifi-profiles]]',
  'Confirm what the machine is actually going out as. Useful for checking the VPN is carrying the traffic. [[public-ip]]',
  'If some apps work and others do not, check the firewall and what is listening locally. [[firewall-status]] [[listening-ports]]',
  'Still stuck: reset the network stack and reboot. Not over a remote session, you will lose the connection. [[net-reset]]',
  'Check for a network adapter with a warning and update or reinstall its driver. [[problem-devices]]',
  'On a Mac. [[mac-network]] [[mac-dns-flush]]'
 ]},
{id:'g-audio', title:'No sound / microphone not working', sub:'Speakers, headset or mic issues',
 steps:[
  'Wireless or wired? Wireless headsets go wrong on charge and pairing; wired ones go wrong on cables and ports. It changes what you check first.',
  'Wireless: charge it for ten minutes, then check it has not quietly reconnected to a phone in their pocket or a meeting room machine it was paired with before.',
  'Click the speaker icon and check the right output device is selected and not muted. [[audio-devices]]',
  'Check the mute they cannot see: the one in the meeting, and a button or boom-arm switch on the headset itself.',
  'Restart the audio service. [[audio-restart]]',
  'Mic: Settings, Privacy and security, Microphone, allow access for apps and desktop apps.',
  'Check inside the calling app as well. Meet, Zoom and Slack each keep their own device list and they disagree. [[call-apps-audio]]',
  'USB headset: try another port and avoid unpowered hubs. Bluetooth: remove the pairing and re-pair from scratch.',
  'If it is only broken inside Zoom, clear its cache. [[zoom-cache]]',
  'Swap it with a colleague to prove whether it is the headset or the machine. That one answer decides whether we order a replacement or look at the PC.',
  'On a Mac. [[mac-audio]]'
 ]},
{id:'g-locked', title:'Account locked out / cannot log in', sub:'Locked, expired password, keeps locking again',
 steps:[
  'Check the obvious two first: Caps Lock, and the keyboard set to the wrong language.',
  'Check the account state: locked, disabled or password expired. This works on any domain-joined machine, no RSAT needed. [[net-user]]',
  'Check they are using the right sign-in name. Windows wants firstname.lastname on its own; anything in a browser wants the full work email address.',
  'If it is "access denied" rather than a failed sign-in, confirm which account the session is actually running as and what groups it carries. [[whoami]]',
  'Unlock it. Without RSAT on the machine you are sat at, that means ADUC on a jump box or the DC, or whoever holds those rights.',
  'If it locks again within minutes something is still presenting the old password. Find the machine it is coming from. [[lockout-source]]',
  'Check policy is reaching the machine at all, since a half-applied policy causes odd auth behaviour. [[gpresult]] [[gpupdate]]',
  'Usual culprits: a phone mail app, a mapped drive with saved credentials, a disconnected RDP session, a scheduled task, or Credential Manager. [[cred-list]]',
  'If the password was reset while the laptop was off the network, get them on VPN or in the office, lock the screen with Windows + L and unlock with the new password so the cached copy updates.',
  'Verify identity properly before any reset, especially over the phone.'
 ]},
{id:'g-locked-file', title:'File will not delete, rename or save', sub:'"The file is in use by another program"',
 steps:[
  'Get the exact path and put it in the File box at the top. Just the file name works too.',
  'Ask what they were doing. A file open in Excel or a PDF reader on another machine is the answer more often than anything technical.',
  'Find out what is holding it. This checks the three places the answer usually is: open over a share, an Office lock file that names the person, or a process on this machine. [[locked-file]]',
  'If the answer is a process on this machine, close that app properly rather than killing it, so nothing is lost.',
  'If it is open over a share, the person holding it is named. Ask them to close it before you force anything - forcing it loses whatever they had not saved.',
  'An Office document left locked after a crash leaves a ~$ file behind that names whoever had it. Once they have genuinely closed the document, that lock file is safe to delete.',
  'Explorer itself is a common culprit on a folder that will not delete, usually a thumbnail or preview handler. Restart it and try again. [[restart-explorer]]',
  'A file left locked by something that has since crashed usually clears on a restart. Worth saying so before you go further.',
  'Never just kill the owning process on a file the user is editing. Ask first, every time.'
 ]},
{id:'g-suspicious', title:'Suspicious process or connection', sub:'Unknown process, odd traffic, possible compromise',
 steps:[
  'Do not kill the process or delete files yet. That destroys evidence. Note the time, the PID and what you have seen.',
  'Inspect the process: path, signature, parent and command line. Put its name in the Process box. [[proc-inspect]]',
  'See what it is listening on, and what it is connected to. [[listening-ports]]',
  'Red flags: runs from AppData, Temp, ProgramData or Public; signature not Valid; parent is a document, a browser, cmd, powershell or rundll32; encoded or obfuscated command line. [[procs-userpaths]] [[unsigned-procs]]',
  'Look up a specific address rather than sweeping everything. Put it in the IP box. [[ip-lookup]]',
  'Only if you need the full picture, and knowing it sends every address to a third party. [[conn-owners]]',
  'Check the file itself. Put the path in the File box. [[file-hash]] [[file-sig]]',
  'Look for persistence in the places it usually hides: scheduled tasks, Run keys and startup folders, and anything newly written. [[sched-tasks]] [[startup-items]] [[new-exes]]',
  'These cover the common locations, not all of them. Services, drivers, WMI subscriptions and logon scripts can all hold persistence too, and finding those properly is an incident response job rather than a desk-side one.',
  'Check logons, and PowerShell history if the investigation warrants it. [[failed-logons]] [[success-logons]] [[ps-history]]',
  'Check Defender, the firewall, the hosts file and what the machine has been resolving. When you are ready to clean up rather than observe, update signatures and scan. [[defender-status]] [[defender-scan]] [[firewall-status]] [[hosts-check]] [[dns-cache]]',
  'Check who has been signing in, and who holds local admin on this machine. [[local-admins]] [[rdp-logons]]',
  'If anything fails the checks, isolate the machine from the network (do not power it off) and escalate as a potential incident.'
 ]},
{id:'g-disk', title:'Disk full', sub:'Low disk space warnings, updates failing for space',
 steps:[
  'See how bad it is. [[disk-space]]',
  'Measure what could be freed before deleting anything. It prints a size against each candidate and the command for it, so you can tell the user what you are about to reclaim rather than guessing. [[disk-reclaim]]',
  'Clear temp files - the safest win and usually a quick one. [[clear-temp]]',
  'When you are ready to actually clear the safe ones, run that same script as <span class="mono">Reclaim-Disk -Clear</span>. <b>Mention the Recycle Bin first</b> - it empties it for every user and plenty of people treat it as a filing system.',
  'On a shared or hot-desked machine the space is almost never theirs: every person who has ever logged in left a profile behind. It needs admin rights, so it is ours to fix, not something they have done wrong. This works out who is sat at the machine, protects them along with anything running and anything a service depends on, lists what it protected and why, then asks you about everyone else one at a time. <b>Start it with -DryRun</b> for the read-only view. <b>Agree it with the person in front of you</b> - a profile takes their desktop, saved passwords and any local Outlook data with it, and there is no undo. [[disk-profiles-clean]]',
  'Find what is actually big. [[big-folders]] [[big-files]]',
  'Check whether a file-sync client is holding a large offline cache, which is a common reason a laptop fills up for no obvious reason. [[gdrive-space]] [[ms-kfm]]',
  'Still tight? The component store is the last big one, and it is often gigabytes on an older build: <span class="mono">Dism.exe /Online /Cleanup-Image /StartComponentCleanup</span>. It can take twenty minutes and should not be interrupted, so not during a call.',
  'Ask before touching Downloads or anything personal. Freeing space by deleting someone&rsquo;s files is how you turn one ticket into two.',
  'On a Mac, start with the disk report, then the reclaim script - which covers purgeable space, the thing that makes a Mac behave as though it is full while Finder insists it is not. [[mac-disk]] [[mac-reclaim]]'
 ]},
{id:'g-bsod', title:'Blue screens / random restarts', sub:'Crashes, unexpected shutdowns',
 steps:[
  'Get the history: when, how often, which stop code. [[bsod-history]] [[reboot-history]]',
  'The same stop code every time usually means one driver. Different codes each time points to hardware: RAM, disk or overheating.',
  'Check device and driver problems, and update display, network, dock and chipset drivers from the manufacturer. [[problem-devices]] [[drivers]]',
  'Check the disk and repair system files. [[disk-health]] [[sfc-dism]]',
  'Test RAM: run mdsched.exe and choose restart now.',
  'Event 41 with no bugcheck means power was lost. Check the supply, the battery and whether it is overheating.',
  'Did it start after an update? [[hotfixes]]',
  'Put the bugcheck code, the faulting driver and what you have already tried on the ticket before you escalate. The code alone is what the next person needs.'
 ]},
{id:'g-updates', title:'Windows Update failing', sub:'Stuck downloading, error codes, keeps failing',
 steps:[
  'Confirm which build they are actually on before you chase an update. [[os-version]]',
  'Reboot first and check nothing is pending. [[pending-reboot]]',
  'Check free space: updates need 10 GB or more. [[disk-space]]',
  'Note the error code in Settings, Windows Update, Update history and search it.',
  'Reset Windows Update components, reboot, try again. [[wu-reset]] [[wu-open]]',
  'Repair system files. [[sfc-dism]]',
  'If one update fails repeatedly, get it from the Microsoft Update Catalog and install it manually.'
 ]},
{id:'g-trust', title:'Trust relationship failed', sub:'The workstation lost its domain trust',
 steps:[
  'Log in with a local admin account, or unplug the network cable and log in on cached credentials.',
  'Plug back in, open PowerShell as admin and test the secure channel. [[secure-channel]]',
  'If it returns False, run the repair line with a domain admin account. No rejoin or reboot needed in most cases.',
  'If repair fails: remove to a workgroup, reboot, rejoin, reboot. Profiles are kept.',
  'Usual cause: restored from an old image or snapshot, or off the network for a very long time.'
 ]},
{id:'g-print', title:'Cannot print / jobs stuck in queue', sub:'Nothing comes out, printer offline, wrong printer',
 steps:[
  'Check the printer itself: on, paper, toner, no error on its screen, network cable in.',
  'Look at the queue. One job in Error often blocks everything behind it. [[print-jobs]]',
  'Restart the spooler and clear stuck jobs. Fixes most cases, but it clears jobs for everyone on that machine. [[clear-spooler]]',
  'Check the printer is still reachable by name or IP on port 9100 or 443. [[test-port]]',
  'If lots of people are affected it is the print server or the printer, not the PCs.'
 ]},
{id:'g-remote', title:'Remote support session checklist', sub:'A good routine for every remote job',
 steps:[
  'Confirm who you are speaking to and the machine name. Put the machine name in the Computer box at the top.',
  'Check it is online and who is logged on. [[remote-ping]] [[remote-user]] [[logged-on]]',
  'Grab a snapshot without disturbing them. [[remote-snapshot]] [[remote-disk]]',
  'Connect: Quick Assist (they press Ctrl + Windows + Q and give you the code) or Remote Assistance. [[msra]]',
  'Grab logs or files without interrupting them. [[remote-cshare]]',
  'If you need a prompt on the machine rather than one command at a time. Requires WinRM, which the last script enables. [[ps-session]] [[enable-remoting]]',
  'Ask before closing anything, and warn before restarts. [[remote-restart]]',
  'Before you hand a machine back or send it for repair, confirm it is still encrypted. [[bitlocker]]',
  'Anything with the red Interrupts the user badge needs saying out loud before you run it.',
  'Write up what you changed while it is fresh, not at the end of the day.',
  'Write up what you did. The Notes tab here is a scratchpad for exactly that.'
 ]},
{id:'g-linux', title:'Linux box triage: where to start', sub:'A server is unhappy and you have just been given a shell',
 steps:[
  'Find out what you are on before you touch anything. Distribution, kernel, whether it is a VM, how long it has been up. [[lx-snapshot]]',
  'Ask what "slow" or "broken" means to whoever raised it, and when it started. A machine that has been up 400 days and a machine restarted an hour ago are different problems.',
  'Is it actually busy? Load only means something next to the core count, and high iowait means disk, not CPU. [[lx-load]]',
  'Find the processes responsible, by CPU and by memory. [[lx-top-cpu]] [[lx-top-mem]]',
  'Check memory properly. Read <i>available</i>, not <i>free</i> - Linux uses spare RAM for cache by design. Then check whether the kernel has been killing things, which explains a lot of "the application keeps disappearing". [[lx-memory]]',
  'Check whether anything is in a failed state. If this is empty, the problem is inside an application rather than a service that will not run. [[lx-failed]]',
  'Read the errors since boot. From the bottom - the newest is usually the cause and the older ones are its consequences. [[lx-journal-errors]]',
  'Check the kernel ring buffer for hardware complaints. Disk I/O errors show up here long before anything else notices. [[lx-dmesg]]',
  'If it looks patched but still misbehaving, find out whether it is waiting on a reboot and which processes are still running old code. [[lx-reboot]] [[lx-updates]]',
  'Before you hand it on, collect everything into one file and attach that to the ticket. [[lx-collect]]'
 ]},
{id:'g-linux-disk', title:'Disk full on Linux', sub:'No space left on device, or a filesystem that will not write',
 steps:[
  'Check space and <b>inodes</b> together. A filesystem can be 4% full and still refuse to write because it has run out of inodes. [[lx-disk]]',
  'If inode usage is the high one, you are looking for millions of small files rather than a few big ones. Session directories, cache directories and mail spools first.',
  'Find what is actually using the space, walking down a level at a time rather than du-ing the whole disk. [[lx-big]]',
  'If df says full and du says it is not, a process is still holding a deleted file open. Restart that process and the space comes straight back - do not reboot, and do not go looking for files to delete. [[lx-deleted]]',
  'Check the journal. It grows to a limit that is usually larger than anyone intended. [[lx-journal-size]]',
  'Check whether the filesystem you expected is even mounted. A missing mount means writes went to the root disk instead. [[lx-mounts]]',
  'Now reclaim what is safe to reclaim. Package caches, orphaned packages, old kernels, the journal, old snap revisions and Docker if it is there - measured first, with the command printed against each one. Snap revisions catch people out especially: Ubuntu keeps the last two of every snap and it quietly runs to gigabytes. [[lx-reclaim]]',
  'Never remove the kernel you are currently booted from, however tempting the size looks.',
  'Only once you know what filled it: agree what to remove with whoever owns the machine. Deleting logs during an incident destroys the evidence for the investigation afterwards.'
 ]},
{id:'g-linux-service', title:'A service will not start', sub:'systemctl says failed, or it starts and dies immediately',
 steps:[
  'Confirm what is actually failing rather than what was reported. [[lx-failed]]',
  'Put the unit name in the <b>Service</b> box at the top, then read its state. The "since" line is often the whole answer - a service that restarted four minutes ago when the fault was reported an hour ago is not your problem. [[lx-service]]',
  'Read its logs. systemctl status shows three lines and the reason is nearly always the fourth. [[lx-service-logs]]',
  'The four usual causes, in the order you should check them: something else already on the port, a config file it cannot parse, a file or directory it cannot read, or a dependency that is not up.',
  'For a port clash, see what already holds it. [[lx-listening]]',
  'For a permissions problem, check the whole path, not just the file. A readable file inside a directory without execute permission is unreachable, and SELinux or AppArmor will deny things that look perfectly permitted. [[lx-perms]]',
  'If a binary or config has gone missing, find out which package owns it and reinstall that package rather than copying a file in by hand. [[lx-whichpkg]] [[lx-pkg]]',
  'Once you have changed something, restart it and watch. Tell the user first - this interrupts anyone connected. [[lx-service-restart]]',
  'Still failing: run it in the foreground by hand as the same user the unit runs as. Services frequently say more on a terminal than they ever write to the journal.'
 ]},
{id:'g-linux-net', title:'Linux networking not working', sub:'No connectivity, cannot resolve, or cannot reach one host',
 steps:[
  'Work up the layers in order and stop at the first thing that fails. Guessing in the middle wastes the most time.',
  'Does the interface have an address, and is there a default route? No default route is the whole answer surprisingly often. [[lx-ip]]',
  'Find out what is managing the network before you change anything. NetworkManager, netplan, systemd-networkd and interfaces files all exist, usually more than one at a time, and editing the inactive one changes nothing at all. [[lx-netmanager]]',
  'Check DNS properly. /etc/resolv.conf is often a symlink to a stub saying 127.0.0.53, which tells you nothing about the real server. [[lx-dns]]',
  'If a record was changed recently and the machine is still using the old answer, flush the cache. [[lx-dns-flush]]',
  'Test reachability to one host, layer by layer: resolve, route, ping, then the actual port. A blocked ping proves very little on its own. [[lx-conn]]',
  'If the port is closed, check whether the service is listening at all, and whether it is bound to localhost rather than the network. [[lx-listening]]',
  'Then check the firewall - and find out which of the four is actually in charge first. Remember the host firewall is only one of three places traffic gets dropped; the others are a security group in front of it and the service binding to 127.0.0.1. [[lx-firewall]]',
  'On a laptop, check the radio and the signal. [[lx-wifi]]'
 ]},
{id:'g-linux-access', title:'Cannot log in, or cannot do a thing', sub:'Permission denied, locked account, or sudo refusing',
 steps:[
  'First, separate the two cases. "Cannot log in at all" and "logged in but refused" are different problems with different answers.',
  'If it is your own session that is refusing, check what you actually have before assuming. [[lx-whoami]]',
  'For a user who cannot get in, put their name in the <b>User</b> box and get the whole picture at once: account state, password state, expiry, shell and last login. In passwd -S, L means locked and NP means no password at all. [[lx-user]]',
  'Check the failed attempts. This also tells you whether the machine is simply being brute-forced, which on anything internet-facing is constant and normal. [[lx-authfail]]',
  'A shell set to /usr/sbin/nologin, an expired account, or a home directory that does not exist will all refuse a login while the password is perfectly correct.',
  'If SSH is refusing a key, check which keys the box actually accepts and whether password login is even permitted. [[lx-sshkeys]]',
  'For "sudo says I cannot", check who genuinely has administrative rights here. [[lx-sudoers]]',
  'For a file they cannot read, check the whole path rather than the file. A directory needs execute, not read, for anything inside it to be reachable. [[lx-perms]]',
  'For a leaver, disable rather than delete, and check what they own before anyone suggests removing the account. A reused UID means the next person inherits all of their files. [[lx-leaver]]'
 ]},
{id:'g-linux-desktop', title:'Linux desktop: screen or sound', sub:'A monitor that will not come up, or no audio',
 steps:[
  'Find out whether the session is Wayland or X11 first. Half the advice you will find only applies to one of them, and it is usually the other one. [[lx-display]]',
  'For a display problem: check the output is detected at the kernel level even if the desktop is not using it. A connected output that the session ignores is a driver or compositor problem, not a cable.',
  'Check the graphics driver actually in use. An NVIDIA card running the nouveau driver instead of the proprietary one explains a great many resolution and multi-monitor complaints.',
  'For audio: find out whether it is PipeWire or PulseAudio, because the commands differ and PipeWire has replaced PulseAudio on most current distributions. [[lx-audio]]',
  'Check the obvious thing before anything else: whether the right output device is selected, and whether anything is muted at the ALSA level underneath it all.',
  'For wifi on a laptop, check the radio, the connection and the signal strength. Below about 40 is where things start dropping. [[lx-wifi]]',
  'If the desktop session itself is broken rather than one part of it, check the user journal: journalctl --user -b -p err'
 ]}
];
