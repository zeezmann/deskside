S('locked-file','perf','What is holding this file open?',['admin'],
'For "the file is in use by another program" when nothing obvious has it. Checks the three places the answer usually is: open over a share, an Office lock file that names the person, or a process on this machine. Put the path in the <b>File</b> box.<br><br>Windows has no built-in command that lists every process holding a handle to a file, so the last step points you at Resource Monitor, which does and is on every machine. If you have Sysinternals to hand, <span class="mono">handle64 -a -u "path"</span> is the faster route.',
String.raw`
$f    = '{{FILE}}'
$leaf = Split-Path $f -Leaf
$dir  = Split-Path $f -Parent

Write-Host '--- open over a share from this machine? ---' -ForegroundColor Cyan
$smb = Get-SmbOpenFile -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "*$leaf*" }
if ($smb) {
  $smb | Select-Object ClientUserName, ClientComputerName, Path | Format-Table -AutoSize
  Write-Host 'That is who has it. Ask them to close it, or force it with:' -ForegroundColor Yellow
  Write-Host '  Close-SmbOpenFile -FileId <id> -Force   <- they lose unsaved changes'
} else { Write-Host '  nothing, or this machine is not the file server' }

Write-Host ''
Write-Host '--- an Office lock file next to it? ---' -ForegroundColor Cyan
$lock = $null
if ($dir -and (Test-Path $dir)) {
  $lock = Get-ChildItem $dir -Filter ('~$' + $leaf.Substring([math]::Min(2, $leaf.Length))) -Force -ErrorAction SilentlyContinue
}
if ($lock) {
  $bytes = [System.IO.File]::ReadAllBytes($lock.FullName)
  $who = ''
  if ($bytes.Length -gt 2) {
    $len = $bytes[0]
    if ($len -gt 0 -and $len -lt 60 -and $bytes.Length -gt $len) {
      $who = [System.Text.Encoding]::ASCII.GetString($bytes, 1, $len) -replace '[^\x20-\x7E]',''
      if ($who.Trim().Length -lt 2) {
        $who = [System.Text.Encoding]::Unicode.GetString($bytes, 2, [math]::Min($len * 2, $bytes.Length - 2)) -replace '[^\x20-\x7E]',''
      }
    }
  }
  Write-Host ('  lock file: {0}' -f $lock.Name)
  if ($who.Trim()) { Write-Host ('  opened by: {0}' -f $who.Trim()) -ForegroundColor Yellow }
  Write-Host '  A lock file left behind after a crash is safe to delete once that person has closed the document.'
} else { Write-Host '  none' }

Write-Host ''
Write-Host '--- a process on this machine ---' -ForegroundColor Cyan
Write-Host 'Windows has no command that lists handle owners, so use Resource Monitor:'
Write-Host '  1. Run  resmon'
Write-Host '  2. CPU tab, expand Associated Handles'
Write-Host ('  3. Search for:  {0}' -f $leaf)
Write-Host '  4. It names the process. Close that app properly rather than killing it.'
Write-Host ''
Write-Host 'Explorer itself is a common culprit on a folder that will not delete, usually a'
Write-Host 'thumbnail or preview handler. Restarting it clears that without losing anything.'`);

S('disk-reclaim','perf','Reclaim disk space',['admin','changes','risk'],
'Adds up every candidate on a full Windows disk with a size against it, and with <span class="mono">-Clear</span> removes the ones that are safe to remove without asking anybody: the Windows Update download cache, Delivery Optimization, the error report queue and the Recycle Bin.<br><br>It reports only by default, so pasting it deletes nothing. <b>Mention the Recycle Bin before you use -Clear</b> - it empties it for every user on the machine and plenty of people treat it as a filing system.<br><br>The component store is usually the biggest single win on an older build and is not touched here, because it takes twenty minutes and cannot be safely interrupted. The command is printed at the end for when you have the time.',
String.raw`
function Reclaim-Disk {
  param(
    [switch] $Clear
  )

  function Size($p) {
    if (-not (Test-Path $p)) { return 0 }
    (Get-ChildItem $p -Recurse -File -Force -ErrorAction SilentlyContinue |
      Measure-Object Length -Sum).Sum
  }

  $free = (Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'").FreeSpace
  Write-Host ''
  Write-Host ('Free on C: {0} GB' -f [math]::Round($free / 1GB, 1)) -ForegroundColor Cyan
  Write-Host ''

  $wu  = "$env:SystemRoot\SoftwareDistribution\Download"
  $do  = "$env:SystemRoot\SoftwareDistribution\DeliveryOptimization"
  $wer = "$env:ProgramData\Microsoft\Windows\WER"
  $rb  = 0
  try { $rb = (Get-ChildItem 'C:\$Recycle.Bin' -Recurse -File -Force -ErrorAction SilentlyContinue |
               Measure-Object Length -Sum).Sum } catch { }
  $hib = 0
  if (Test-Path 'C:\hiberfil.sys') { $hib = (Get-Item 'C:\hiberfil.sys' -Force).Length }

  $rows = @(
    [PSCustomObject]@{ What = 'Windows Update downloads';  MB = [int]((Size $wu)  / 1MB); Safe = 'yes' }
    [PSCustomObject]@{ What = 'Delivery Optimization';     MB = [int]((Size $do)  / 1MB); Safe = 'yes' }
    [PSCustomObject]@{ What = 'Error report queue';        MB = [int]((Size $wer) / 1MB); Safe = 'yes' }
    [PSCustomObject]@{ What = 'Recycle Bin (all users)';   MB = [int]($rb / 1MB);         Safe = 'yes, but ask' }
    [PSCustomObject]@{ What = 'Your temp folder';          MB = [int]((Size $env:TEMP) / 1MB); Safe = 'Clear temp folders script' }
    [PSCustomObject]@{ What = 'Windows temp folder';       MB = [int]((Size "$env:SystemRoot\Temp") / 1MB); Safe = 'Clear temp folders script' }
    [PSCustomObject]@{ What = 'Windows.old';               MB = [int]((Size 'C:\Windows.old') / 1MB); Safe = 'removes itself after 10 days' }
    [PSCustomObject]@{ What = 'Downloads folder';          MB = [int]((Size "$env:USERPROFILE\Downloads") / 1MB); Safe = 'THEIRS - ask first' }
    [PSCustomObject]@{ What = 'Hibernation file';          MB = [int]($hib / 1MB); Safe = 'powercfg /h off, kills Fast Startup' }
  )
  $rows | Format-Table What, MB, Safe -AutoSize

  if (-not $Clear) {
    Write-Host 'Reported only. Nothing has been removed.' -ForegroundColor Cyan
    Write-Host 'Run it again as  Reclaim-Disk -Clear  to empty the four marked yes.' -ForegroundColor Cyan
  } else {
    Write-Host '--- clearing ---' -ForegroundColor Yellow
    Stop-Service wuauserv -Force -ErrorAction SilentlyContinue
    Remove-Item "$wu\*" -Recurse -Force -ErrorAction SilentlyContinue
    Start-Service wuauserv -ErrorAction SilentlyContinue
    Write-Host '  Windows Update downloads cleared'

    try { Delete-DeliveryOptimizationCache -Force -ErrorAction Stop; Write-Host '  Delivery Optimization cleared' }
    catch { Write-Host '  Delivery Optimization: cmdlet not on this build, skipped' }

    Remove-Item "$wer\ReportQueue\*","$wer\ReportArchive\*" -Recurse -Force -ErrorAction SilentlyContinue
    Write-Host '  error report queue cleared'

    Clear-RecycleBin -Force -ErrorAction SilentlyContinue
    Write-Host '  Recycle Bin emptied'

    Start-Sleep -Seconds 2
    $after = (Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'").FreeSpace
    Write-Host ''
    Write-Host ('Free on C: was {0} GB, now {1} GB.' -f
      [math]::Round($free / 1GB, 2), [math]::Round($after / 1GB, 2)) -ForegroundColor Green
  }

  Write-Host ''
  Write-Host '--- component store (WinSxS) ---' -ForegroundColor Cyan
  Dism.exe /Online /Cleanup-Image /AnalyzeComponentStore | Select-String 'Size|Reclaimable|Recommended'
  Write-Host 'If cleanup is recommended:  Dism.exe /Online /Cleanup-Image /StartComponentCleanup'
  Write-Host 'Twenty minutes, cannot be interrupted safely, so not during a call.'
}

Reclaim-Disk`);

S('disk-profiles-clean','perf','Clear everyone except the person sat at the machine',['admin','changes','risk'],
'The hot-desking ticket, done properly. Walk up to the machine, open an elevated PowerShell, paste this. It works out who is actually sat there, protects them and anything the machine depends on, and then asks you about every other profile one at a time with its size and last-used date.<br><br><b>Run it with -DryRun first.</b> That prints both tables and stops without asking you anything, so you can see exactly what it would offer before it offers it.<br><br><b>What it protects, and tells you it protected:</b> the signed-in console user, anyone with a disconnected session still holding files, any account with a running process, any account a Windows service starts as, the built-in and system profiles, and the account you are running as. Each one is listed with the reason, because a thing silently withheld is worse than a thing refused out loud.<br><br><b>Y</b> deletes, <b>N</b> keeps, <b>A</b> does the rest after one confirmation showing the total, <b>Q</b> stops. Enter on its own means No.<br><br>Age is shown but decides nothing - you asked for presence to be the rule, and presence is the rule. A profile last used yesterday by somebody who has since moved desks is still fair game; that is your call to make with the person in front of you, not a number in a script.<br><br><b>Why it is a function.</b> A script containing Read-Host pasted into a console eats its own remaining lines as the answers to its prompts. Defining a function and calling it on the last line means the prompts wait for you.<br><br>Removing a profile takes the desktop, saved passwords and any local Outlook data with it. There is no undo.',
String.raw`
function Clear-OtherProfiles {
  param(
    [switch] $DryRun
  )

  $admin = ([Security.Principal.WindowsPrincipal] [Security.Principal.WindowsIdentity]::GetCurrent()
           ).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
  if (-not $admin) {
    Write-Host 'This needs an elevated PowerShell. Close this window and open one as administrator.' -ForegroundColor Red
    return
  }

  function ToSid($account) {
    if (-not $account) { return $null }
    try { return (New-Object System.Security.Principal.NTAccount($account)
                 ).Translate([System.Security.Principal.SecurityIdentifier]).Value } catch { return $null }
  }

  Write-Host ''
  Write-Host 'Working out who is on this machine...' -ForegroundColor Cyan

  $consoleUser = (Get-CimInstance Win32_ComputerSystem).UserName
  $consoleSid  = ToSid $consoleUser
  if ($consoleUser) { Write-Host ("  at the console : {0}" -f $consoleUser) -ForegroundColor Green }
  else              { Write-Host '  at the console : nobody signed in' -ForegroundColor Yellow }

  $meSid  = ([Security.Principal.WindowsIdentity]::GetCurrent()).User.Value
  $meName = ([Security.Principal.WindowsIdentity]::GetCurrent()).Name
  Write-Host ("  running as     : {0}" -f $meName) -ForegroundColor Green

  $svcAccounts = @()
  Get-CimInstance Win32_Service -ErrorAction SilentlyContinue | ForEach-Object {
    if ($_.StartName) {
      $full = $_.StartName.ToLower()
      $svcAccounts += $full
      $svcAccounts += ($full -split '\\')[-1]
    }
  }
  $svcAccounts = @($svcAccounts | Where-Object { $_ } | Sort-Object -Unique)

  $busy = @()
  Get-Process -IncludeUserName -ErrorAction SilentlyContinue | ForEach-Object {
    if ($_.UserName) {
      $u = $_.UserName.ToLower()
      $busy += $u
      $busy += ($u -split '\\')[-1]
    }
  }
  $busy = @($busy | Where-Object { $_ } | Sort-Object -Unique)

  $builtin = @('administrator','public','default','defaultuser0','defaultapppool',
               'systemprofile','localservice','networkservice')

  $offer = @(); $keep = @()

  foreach ($prof in (Get-CimInstance Win32_UserProfile -Filter 'Special = False')) {
    $path = $prof.LocalPath
    if (-not $path) { continue }
    $name = Split-Path $path -Leaf

    $acct = $null
    try { $acct = (New-Object System.Security.Principal.SecurityIdentifier($prof.SID)
                  ).Translate([System.Security.Principal.NTAccount]).Value } catch { }
    $acctLow  = ''
    $acctLeaf = ''
    if ($acct) { $acctLow = $acct.ToLower(); $acctLeaf = ($acctLow -split '\\')[-1] }

    $why = $null
    if ($prof.SID -eq $consoleSid)              { $why = 'signed in at this machine' }
    elseif ($prof.SID -eq $meSid)               { $why = 'this is you' }
    elseif ($prof.Loaded)                       { $why = 'loaded - a session still holds files open' }
    elseif ($builtin -contains $name.ToLower()) { $why = 'built-in or system profile' }
    elseif ($acctLow -and (($svcAccounts -contains $acctLow) -or ($svcAccounts -contains $acctLeaf))) {
      $why = 'a Windows service starts as this account' }
    elseif ($acctLow -and (($busy -contains $acctLow) -or ($busy -contains $acctLeaf))) {
      $why = 'has a process running right now' }
    elseif (-not (Test-Path $path))             { $why = 'folder no longer on disk' }

    if ($why) {
      $keep += [PSCustomObject]@{ Profile = $name; Account = $(if ($acct) { $acct } else { '-' }); Protected = $why }
      continue
    }

    $bytes = (Get-ChildItem $path -Recurse -File -Force -ErrorAction SilentlyContinue |
              Measure-Object Length -Sum).Sum
    if (-not $bytes) { $bytes = 0 }

    $lastUse = $prof.LastUseTime
    $lastNt  = $null
    $nt = Join-Path $path 'NTUSER.DAT'
    if (Test-Path $nt) { $lastNt = (Get-Item $nt -Force).LastWriteTime }
    $last = $lastUse
    if (-not $last -or ($lastNt -and $lastNt -gt $last)) { $last = $lastNt }
    if (-not $last) { $last = (Get-Item $path -Force).LastWriteTime }

    $offer += [PSCustomObject]@{
      Profile = $name
      Account = $(if ($acct) { $acct } else { 'account no longer exists' })
      MB      = [int]($bytes / 1MB)
      LastUsed = $last.ToString('yyyy-MM-dd')
      Days    = [int]((Get-Date) - $last).TotalDays
      Cim     = $prof
    }
  }

  Write-Host ''
  Write-Host '--- PROTECTED, will not be offered ---' -ForegroundColor Green
  if ($keep.Count -gt 0) { $keep | Format-Table Profile, Account, Protected -AutoSize }
  else { Write-Host '  (none)' }

  $offer = @($offer | Sort-Object MB -Descending)
  if ($offer.Count -eq 0) {
    Write-Host '--- nothing else on this machine to remove ---' -ForegroundColor Green
    Write-Host 'If the disk is still full the space is elsewhere - run the reclaim script.'
    return
  }

  $total = ($offer | Measure-Object MB -Sum).Sum
  Write-Host ('--- CAN BE REMOVED: {0} profile(s), {1} MB ---' -f $offer.Count, $total) -ForegroundColor Yellow
  $offer | Format-Table Profile, Account, MB, LastUsed, Days -AutoSize

  if ($DryRun) {
    Write-Host 'Dry run. Nothing was removed and nothing was asked.' -ForegroundColor Cyan
    Write-Host 'Run it again without -DryRun to work through them.'
    return
  }

  $freeBefore = (Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'").FreeSpace
  Write-Host ('Free on C: {0} GB' -f [math]::Round($freeBefore / 1GB, 1)) -ForegroundColor Cyan
  Write-Host 'Y = delete   N = keep   A = all the rest   Q = stop   (Enter means No)' -ForegroundColor Yellow

  $all = $false; $freed = 0; $done = 0; $i = 0

  :profiles foreach ($x in $offer) {
    $i = $i + 1
    $ans = 'Y'
    if (-not $all) {
      Write-Host ''
      Write-Host ('[{0} of {1}]  {2}    {3}' -f $i, $offer.Count, $x.Profile, $x.Account) -ForegroundColor White
      Write-Host ('   {0} MB, last used {1} ({2} days ago)' -f $x.MB, $x.LastUsed, $x.Days)
      $ans = (Read-Host '   Delete? [Y]es / [N]o / [A]ll / [Q]uit').Trim().ToUpper()
    }

    if ($ans -eq 'Q') { Write-Host '   stopped.' -ForegroundColor Yellow; break profiles }

    if ($ans -eq 'A') {
      $rest = @($offer | Select-Object -Skip ($i - 1))
      $restMB = ($rest | Measure-Object MB -Sum).Sum
      Write-Host ''
      Write-Host ('   That is {0} profile(s), {1} MB, deleted without asking again.' -f $rest.Count, $restMB) -ForegroundColor Red
      $sure = (Read-Host '   Type YES to confirm').Trim()
      if ($sure -ne 'YES') { Write-Host '   not confirmed, back to one at a time.' -ForegroundColor Yellow; $ans = 'N' }
      else { $all = $true; $ans = 'Y' }
    }

    if ($ans -ne 'Y') { Write-Host '   kept' -ForegroundColor DarkGray; continue }

    try {
      Remove-CimInstance -InputObject $x.Cim -ErrorAction Stop
      $freed = $freed + $x.MB
      $done  = $done + 1
      Write-Host ('   removed {0} ({1} MB)' -f $x.Profile, $x.MB) -ForegroundColor Green
    } catch {
      Write-Host ('   FAILED: {0}' -f $_.Exception.Message) -ForegroundColor Red
      Write-Host '   Usually a file still locked. Sign the machine out and try again.'
    }
  }

  Start-Sleep -Seconds 2
  $freeAfter = (Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'").FreeSpace
  Write-Host ''
  Write-Host ('Removed {0} profile(s), about {1} MB.' -f $done, $freed) -ForegroundColor Green
  Write-Host ('Free on C: was {0} GB, now {1} GB.' -f
    [math]::Round($freeBefore / 1GB, 1), [math]::Round($freeAfter / 1GB, 1)) -ForegroundColor Green
  Write-Host ''
  Write-Host 'Put the names on the ticket. If somebody asks for a file back next week the'
  Write-Host 'honest answer needs to be on the record rather than in your memory.'
}

Clear-OtherProfiles -DryRun`);


S('big-folders','perf','Biggest folders in a user profile (uses User)',[],
'Finds what is eating a user\'s space. Usually Downloads, Desktop, or a Google Drive folder somebody set to Available offline.',
String.raw`
$root = 'C:\Users\{{USER}}'
Get-ChildItem $root -Directory -Force -ErrorAction SilentlyContinue | ForEach-Object {
  $size = (Get-ChildItem $_.FullName -Recurse -File -Force -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
  [PSCustomObject]@{ Folder = $_.Name; SizeGB = [math]::Round($size / 1GB, 2) }
} | Sort-Object SizeGB -Descending | Format-Table -AutoSize`);

S('big-files','perf','Files over 1 GB on C:',['admin'],
'Finds ISOs, old backups, videos and forgotten VM disks. Walks the whole of C:, so give it five to fifteen minutes on a full drive and do not run it while the user is waiting on a call.',
String.raw`
Get-ChildItem C:\ -Recurse -File -Force -ErrorAction SilentlyContinue |
  Where-Object { $_.Length -gt 1GB } |
  Select-Object @{n='SizeGB';e={ [math]::Round($_.Length/1GB,2) }}, LastWriteTime, FullName |
  Sort-Object SizeGB -Descending |
  Format-Table -AutoSize`);

S('sfc-dism','perf','Repair Windows system files (DISM + SFC)',['admin','changes'],
'Fixes corrupted Windows files. Run DISM first (it repairs the store SFC uses), then SFC. Takes 10 to 30 minutes. Reboot afterwards.',
String.raw`
DISM /Online /Cleanup-Image /RestoreHealth
sfc /scannow`);

S('restart-explorer','perf','Restart Explorer (frozen taskbar or Start menu)',['changes'],
'Fixes a stuck taskbar, Start menu or desktop without a reboot. The screen flickers for a second.',
String.raw`
Stop-Process -Name explorer -Force
Start-Sleep 2
if (-not (Get-Process explorer -ErrorAction SilentlyContinue)) { Start-Process explorer.exe }`);

S('disk-health','perf','Disk health (SSD / HDD)',[],
'HealthStatus should be Healthy. Anything else means back up now and replace the drive. MediaType HDD in a slow machine is often the whole problem.',
String.raw`
Get-PhysicalDisk |
  Select-Object FriendlyName, MediaType, HealthStatus, OperationalStatus, @{n='SizeGB';e={ [math]::Round($_.Size/1GB) }} |
  Format-Table -AutoSize`);

S('power-plan','perf','Check and switch power plan',['changes'],
'Laptops stuck on Power Saver are slow. The second line switches to High Performance (may be hidden on some laptops that use Balanced + power mode slider instead).',
String.raw`
powercfg /list
powercfg /setactive SCHEME_MIN`);

   Deliberately small. Printing generates very few tickets in most shops, so
   a large section is upkeep for almost nothing. ------------------------- */
S('clear-spooler','print','Restart spooler and clear stuck jobs',['admin','changes','risk'],
'The number-one printer fix. Stops the spooler, deletes all stuck jobs, and starts it again. <b>This clears jobs for everyone on the machine</b>, not just the person who called, so check nobody else is waiting on a big print run.',
String.raw`
Stop-Service Spooler -Force
Remove-Item "$env:SystemRoot\System32\spool\PRINTERS\*" -Force -ErrorAction SilentlyContinue
Start-Service Spooler
Get-Service Spooler`);

S('print-jobs','print','Show print queue for every printer',[],
'See what is waiting and whether a single job is in Error and blocking the rest.',
String.raw`
Get-Printer | ForEach-Object { Get-PrintJob -PrinterName $_.Name -ErrorAction SilentlyContinue } |
  Select-Object PrinterName, Id, DocumentName, UserName, JobStatus, SubmittedTime |
  Format-Table -AutoSize`);

S('whoami','accounts','Who am I, and what groups am I in?',[],
'Confirms the account, UPN and group memberships of the current session. Handy when "access denied" might just be a missing group.',
String.raw`
whoami /upn
whoami /groups /fo table`);

S('gpupdate','accounts','Force a Group Policy refresh',['changes'],
'Pulls down the latest policies, drive maps and printers. Needs line of sight to a domain controller (office network or VPN).',
String.raw`
gpupdate /force`);

S('gpresult','accounts','Group Policy report',[],
'The first line gives a quick text summary. The second builds a full HTML report on the desktop and opens it.',

gpresult /r
gpresult /h "$env:USERPROFILE\Desktop\gpresult.html" /f

S('secure-channel','accounts','Check / repair domain trust',['admin'],
'For "The trust relationship between this workstation and the primary domain failed". True = healthy. The repair line asks for domain admin credentials and fixes it without rejoining.',
String.raw`
Test-ComputerSecureChannel -Verbose
# If False, repair it:

S('net-user','accounts','Account status without RSAT (uses User)',[],
'Works on any domain-joined PC. Look at "Account active", "Password expires" and "Last logon".',
String.raw`
net user {{USER}} /domain`);

S('lockout-source','accounts','Find what keeps locking an account (uses User)',['admin'],
'Rewritten to work without RSAT. Finds the domain controller holding the PDC role using nltest, which ships with Windows, then reads the lockout events off it. Shows which machine caused each lockout: usually a phone with an old password saved, a disconnected session, or credentials cached in Credential Manager.',
String.raw`
$pdc = (nltest /dsgetdc:$env:USERDNSDOMAIN /pdc 2>$null |
        Select-String 'DC:\s*\\\\(\S+)').Matches.Groups[1].Value
if (-not $pdc) { $pdc = $env:LOGONSERVER -replace '^\\\\','' }
"Reading lockout events from $pdc"
Get-WinEvent -ComputerName $pdc -FilterHashtable @{ LogName='Security'; Id=4740 } -MaxEvents 200 -ErrorAction SilentlyContinue |
  Where-Object { $_.Properties[0].Value -eq '{{USER}}' } |
  Select-Object TimeCreated, @{n='User';e={ $_.Properties[0].Value }},
                @{n='LockedFrom';e={ $_.Properties[1].Value }} |
  Format-Table -AutoSize`);

S('cred-list','accounts','List saved credentials (Credential Manager)',[],
'Old saved passwords cause lockouts and endless prompts. Remove one with: cmdkey /delete:TARGETNAME',
String.raw`
cmdkey /list`);

/* ---------------- WINDOWS UPDATE ---------------- */
S('hotfixes','updates','Last installed updates',[],
'The 15 most recent updates and when they went on. Useful for "it broke after an update".',
String.raw`
Get-HotFix | Sort-Object InstalledOn -Descending | Select-Object -First 15 HotFixID, Description, InstalledOn | Format-Table -AutoSize`);

S('pending-reboot','updates','Is a reboot pending?',[],
'Checks the three places Windows records a pending restart. Pending reboots block updates and installs.',
String.raw`
$checks = @(
  (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Component Based Servicing\RebootPending'),
  (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Auto Update\RebootRequired'),
  [bool](Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager' -Name PendingFileRenameOperations -ErrorAction SilentlyContinue)
)
if ($checks -contains $true) { 'Reboot is pending' } else { 'No reboot pending' }`);

S('wu-reset','updates','Reset Windows Update components',['admin','changes'],
'For updates stuck downloading or failing with the same error. Stops the services, renames the cache folders (keeps them as .old in case), then restarts. Reboot and check for updates afterwards.',
String.raw`
$services = 'wuauserv','bits','cryptsvc','msiserver'
Stop-Service $services -Force -ErrorAction SilentlyContinue
$stamp = Get-Date -Format yyyyMMddHHmm
Rename-Item "$env:SystemRoot\SoftwareDistribution" "SoftwareDistribution.old_$stamp" -ErrorAction SilentlyContinue
Rename-Item "$env:SystemRoot\System32\catroot2" "catroot2.old_$stamp" -ErrorAction SilentlyContinue
Start-Service $services -ErrorAction SilentlyContinue
Write-Host 'Done. Reboot, then check for updates again.' -ForegroundColor Yellow`);

S('wu-open','updates','Open Windows Update settings',[],
'Jumps straight to the Windows Update page.',
String.raw`
Start-Process 'ms-settings:windowsupdate'`);

/* ---------------- GOOGLE, SLACK & ZOOM ----------------
   Built for a Google Workspace and Slack shop with Meet and Zoom for calls.
   If you run Microsoft 365 instead, this is the section to swap out. ----- */
S('slack-cache','cloud','Clear the Slack cache',['changes'],
'First thing to try for Slack not loading, a blank window, stuck status, missing messages or a sign-in loop. Closes Slack, clears the caches and reopens it. Nothing is lost, it all lives on Slack servers. Run as the user, not elevated.',
String.raw`
Stop-Process -Name slack -Force -ErrorAction SilentlyContinue
Start-Sleep 3
$root = "$env:APPDATA\Slack"
'Cache','Code Cache','GPUCache','Service Worker\CacheStorage' | ForEach-Object {
  Remove-Item (Join-Path $root $_) -Recurse -Force -ErrorAction SilentlyContinue
}
Start-Process "$env:LOCALAPPDATA\slack\slack.exe" -ErrorAction SilentlyContinue
Write-Host 'Slack cache cleared and Slack restarted.'`);

S('slack-reset','cloud','Full Slack reset (last resort)',['changes','risk'],
'For a Slack that will not sign in or start at all after the cache clear. Removes the entire local Slack profile, so the user signs in again from scratch and any unsent drafts are gone. Ask them first.',
String.raw`
Stop-Process -Name slack -Force -ErrorAction SilentlyContinue
Start-Sleep 3
$stamp = Get-Date -Format yyyyMMddHHmm
Rename-Item "$env:APPDATA\Slack" "Slack.old_$stamp" -ErrorAction SilentlyContinue
Start-Process "$env:LOCALAPPDATA\slack\slack.exe" -ErrorAction SilentlyContinue
Write-Host "Old profile kept as Slack.old_$stamp in AppData\Roaming if you need anything back."`);

S('slack-version','cloud','Which Slack version is installed?',[],
'Slack updates itself, but a machine that has been off for a while or is blocked by a proxy can fall a long way behind. Check here before raising it as a bug.',
String.raw`
$exe = "$env:LOCALAPPDATA\slack\slack.exe"
if (Test-Path $exe) {
  (Get-Item $exe).VersionInfo | Select-Object ProductName, ProductVersion, FileVersion | Format-List
} else { 'Slack is not installed in the usual per-user location.' }`);

S('chrome-profiles','cloud','Which Google accounts is Chrome signed into?',[],
'The single most common cause of "I cannot get into Google / Slack / Salesforce". A personal Gmail signed into the same browser makes Chrome pick the wrong account and the error looks exactly like a password problem. Shows every Chrome profile and the account behind it.',
String.raw`
$state = "$env:LOCALAPPDATA\Google\Chrome\User Data\Local State"
if (Test-Path $state) {
  $j = Get-Content $state -Raw | ConvertFrom-Json
  $j.profile.info_cache.PSObject.Properties | ForEach-Object {
    [PSCustomObject]@{
      Folder = $_.Name
      Name   = $_.Value.name
      Signed = $_.Value.user_name
    }
  } | Format-Table -AutoSize
} else {
  'Chrome is not installed for this user, or has never been opened.'
}`);

S('gdrive-restart','cloud','Restart Google Drive for desktop',['changes'],
'For syncing that has stalled, a missing G: drive or files stuck at "uploading". Closes Drive and starts it again. Nothing is deleted.',
String.raw`
Stop-Process -Name GoogleDriveFS -Force -ErrorAction SilentlyContinue
Start-Sleep 3
$exe = Get-ChildItem 'C:\Program Files\Google' -Recurse -Filter GoogleDriveFS.exe -ErrorAction SilentlyContinue |
       Sort-Object LastWriteTime -Descending | Select-Object -First 1
if ($exe) {
  Start-Process $exe.FullName
  Start-Sleep 5
  Get-Process GoogleDriveFS -ErrorAction SilentlyContinue | Select-Object Name, Id, StartTime
} else {
  'Google Drive for desktop does not appear to be installed on this machine.'
}`);

S('gdrive-reset','cloud','Reset the Google Drive local cache',['changes','risk'],
'For sync that will not recover after a restart. Renames the local Drive cache so it rebuilds from scratch. <b>Anything not yet uploaded is in that folder</b>, so check the Drive window for pending uploads first and warn the user it will re-scan, which takes a while on a big My Drive.',
String.raw`
Stop-Process -Name GoogleDriveFS -Force -ErrorAction SilentlyContinue
Start-Sleep 3
$stamp = Get-Date -Format yyyyMMddHHmm
Rename-Item "$env:LOCALAPPDATA\Google\DriveFS" "DriveFS.old_$stamp" -ErrorAction SilentlyContinue
Write-Host "Cache renamed to DriveFS.old_$stamp. Start Google Drive and let it rebuild."`);

S('gdrive-space','cloud','How much disk is Google Drive using locally?',[],
'Files On-Demand keeps most things online, but a folder set to "Available offline" pulls everything down. A common reason a laptop fills up for no obvious reason.',
String.raw`
$fs = "$env:LOCALAPPDATA\Google\DriveFS"
if (Test-Path $fs) {
  $size = (Get-ChildItem $fs -Recurse -File -Force -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
  "Google Drive local cache: {0} GB" -f [math]::Round($size / 1GB, 2)
} else { 'Google Drive for desktop is not installed for this user.' }`);

S('zoom-cache','cloud','Clear the Zoom cache',['changes'],
'For Zoom failing to start, hanging on "connecting", or a broken sign-in. Closes Zoom and clears its local data.',
String.raw`
Stop-Process -Name Zoom -Force -ErrorAction SilentlyContinue
Start-Sleep 2
Remove-Item "$env:APPDATA\Zoom\data" -Recurse -Force -ErrorAction SilentlyContinue
Start-Process "$env:APPDATA\Zoom\bin\Zoom.exe" -ErrorAction SilentlyContinue
Write-Host 'Zoom cache cleared.'`);

S('call-apps-audio','cloud','What are Meet, Zoom and Slack using for audio?',[],
'Windows and the calling app keep separate device lists and they disagree more often than you would think. This shows what Windows thinks is the default; the app settings have to be checked in the app itself.',
String.raw`
Get-PnpDevice -Class AudioEndpoint | Where-Object Status -eq 'OK' |
  Select-Object FriendlyName, Status | Sort-Object FriendlyName | Format-Table -AutoSize
Write-Host ''
Write-Host 'Now check inside the app as well:' -ForegroundColor Yellow
Write-Host '  Meet  : the three dots in the call, then Settings, Audio'
Write-Host '  Zoom  : the arrow next to Mute, then Audio Settings'
Write-Host '  Slack : Preferences, Audio and video'`);

/* ---------------- MICROSOFT 365 ----------------
   Only shown when the Microsoft switch is on, so a Google shop never sees
   any of it. Most Microsoft tickets are really identity tickets wearing an
   Outlook or Teams costume, which is why that section comes first.
   ---------------------------------------------------------------------- */

S('ms-identity','ms365','Identity health: join state, PRT and licensing',[],
'Start every Microsoft ticket here. AzureAdJoined or DomainJoined tells you what the device is; <b>AzureAdPrt : YES</b> is the one that matters. If the PRT is NO, single sign-on is dead and Office, Teams and OneDrive will all nag for a password until it comes back. Nine out of ten "Outlook keeps asking me to sign in" tickets end here.',
String.raw`
dsregcmd /status
Write-Host ''
Write-Host 'Look for: AzureAdJoined, DomainJoined, AzureAdPrt' -ForegroundColor Yellow`);

S('ms-wam-reset','ms365','The sign-in loop fix nobody knows',['changes','risk'],
'<b>The single most useful script in this section.</b> Windows keeps its work account tokens in a broker cache, and when that cache goes bad you get an endless loop: sign in, accepted, asked again. No amount of password resetting fixes it because the password was never the problem.<br><br>This closes the Office apps, clears the broker token cache and refreshes the device registration. The user signs in once more and it sticks. Warn them first, because everything Microsoft closes.',
String.raw`
'ms-teams','OUTLOOK','olk','onedrive','winword','excel','powerpnt' | ForEach-Object {
  Stop-Process -Name $_ -Force -ErrorAction SilentlyContinue
}
Start-Sleep 3
$broker = "$env:LOCALAPPDATA\Packages\Microsoft.AAD.BrokerPlugin_cw5n1h2txyewy\AC\TokenBroker\Accounts"
if (Test-Path $broker) {
  Get-ChildItem $broker -File -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
  Write-Host 'Token broker cache cleared.'
} else { Write-Host 'Broker cache not found, which is unusual. Carry on anyway.' }
dsregcmd /forcerecovery
Write-Host 'Device registration refreshed. Ask them to sign in again.' -ForegroundColor Yellow`);

S('ms-office-identity','ms365','Clear the Office identity and licence cache',['changes','risk'],
'For "your account does not allow editing", a licence that will not activate, or an Office stuck signed in as the wrong person, often a personal account from a previous install. Removes the cached identity and licensing so Office re-fetches both. The user signs in again afterwards.',
String.raw`
'OUTLOOK','winword','excel','powerpnt','onenote','ms-teams' | ForEach-Object {
  Stop-Process -Name $_ -Force -ErrorAction SilentlyContinue
}
Start-Sleep 3
Remove-Item 'HKCU:\Software\Microsoft\Office\16.0\Common\Identity' -Recurse -Force -ErrorAction SilentlyContinue
Remove-Item "$env:LOCALAPPDATA\Microsoft\Office\16.0\Licensing" -Recurse -Force -ErrorAction SilentlyContinue
Write-Host 'Identity and licence cache cleared. Reopen an Office app and sign in.'`);

S('ms-creds','ms365','Clear cached Microsoft credentials',['changes'],
'The other half of the password-prompt problem. Removes saved Office, Teams and OneDrive entries from Credential Manager, which otherwise keep presenting an old password and re-triggering the prompt you are trying to stop.',
String.raw`
cmdkey /list | Select-String 'Target:.*(MicrosoftOffice|msteams|OneDrive|MicrosoftAccount|virtualapp/didlogical)' | ForEach-Object {
  $target = ($_.Line -replace '.*Target:\s*', '').Trim()
  Write-Host "Removing $target"
  cmdkey /delete:$target | Out-Null
}
Write-Host 'Done. They will be asked to sign in once more.'`);

S('ol-which','ms365','Classic Outlook or new Outlook?',[],
'Ask this before anything else, because the two share almost no troubleshooting. New Outlook is a Store app with no OST, no profiles and no safe mode, so half the classic fixes simply do not exist. Plenty of users have both installed and do not know which one they opened.',
String.raw`
$classic = Get-ChildItem 'C:\Program Files\Microsoft Office\root\Office16\OUTLOOK.EXE','C:\Program Files (x86)\Microsoft Office\root\Office16\OUTLOOK.EXE' -ErrorAction SilentlyContinue
if ($classic) { "Classic Outlook: " + $classic[0].FullName + "  (" + $classic[0].VersionInfo.ProductVersion + ")" }
else          { 'Classic Outlook: not installed' }
$new = Get-AppxPackage -Name 'Microsoft.OutlookForWindows' -ErrorAction SilentlyContinue
if ($new) { "New Outlook:     installed, version " + $new.Version } else { 'New Outlook:     not installed' }
Write-Host ''
Get-Process OUTLOOK,olk -ErrorAction SilentlyContinue |
  Select-Object @{n='Running now';e={ if ($_.Name -eq 'olk') { 'New Outlook' } else { 'Classic Outlook' } }}, Id, StartTime`);

S('ol-datafiles','ms365','Outlook data files: where they are and how big',[],
'<b>The one you will use most.</b> Lists every OST and PST with its size and last write time. An OST over about 40 GB gets slow and flaky regardless of the hardware, and it is a very common cause of both "Outlook is slow" and "my disk is full" on the same machine. PSTs over a network share are unsupported and corrupt themselves eventually, so if one turns up on a mapped drive, that is your answer.',
String.raw`
$paths = "$env:LOCALAPPDATA\Microsoft\Outlook", "$env:USERPROFILE\Documents\Outlook Files"
Get-ChildItem $paths -Include *.ost,*.pst -Recurse -File -ErrorAction SilentlyContinue |
  Select-Object @{n='GB';e={ [math]::Round($_.Length/1GB,2) }},
                LastWriteTime, Name, DirectoryName |
  Sort-Object GB -Descending | Format-Table -AutoSize
Write-Host ''
Write-Host 'Over ~40 GB on an OST is where Outlook starts misbehaving.' -ForegroundColor Yellow
Write-Host 'A PST on a network drive is unsupported and will corrupt eventually.' -ForegroundColor Yellow`);

S('ol-rebuild-ost','ms365','Rebuild the OST from scratch',['changes','risk'],
'For search that will not index, folders that will not sync, a mailbox showing stale mail, or a corrupt data file. Closes Outlook and renames the OST so Outlook builds a fresh one on next start.<br><br><b>Nothing in an OST is unique</b>, it is a cache of what is on the server, so this loses nothing. But the rebuild re-downloads the whole mailbox, which on a big one and a poor connection is hours. Do it when they can be without Outlook, not at 9am.',
String.raw`
Stop-Process -Name OUTLOOK -Force -ErrorAction SilentlyContinue
Start-Sleep 3
$stamp = Get-Date -Format yyyyMMddHHmm
Get-ChildItem "$env:LOCALAPPDATA\Microsoft\Outlook" -Filter *.ost -ErrorAction SilentlyContinue | ForEach-Object {
  $new = $_.Name + ".old_$stamp"
  Rename-Item $_.FullName $new
  Write-Host "Renamed $($_.Name) to $new  ($([math]::Round($_.Length/1GB,2)) GB)"
}
Write-Host 'Start Outlook. It will rebuild the cache. Delete the .old file once they confirm it is fine.' -ForegroundColor Yellow`);

S('ol-scanpst','ms365','Find and run the Inbox Repair Tool (ScanPST)',['changes'],
'For a PST that will not open or throws errors. The tool ships with Office but the path moves with every version and architecture, so finding it is most of the battle. This locates it and opens it; point it at the PST from the data files script.<br><br>Back the PST up first. ScanPST repairs in place and does not always improve things.',
String.raw`
$roots = 'C:\Program Files\Microsoft Office', 'C:\Program Files (x86)\Microsoft Office'
$scan = Get-ChildItem $roots -Filter SCANPST.EXE -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
if ($scan) {
  "Found: $($scan.FullName)"
  Start-Process $scan.FullName
} else {
  'SCANPST.EXE not found. Classic Outlook may not be installed on this machine.'
}`);

S('ol-profiles','ms365','List Outlook profiles and which one is default',[],
'A machine with several profiles, or a profile left behind by a previous user, causes some genuinely baffling behaviour. Shows what exists and which one Outlook opens by default.',
String.raw`
$root = 'HKCU:\Software\Microsoft\Office\16.0\Outlook'
"Default profile: " + (Get-ItemProperty $root -Name DefaultProfile -ErrorAction SilentlyContinue).DefaultProfile
"Profiles found:"
Get-ChildItem "$root\Profiles" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty PSChildName
Write-Host ''
Write-Host 'To create a clean one: outlook.exe /profiles, or Control Panel, Mail, Show Profiles.'`);

S('ol-safe','ms365','Outlook safe mode and the repair switches',[],
'Safe mode opens with no add-ins. If Outlook behaves there, an add-in is your culprit: File, Options, Add-ins, COM Add-ins, untick one at a time. The commented lines fix a broken folder pane, corrupted views and stuck reminders, which between them cover most of the odd-looking Outlook faults.',
String.raw`
Stop-Process -Name OUTLOOK -Force -ErrorAction SilentlyContinue
Start-Process outlook.exe -ArgumentList '/safe'
# "Cannot start Microsoft Outlook. Cannot open the Outlook window":
# Start-Process outlook.exe -ArgumentList '/resetnavpane'
# Views corrupted or folders showing the wrong columns:
# Start-Process outlook.exe -ArgumentList '/cleanviews'
# Reminders firing repeatedly or not at all:
# Start-Process outlook.exe -ArgumentList '/cleanreminders'`);

S('ol-cached','ms365','Cached mode and how much mail is kept offline',[],
'The sync slider. Someone keeping three years offline on a laptop with a small SSD is a disk-space ticket waiting to happen, and shortening it is usually less disruptive than deleting anything. 1 month keeps the OST small; All is what makes it enormous.',
String.raw`
Get-ChildItem 'HKCU:\Software\Microsoft\Office\16.0\Outlook\Profiles' -Recurse -ErrorAction SilentlyContinue |
  Where-Object { $_.Property -contains '00036601' } |
  ForEach-Object { [PSCustomObject]@{ Profile = ($_.Name -split '\\')[6]; Key = $_.PSChildName } } |
  Format-Table -AutoSize
Write-Host 'Change it in: File, Account Settings, Account Settings, double-click the account, Mail to keep offline.'`);

/* ---- Teams, OneDrive, Office ---- */
S('ms-teams-cache','ms365','Clear the Teams cache',['changes'],
'First thing for Teams not loading, a blank window, stuck presence, missing chats or a sign-in loop. Closes Teams, clears the cache and reopens it. Nothing is lost, it all lives in the service.',
String.raw`
Stop-Process -Name ms-teams -Force -ErrorAction SilentlyContinue
Start-Sleep 3
Remove-Item "$env:LOCALAPPDATA\Packages\MSTeams_8wekyb3d8bbwe\LocalCache\Microsoft\MSTeams\*" -Recurse -Force -ErrorAction SilentlyContinue
Start-Process explorer.exe 'shell:AppsFolder\MSTeams_8wekyb3d8bbwe!MSTeams'
Write-Host 'Teams cache cleared and Teams restarted.'`);

S('ms-teams-reset','ms365','Full Teams reset',['changes','risk'],
'When the cache clear was not enough. Removes the whole local Teams data store, so they sign in from scratch. Warn them: anything unsent goes with it.',
String.raw`
Stop-Process -Name ms-teams -Force -ErrorAction SilentlyContinue
Start-Sleep 3
$stamp = Get-Date -Format yyyyMMddHHmm
$pkg = "$env:LOCALAPPDATA\Packages\MSTeams_8wekyb3d8bbwe\LocalCache"
if (Test-Path $pkg) { Rename-Item $pkg "LocalCache.old_$stamp" -ErrorAction SilentlyContinue }
Start-Process explorer.exe 'shell:AppsFolder\MSTeams_8wekyb3d8bbwe!MSTeams'
Write-Host "Old data kept as LocalCache.old_$stamp if you need anything back."`);

S('ms-onedrive-reset','ms365','Reset OneDrive',['changes'],
'Fixes stuck sync. Nothing is deleted; OneDrive re-scans everything afterwards, which takes a while on a big library. Run as the user, not elevated.',
String.raw`
$paths = "$env:LOCALAPPDATA\Microsoft\OneDrive\OneDrive.exe",
         "$env:ProgramFiles\Microsoft OneDrive\OneDrive.exe",
         ([Environment]::GetEnvironmentVariable('ProgramFiles(x86)') + '\Microsoft OneDrive\OneDrive.exe')
$exe = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
if ($exe) {
  & $exe /reset
  Start-Sleep 10
  if (-not (Get-Process OneDrive -ErrorAction SilentlyContinue)) { Start-Process $exe }
  Write-Host 'OneDrive reset. Give it time to re-scan.'
} else { 'OneDrive is not installed for this user.' }`);

S('ms-kfm','ms365','Known Folder Move: is Desktop and Documents actually redirected?',[],
'Worth knowing before anyone reimages a machine. If Known Folder Move is on, Desktop, Documents and Pictures live in OneDrive and are safe. If it is not, they are on the local disk only and a wipe loses them.',
String.raw`
Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders' -ErrorAction SilentlyContinue |
  Select-Object Desktop, Personal, 'My Pictures' | Format-List
Get-ChildItem 'HKCU:\Software\Microsoft\OneDrive\Accounts\Business1' -ErrorAction SilentlyContinue |
  Select-Object -ExpandProperty PSChildName`);

S('ms-office-repair','ms365','Office repair, with the right architecture',['admin','changes','risk'],
'Repairs Microsoft 365 apps without reinstalling. <b>The architecture and language are read from the machine rather than assumed</b>, which is the bit most copies of this command get wrong, so it fails silently on a 32-bit install. Closes every Office app. Quick first; change to FullRepair only if that fails, since it needs internet and takes far longer.',
String.raw`
$cfg = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Office\ClickToRun\Configuration' -ErrorAction SilentlyContinue
if ($cfg) {
  $plat = $cfg.Platform
  $cult = $cfg.ClientCulture
  "Repairing $plat Office, culture $cult"
  $exe  = "$env:ProgramFiles\Common Files\Microsoft Shared\ClickToRun\OfficeClickToRun.exe"
  $args = "scenario=Repair platform=$plat culture=$cult RepairType=QuickRepair forceappshutdown=True DisplayLevel=True"
  Start-Process $exe -ArgumentList $args
  # If Quick Repair does not do it, change RepairType to FullRepair above.
} else {
  'Click-to-Run Office not found. This may be an older MSI install.'
}`);

S('ms-office-update','ms365','Force Office to update, and show the current build',[],
'Shows the channel and build first, which tells you whether a known issue applies, then triggers the updater with its progress window.',
String.raw`
Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Office\ClickToRun\Configuration' -ErrorAction SilentlyContinue |
  Select-Object VersionToReport, Platform, ClientCulture, CDNBaseUrl | Format-List
& "$env:ProgramFiles\Common Files\Microsoft Shared\ClickToRun\OfficeC2RClient.exe" /update user`);

/* ---- Intune ---- */
S('ms-intune-sync','ms365','Force an Intune sync, and find the logs',[],
'For policy, apps or compliance that have not landed. Kicks the management extension rather than waiting for the schedule, then points you at the logs, which say far more than the Company Portal does.',
String.raw`
Get-ScheduledTask -ErrorAction SilentlyContinue |
  Where-Object { $_.TaskName -like '*PushLaunch*' } | Start-ScheduledTask
Write-Host 'Sync triggered.'
$logs = 'C:\ProgramData\Microsoft\IntuneManagementExtension\Logs'
if (Test-Path $logs) {
  Get-ChildItem $logs | Sort-Object LastWriteTime -Descending | Select-Object -First 5 Name, LastWriteTime
  Start-Process $logs
}`);

/* ---- Exchange Online and Graph. Modules required, hence the badge. ---- */
S('ms-connect','ms365','Connect to Exchange Online and Graph',['mod','net','admin'],
'The starting point for the admin scripts below. Both modules install per-user and only need doing once per machine. You will be prompted to sign in with an account that actually holds the roles.',
String.raw`
if (-not (Get-Module -ListAvailable ExchangeOnlineManagement)) {
  Install-Module ExchangeOnlineManagement -Scope CurrentUser -Force
}
if (-not (Get-Module -ListAvailable Microsoft.Graph.Users)) {
  Install-Module Microsoft.Graph -Scope CurrentUser -Force
}
Connect-ExchangeOnline
Connect-MgGraph -Scopes 'User.Read.All','User.RevokeSessions.All','Directory.Read.All'`);

S('ms-mailbox','ms365','Mailbox at a glance (uses User)',['mod','net'],
'Size, item count, quota, forwarding, litigation hold and type, in one line. Answers "why can they not send", "where is their mail going" and "how big has this got" together.',
String.raw`
Get-MailboxStatistics -Identity '{{USER}}' |
  Select-Object DisplayName, TotalItemSize, ItemCount, LastLogonTime | Format-List
Get-Mailbox -Identity '{{USER}}' |
  Select-Object RecipientTypeDetails, PrimarySmtpAddress, ProhibitSendQuota,
                ForwardingSmtpAddress, DeliverToMailboxAndForward, LitigationHoldEnabled |
  Format-List`);

S('ms-signin-logs','ms365','Why did their sign-in fail? (uses User)',['mod','net'],
'The Entra sign-in log for that user. The failure code is the whole answer: 50126 is a wrong password, 50076 and 50079 are MFA required, 53003 is Conditional Access blocking them, 50053 is a locked account. Stops you guessing.',
String.raw`
Get-MgAuditLogSignIn -Filter "userPrincipalName eq '{{USER}}'" -Top 20 |
  Select-Object CreatedDateTime, AppDisplayName, IpAddress,
                @{n='Result';e={ $_.Status.ErrorCode }},
                @{n='Why';e={ $_.Status.FailureReason }} |
  Format-Table -AutoSize -Wrap`);

S('ms-revoke','ms365','Revoke every active session (uses User)',['mod','net','risk'],
'<b>The step people miss when someone leaves or an account is compromised.</b> Resetting a password does not end sessions that are already signed in. A phone or a browser with a live token keeps working for hours. This kills all of them immediately.',
String.raw`
Revoke-MgUserSignInSession -UserId '{{USER}}'
Write-Host 'All sessions revoked. Every device will be asked to sign in again.' -ForegroundColor Yellow`);

S('ms-leaver','ms365','Leaver: convert, forward and delegate (uses User)',['mod','net','changes','risk'],
'The mailbox half of an offboarding, in the order that works. A shared mailbox under 50 GB needs no licence, so converting frees the seat while keeping everything. <b>Read each line before you run it</b> and delete the ones that do not apply; forwarding and delegation in particular need agreeing with HR first.',
String.raw`
# 1. Free the licence but keep the mail. Only under 50 GB.
Set-Mailbox -Identity '{{USER}}' -Type Shared

# 2. Forward incoming mail. Agree the recipient and the duration first.
# Set-Mailbox -Identity '{{USER}}' -ForwardingSmtpAddress 'someone@yourdomain.com' -DeliverToMailboxAndForward $true

# 3. Give a colleague access to the mailbox.
# Add-MailboxPermission -Identity '{{USER}}' -User 'someone@yourdomain.com' -AccessRights FullAccess -InheritanceType All

# 4. Hide them from the address book.
# Set-Mailbox -Identity '{{USER}}' -HiddenFromAddressListsEnabled $true

Get-Mailbox -Identity '{{USER}}' | Select-Object RecipientTypeDetails, ForwardingSmtpAddress, HiddenFromAddressListsEnabled | Format-List`);

'Quick reachability check before trying anything else.',

S('ps-session','remote','Open a remote PowerShell session (uses Computer)',['remote','admin'],

S('remote-snapshot','remote','Remote system snapshot (uses Computer)',['remote','admin'],
'Runs a mini snapshot on the remote machine without disturbing the user.',
String.raw`

  $os = Get-CimInstance Win32_OperatingSystem

S('remote-user','remote','Who is logged on to a remote PC? (uses Computer)',['remote'],
'Check before restarting someone\'s machine.',

Get-CimInstance Win32_ComputerSystem -ComputerName {{COMPUTER}} | Select-Object Name, UserName`);

S('remote-disk','remote','Remote disk space (uses Computer)',['remote'],
'Free space on a remote machine without connecting to it.',

S('remote-restart','remote','Restart a remote PC (uses Computer)',['remote','admin','changes','risk'],
'<b>Check who is logged on first.</b> -Force will close their apps without saving.',

S('remote-cshare','remote','Browse a remote PC\'s C: drive (uses Computer)',['remote','admin'],

S('msra','remote','Offer Remote Assistance (uses Computer)',['remote'],
'Offers a Windows Remote Assistance session to the machine. For users off-network, use Quick Assist instead (Ctrl + Windows + Q on their machine).',
String.raw`
msra /offerra {{COMPUTER}}`);

S('enable-remoting','remote','Enable PowerShell remoting on this PC',['admin','changes'],
'Run on the target machine if Enter-PSSession / Invoke-Command fails with a WinRM error. Normally this is set by Group Policy instead.',
String.raw`
Enable-PSRemoting -Force`);

S('battery-report','hardware','Laptop battery health report',[],
'Creates a report on the desktop and opens it. Compare Design Capacity with Full Charge Capacity: below about 60% means the battery is worn out.',

S('problem-devices','hardware','Devices with driver problems',[],
'The same as yellow warning triangles in Device Manager.',

S('monitors','hardware','Connected monitors: make, model, serial',[],
'Handy for asset records and for checking Windows actually sees a second screen.',

Get-CimInstance -Namespace root\wmi -ClassName WmiMonitorID -ErrorAction SilentlyContinue | ForEach-Object {

} | Format-Table -AutoSize`);

S('audio-devices','hardware','Audio devices (speakers, headsets, mics)',[],
'Shows every playback and recording device Windows knows about and whether it is working.',
String.raw`
Get-PnpDevice -Class AudioEndpoint | Select-Object FriendlyName, Status | Sort-Object FriendlyName | Format-Table -AutoSize`);

S('audio-restart','hardware','Restart the Windows audio service',['admin','changes'],
'Fixes no sound / red X on the speaker icon more often than you would expect.',
String.raw`
Restart-Service Audiosrv -Force
Get-Service Audiosrv, AudioEndpointBuilder`);

S('bsod-history','hardware','Blue screen history',[],
'Lists recent bugchecks with their stop codes and any crash dump files. The same stop code repeating points to a driver or hardware fault.',
String.raw`
Get-WinEvent -FilterHashtable @{ LogName='System'; ProviderName='Microsoft-Windows-WER-SystemErrorReporting' } -MaxEvents 10 -ErrorAction SilentlyContinue |
  Select-Object TimeCreated, @{n='Message';e={ ($_.Message -split "\r?\n")[0] }} |

Get-ChildItem "$env:SystemRoot\Minidump" -ErrorAction SilentlyContinue | Select-Object Name, LastWriteTime`);

S('drivers','hardware','Driver versions and dates',[],
'Every signed driver with its version and date. Very old display, network or dock drivers are common troublemakers.',
String.raw`
Get-CimInstance Win32_PnPSignedDriver | Where-Object DeviceName |
  Select-Object DeviceName, DriverVersion, @{n='Date';e={ $_.DriverDate.ToString('yyyy-MM-dd') }}, Manufacturer |
