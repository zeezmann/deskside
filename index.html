/* ============================================================
   UTILITIES
   Five small tools that do the work here in the page rather than
   handing you a command to run somewhere else. Ported from the
   separate tools page so there is one file to find, not two.
   Nothing they touch leaves the browser: the checksum and the CSV
   inspector read files locally, and the password generator uses
   the browser's own cryptographic random source.
   ============================================================ */

// <template> parses any HTML correctly (including <option> and <tr>, which a
// <div> silently discards) and lets a fragment carry several sibling nodes.
function frag(h){
  const t = document.createElement('template');
  t.innerHTML = h.trim();
  return t.content.childNodes.length === 1 ? t.content.firstChild : t.content;
}

/* A tool that binds to window or document would stack a fresh listener every
   time you opened it. Anything registered through here is torn down on the
   next view change. */
let utilListeners = [];
function utilOn(target, ev, fn){ target.addEventListener(ev, fn); utilListeners.push([target, ev, fn]); }
function utilCleanup(){
  utilListeners.forEach(([t, ev, fn]) => t.removeEventListener(ev, fn));
  utilListeners = [];
}

  function el(id) { return document.getElementById(id); }
  function copyBtn(getText) {
    var b = frag('<button class="mini">Copy</button>');
    b.onclick = function () {
      var t = getText(); if (!t) return;
      navigator.clipboard.writeText(t).then(function () {
        var o = b.textContent; b.textContent = 'Copied'; setTimeout(function () { b.textContent = o; }, 1100);
      }).catch(function () { b.textContent = 'Copy failed'; });
    };
    return b;
  }

  /* ============================ 1. SUBNET CALCULATOR ============================ */

  function ipToInt(s) {
    var p = s.trim().split('.');
    if (p.length !== 4) return null;
    var n = 0;
    for (var i = 0; i < 4; i++) {
      if (!/^\d{1,3}$/.test(p[i])) return null;
      var v = +p[i]; if (v > 255) return null;
      n = (n * 256) + v;
    }
    return n;
  }
  function intToIp(n) {
    n = n >>> 0;
    return [(n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255].join('.');
  }
  function maskInt(bits) { return bits === 0 ? 0 : (0xFFFFFFFF << (32 - bits)) >>> 0; }

  function subnetTool(root) {
    root.appendChild(frag(
      '<div class="card"><h3>Network</h3>' +
      '<div class="row2">' +
        '<div><label class="f" for="sn-ip">Address / CIDR</label>' +
          '<input type="text" id="sn-ip" value="10.20.30.42/24" spellcheck="false"></div>' +
        '<div><label class="f" for="sn-bits">Prefix</label>' +
          '<select id="sn-bits"></select></div>' +
      '</div>' +
      '<p class="hint" style="margin:12px 0 0">Type <code>10.0.0.0/22</code>, or an address and pick the prefix. ' +
      'Also accepts a dotted mask, e.g. <code>192.168.1.10 255.255.255.0</code>.</p>' +
      '</div><div id="sn-out"></div>'));

    var sel = el('sn-bits');
    for (var b = 32; b >= 8; b--) sel.appendChild(frag('<option value="' + b + '">/' + b + ' — ' + intToIp(maskInt(b)) + '</option>'));
    sel.value = '24';

    function calc() {
      var raw = el('sn-ip').value.trim();
      var bits = null, ipStr = raw;
      var m = /^(\S+)\s*\/\s*(\d{1,2})$/.exec(raw);
      if (m) { ipStr = m[1]; bits = +m[2]; }
      else {
        var m2 = /^(\S+)[\s,]+(\d+\.\d+\.\d+\.\d+)$/.exec(raw);
        if (m2) {
          ipStr = m2[1];
          var mi = ipToInt(m2[2]);
          if (mi != null) { var c = 0, x = mi >>> 0; while (x & 0x80000000) { c++; x = (x << 1) >>> 0; } bits = c; }
        } else bits = +sel.value;
      }
      var ip = ipToInt(ipStr);
      var out = el('sn-out');
      if (ip == null || bits == null || bits < 0 || bits > 32) {
        out.innerHTML = '<div class="card"><div class="err">That doesn\'t parse as an IPv4 address and prefix.</div></div>';
        return;
      }
      sel.value = String(bits);
      var mask = maskInt(bits), net = (ip & mask) >>> 0, bcast = (net | (~mask >>> 0)) >>> 0;
      var total = Math.pow(2, 32 - bits);
      var usable = bits >= 31 ? (bits === 32 ? 1 : 2) : total - 2;
      var first = bits >= 31 ? net : net + 1;
      var lastH = bits >= 31 ? bcast : bcast - 1;

      var rows = [
        ['Network address', intToIp(net) + '/' + bits],
        ['Subnet mask', intToIp(mask)],
        ['Wildcard mask', intToIp(~mask >>> 0)],
        ['Broadcast', bits >= 31 ? '—' : intToIp(bcast)],
        ['First usable host', intToIp(first)],
        ['Last usable host', intToIp(lastH)],
        ['Usable hosts', usable.toLocaleString()],
        ['Total addresses', total.toLocaleString()],
        ['Range', intToIp(net) + '  →  ' + intToIp(bcast)]
      ];
      out.innerHTML = '<div class="card"><h3>Result</h3><table><tbody>' +
        rows.map(function (r) { return '<tr><td class="k">' + r[0] + '</td><td class="v">' + r[1] + '</td></tr>'; }).join('') +
        '</tbody></table></div>' +
        '<div class="card"><h3>Split into smaller subnets</h3>' +
        '<div class="inline"><label class="f" style="margin:0">New prefix</label>' +
        '<select id="sn-split"></select><span class="muted" id="sn-splitn"></span></div>' +
        '<div class="scroll" id="sn-splitout" style="margin-top:12px"></div></div>';

      var sp = el('sn-split');
      for (var nb = bits; nb <= Math.min(32, bits + 8); nb++) sp.appendChild(frag('<option value="' + nb + '">/' + nb + '</option>'));
      sp.value = String(Math.min(32, bits + 1));
      sp.onchange = split;
      split();

      function split() {
        var nb = +sp.value, count = Math.pow(2, nb - bits), size = Math.pow(2, 32 - nb);
        el('sn-splitn').textContent = count.toLocaleString() + ' subnet' + (count === 1 ? '' : 's') +
          ' of ' + (nb >= 31 ? size : size - 2).toLocaleString() + ' usable host' +
          ((nb >= 31 ? size : size - 2) === 1 ? '' : 's');
        var lim = Math.min(count, 256), h = '<table><thead><tr><th>#</th><th>Network</th><th>Range</th></tr></thead><tbody>';
        for (var i = 0; i < lim; i++) {
          var s = (net + i * size) >>> 0, e = (s + size - 1) >>> 0;
          h += '<tr><td class="num">' + (i + 1) + '</td><td class="v">' + intToIp(s) + '/' + nb +
               '</td><td class="v">' + intToIp(s) + ' – ' + intToIp(e) + '</td></tr>';
        }
        h += '</tbody></table>';
        el('sn-splitout').innerHTML = h + (count > lim ?
          '<p class="muted" style="padding:8px 10px">Showing first 256 of ' + count.toLocaleString() + '.</p>' : '');
      }
    }
    el('sn-ip').addEventListener('input', calc);
    sel.addEventListener('change', function () {
      var v = el('sn-ip').value.trim().replace(/\s*\/\s*\d+$/, '');
      el('sn-ip').value = v + '/' + sel.value; calc();
    });
    calc();
  }

  /* ============================ 2. PASSWORD GENERATOR ============================ */

  function parseCSV(text) {
    text = text.replace(/^﻿/, '');
    var head = text.split('\n')[0];
    var delim = head.split('\t').length > head.split(',').length ? '\t' : ',';
    var rows = [], row = [], val = '', q = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (q) { if (c === '"') { if (text[i+1] === '"') { val += '"'; i++; } else q = false; } else val += c; }
      else if (c === '"') q = true;
      else if (c === delim) { row.push(val); val = ''; }
      else if (c === '\n') { row.push(val); rows.push(row); row = []; val = ''; }
      else if (c !== '\r') val += c;
    }
    if (val.length || row.length) { row.push(val); rows.push(row); }
    return rows;
  }

      var badEmail = [], dupEmail = [], seen = {};
      if (emailCol >= 0) {

        '<div class="card"><h3>The same number, three ways</h3><table>' +
        rows.map(function (r) { return '<tr><td class="k">' + esc(r[0]) + '</td><td class="v">' + esc(r[1]) + '</td></tr>'; }).join('') +
        '</table></div>' +
        '<div class="card"><h3>What it means</h3>' +
        findings.map(function (f) {
          return '<div style="margin-bottom:12px"><b>' + esc(f[1]) + '</b><br>' +
            '<span class="muted">' + esc(f[2]) + '</span></div>';
        }).join('') +
        '<div class="hint">Decoding the number tells you which subsystem complained. It almost never ' +
        'tells you why. The log belonging to that subsystem does.</div></div>';
    }
  }

  /* ============================ 10. COMPARE TWO OUTPUTS ============================
     "It works on my machine" is a diff waiting to happen. Two ipconfig /all
     outputs, two registry exports, the same config before and after - the answer
     is nearly always a line that is in one and not the other. */

  function diffLines(a, b) {
    // Trim the matching top and bottom first; on real config files that usually
    // leaves a handful of lines to actually compare.
    var pre = 0, sufA = a.length, sufB = b.length;
    while (pre < a.length && pre < b.length && a[pre] === b[pre]) pre++;
    while (sufA > pre && sufB > pre && a[sufA - 1] === b[sufB - 1]) { sufA--; sufB--; }
    var A = a.slice(pre, sufA), B = b.slice(pre, sufB);

    var out = [];
    for (var i = 0; i < pre; i++) out.push(['=', a[i], i + 1, i + 1]);

    var CAP = 1400;
    if (A.length > CAP || B.length > CAP) {
      // Too big for the table below, so fall back to a blunt but honest answer.
      var setB = new Set(B), setA = new Set(A);
      A.forEach(function (l, i) { if (!setB.has(l)) out.push(['-', l, pre + i + 1, null]); });
      B.forEach(function (l, i) { if (!setA.has(l)) out.push(['+', l, null, pre + i + 1]); });
      out.truncated = true;
    } else {
      var n = A.length, m = B.length;
      var dp = new Uint32Array((n + 1) * (m + 1));
      for (var x = n - 1; x >= 0; x--)
        for (var y = m - 1; y >= 0; y--)
          dp[x * (m + 1) + y] = A[x] === B[y]
            ? dp[(x + 1) * (m + 1) + y + 1] + 1
            : Math.max(dp[(x + 1) * (m + 1) + y], dp[x * (m + 1) + y + 1]);
      var i2 = 0, j2 = 0;
      while (i2 < n && j2 < m) {
        if (A[i2] === B[j2]) { out.push(['=', A[i2], pre + i2 + 1, pre + j2 + 1]); i2++; j2++; }
        else if (dp[(i2 + 1) * (m + 1) + j2] >= dp[i2 * (m + 1) + j2 + 1]) { out.push(['-', A[i2], pre + i2 + 1, null]); i2++; }
        else { out.push(['+', B[j2], null, pre + j2 + 1]); j2++; }
      }
      while (i2 < n) { out.push(['-', A[i2], pre + i2 + 1, null]); i2++; }
      while (j2 < m) { out.push(['+', B[j2], null, pre + j2 + 1]); j2++; }
    }
    for (var k = sufA; k < a.length; k++) out.push(['=', a[k], k + 1, sufB + (k - sufA) + 1]);
    return out;
  }

  function diffTool(root) {
    root.appendChild(frag(
      '<div class="row2">' +
      '<div class="card"><h3>Before, or the machine that works</h3>' +
      '<textarea id="df-a" spellcheck="false" placeholder="Paste the first output here"></textarea></div>' +
      '<div class="card"><h3>After, or the machine that does not</h3>' +
      '<textarea id="df-b" spellcheck="false" placeholder="Paste the second output here"></textarea></div>' +
      '</div>' +
      '<div class="card"><div class="inline">' +
      '<button class="primary" id="df-go">Compare</button>' +
      '<label class="chk"><input type="checkbox" id="df-ws" checked> Ignore leading and trailing spaces</label>' +
      '<label class="chk"><input type="checkbox" id="df-case"> Ignore capitals</label>' +
      '<label class="chk"><input type="checkbox" id="df-only" checked> Only show what changed</label>' +
      '<button id="df-swap">Swap sides</button>' +
      '<button id="df-clear">Clear</button>' +
      '</div></div>' +
      '<div id="df-out"></div>'));

    el('df-go').onclick = run;
    el('df-swap').onclick = function () {
      var a = el('df-a').value; el('df-a').value = el('df-b').value; el('df-b').value = a; run();
    };
    el('df-clear').onclick = function () {
      el('df-a').value = ''; el('df-b').value = ''; el('df-out').innerHTML = '';
    };
    ['df-ws','df-case','df-only'].forEach(function (id) {
      el(id).onchange = function () { if (el('df-out').innerHTML) run(); };
    });

    function run() {
      var raw = function (v) { return String(v).replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n'); };
      var a0 = raw(el('df-a').value), b0 = raw(el('df-b').value);
      if (!el('df-a').value.trim() && !el('df-b').value.trim()) {
        el('df-out').innerHTML = '<div class="card"><div class="err">Paste something into both sides first.</div></div>';
        return;
      }
      var norm = function (l) {
        var s = l;
        if (el('df-ws').checked) s = s.trim();
        if (el('df-case').checked) s = s.toLowerCase();
        return s;
      };
      var res = diffLines(a0.map(norm), b0.map(norm));
      // Show the original text rather than the normalised text.
      res.forEach(function (r) {
        if (r[2]) r[1] = a0[r[2] - 1];
        else if (r[3]) r[1] = b0[r[3] - 1];
      });

      var added = res.filter(function (r) { return r[0] === '+'; }).length;
      var removed = res.filter(function (r) { return r[0] === '-'; }).length;
      var onlyChanged = el('df-only').checked;

      var rows = [], lastShown = -5;
      res.forEach(function (r, i) {
        if (onlyChanged && r[0] === '=') {
          // Keep two lines of context either side so a change has somewhere to sit.
          var near = res.slice(Math.max(0, i - 2), i + 3).some(function (x) { return x[0] !== '='; });
          if (!near) {
            if (lastShown === i - 1) rows.push('<tr class="gap"><td colspan="3">...</td></tr>');
            return;
          }
        }
        lastShown = i;
        var cls = r[0] === '+' ? 'add' : r[0] === '-' ? 'del' : '';
        rows.push('<tr class="' + cls + '">' +
          '<td class="num">' + (r[2] || '') + '</td>' +
          '<td class="num">' + (r[3] || '') + '</td>' +
          '<td class="dl">' + (r[0] === '=' ? '&nbsp;' : r[0]) + ' ' + esc(r[1] === undefined ? '' : r[1]) + '</td></tr>');
      });

      el('df-out').innerHTML =
        '<div class="card"><h3>Result</h3>' +
        '<div style="margin-bottom:12px">' +
          (added || removed
            ? '<span class="badge b-critical"><span class="dot"></span>' + removed + ' only on the left</span> ' +
              '<span class="badge b-good"><span class="dot"></span>' + added + ' only on the right</span>'
            : '<span class="badge b-good"><span class="dot"></span>identical</span>') +
        '</div>' +
        (res.truncated ? '<div class="hint">These are large, so this is a line-set comparison rather than ' +
          'a true diff: it lists lines present on one side and not the other, without trying to line them up.</div>' : '') +
        (added || removed
          ? '<div class="scroll" style="max-height:60vh"><table class="difftab"><thead><tr>' +
            '<th class="num">L</th><th class="num">R</th><th>Line</th></tr></thead><tbody>' +
            rows.join('') + '</tbody></table></div>'
          : '<div class="ok">The two sides are the same' +
            (el('df-ws').checked || el('df-case').checked ? ', with the options above applied' : '') + '.</div>') +
        '</div>';
    }
  }

  /* ============================ 12. WHICH WINDOWS IS THIS ============================

  // The newest release this table covers. It is a statement of coverage, not of

  function winverTool(root) {
    root.appendChild(frag(
      '<div class="card"><h3>Build number</h3>' +
      '<label class="f">Anything with the build in it works: <span class="mono">22631.4317</span>, ' +

      '<button class="mini" data-wv="19045.5011">19045</button>' +
      '<button class="mini" data-wv="22621.4317">22621</button>' +
      '<button class="mini" data-wv="22631.4317">22631</button>' +

      'quote one to a customer.';

    var inp = el('wv-in');
    el('wv-go').onclick = go;
    inp.onkeydown = function (e) { if (e.key === 'Enter') go(); };
    inp.oninput = function () { if (inp.value.trim()) go(); else el('wv-out').innerHTML = ''; };
    root.querySelectorAll('[data-wv]').forEach(function (b) {
      b.onclick = function () { inp.value = b.dataset.wv; go(); };
    });

    function fmt(d) {
      var x = new Date(d + 'T00:00:00Z');
      return x.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric', timeZone: 'UTC' });
    }
    function until(d) {
      var days = Math.floor((new Date(d + 'T00:00:00Z') - Date.now()) / 86400000);
      if (days < 0) return ['b-critical', 'out of support', 'Support ended ' + fmt(d) + ', ' + Math.abs(days) + ' days ago.'];
      if (days < 90) return ['b-serious', days + ' days left', 'Support ends ' + fmt(d) + '. That is close enough to be on someone’s plan already.'];
      if (days < 365) return ['b-warning', days + ' days left', 'Support ends ' + fmt(d) + '.'];
      return ['b-good', 'supported', 'Support ends ' + fmt(d) + '.'];

    function go() {
      el('wv-err').textContent = '';

          '<tr><td class="k">Enterprise, Education, IoT Enterprise</td><td class="v">' + esc(ee[2]) + '</td></tr>' +
          '</table>' +
          (client[2] === 'Windows 10' && build === 19045
            ? '<div class="hint">22H2 was the last version of Windows 10. There is no newer one to update to - ' +
              'the path forward is Windows 11 or Extended Security Updates.</div>' : '') +
          '</div>';

          ltsc.map(function (r) {

              esc(r[1]) + '</b> - ' + esc(u[2]) + '</div>';
          }).join('') +

  /* ============================ 14. PASTE CLEANER ============================
     Someone copies out of Word or a browser and into a form, a script or a
     ticket, and it breaks for no visible reason. It is nearly always a curly
     quote, a non-breaking space, or something with no width at all. */

  // Characters that look like ordinary punctuation or a space, and are not.
  var ODD_CHARS = {
    '\u00A0': 'non-breaking space', '\u200B': 'zero-width space', '\u200C': 'zero-width non-joiner',
    '\u200D': 'zero-width joiner', '\uFEFF': 'byte order mark', '\u2018': 'curly quote',
    '\u2019': 'curly quote', '\u201C': 'curly quote', '\u201D': 'curly quote',
    '\u2013': 'en dash', '\u2014': 'em dash', '\u2026': 'ellipsis', '\u00AD': 'soft hyphen',
    '\u2028': 'line separator', '\u2029': 'paragraph separator', '\u202F': 'narrow no-break space',
    '\u2007': 'figure space', '\u3000': 'ideographic space'
  };
  var CLEAN_NAMES = Object.assign({}, ODD_CHARS, {
    '\u2032': 'prime', '\u00B4': 'acute accent', '\u0060': 'backtick',
    '\u2212': 'minus sign', '\u00B7': 'middle dot', '\u2022': 'bullet',
    '\u00A9': 'copyright', '\u00AE': 'registered', '\u2122': 'trademark'
  });

  function charName(ch) {
    if (CLEAN_NAMES[ch]) return CLEAN_NAMES[ch];
    var c = ch.charCodeAt(0);
    if (c === 9) return 'tab';
    if (c === 10) return 'line feed';
    if (c === 13) return 'carriage return';
    if (c < 32) return 'control character';
    if (c > 127) return 'non-ASCII character';
    return 'character';
  }

  function cleanTool(root) {
    root.appendChild(frag(
      '<div class="card"><h3>Paste it here</h3>' +
      '<label class="f">Anything that came out of Word, a PDF, a browser or a chat window and is now ' +
      'misbehaving in a form, a script or a ticket.</label>' +
      '<textarea id="cl-in" spellcheck="false" placeholder="Paste the text that is not working"></textarea>' +
      '<div class="inline" style="margin-top:11px">' +
      '<label class="chk"><input type="checkbox" id="cl-q" checked> Straighten quotes and dashes</label>' +
      '<label class="chk"><input type="checkbox" id="cl-sp" checked> Odd spaces to normal spaces</label>' +
      '<label class="chk"><input type="checkbox" id="cl-zw" checked> Remove invisible characters</label>' +
      '<label class="chk"><input type="checkbox" id="cl-tr" checked> Trim the end of each line</label>' +
      '<label class="chk"><input type="checkbox" id="cl-bl"> Collapse blank lines</label>' +
      '<label class="chk"><input type="checkbox" id="cl-ascii"> Force plain ASCII</label>' +
      '</div>' +
      '<div class="inline" style="margin-top:11px">' +
      '<button class="primary" id="cl-go">Clean it</button>' +
      '<button id="cl-demo">Load an example</button>' +
      '<button id="cl-clear">Clear</button></div></div>' +
      '<div id="cl-out"></div>'));

    ['cl-q','cl-sp','cl-zw','cl-tr','cl-bl','cl-ascii'].forEach(function (id) {
      el(id).onchange = function () { if (el('cl-out').innerHTML) run(); };
    });
    el('cl-go').onclick = run;
    el('cl-clear').onclick = function () { el('cl-in').value = ''; el('cl-out').innerHTML = ''; };
    el('cl-demo').onclick = function () {
      el('cl-in').value = 'Hi \u2014 please run the script as \u201Cadministrator\u201D.\u00A0\n' +
        'The path is C:\\Program\u00A0Files\\Tools\u200B\\run.ps1 \n' +
        'Don\u2019t forget the \u2013nop switch\u2026';
      run();
    };

    function run() {
      var src = el('cl-in').value;
      if (!src) { el('cl-out').innerHTML = '<div class="card"><div class="err">Paste something first.</div></div>'; return; }

      // ---- what is actually in there
      var counts = {};
      for (var i = 0; i < src.length; i++) {
        var ch = src[i], c = ch.charCodeAt(0);
        var odd = CLEAN_NAMES[ch] || (c < 32 && c !== 10 && c !== 9) || c > 127;
        if (!odd) continue;
        var k = ch;
        counts[k] = counts[k] || { ch: ch, n: 0, code: c };
        counts[k].n++;
      }
      var found = Object.keys(counts).map(function (k) { return counts[k]; })
        .sort(function (a, b) { return b.n - a.n; });

      // ---- clean
      var out = src;
      if (el('cl-q').checked) out = out
        .replace(/[\u2018\u2019\u2032\u00B4]/g, "'").replace(/[\u201C\u201D]/g, '"')
        .replace(/[\u2013\u2014\u2212]/g, '-').replace(/\u2026/g, '...')
        .replace(/\u2022/g, '*');
      if (el('cl-sp').checked) out = out.replace(/[\u00A0\u202F\u2007\u2009\u200A\u3000]/g, ' ');
      if (el('cl-zw').checked) out = out.replace(/[\u200B\u200C\u200D\uFEFF\u00AD\u2028\u2029]/g, '')
        .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
      out = out.replace(/\r\n?/g, '\n');
      if (el('cl-tr').checked) out = out.split('\n').map(function (l) { return l.replace(/[ \t]+$/, ''); }).join('\n');
      if (el('cl-bl').checked) out = out.replace(/\n{3,}/g, '\n\n');
      if (el('cl-ascii').checked) out = out.normalize('NFKD').replace(/[\u0300-\u036f]/g, '').replace(/[^\x09\x0A\x20-\x7E]/g, '');

      var changed = out !== src;

      el('cl-out').innerHTML =
        '<div class="card"><h3>What was hiding in it</h3>' +
        (found.length
          ? '<div class="scroll"><table><thead><tr><th>Shows as</th><th>What it is</th>' +
            '<th class="num">Count</th><th>Code point</th></tr></thead><tbody>' +
            found.map(function (f) {
              var vis = f.code < 33 || /[\u200B\u200C\u200D\uFEFF\u00AD\u00A0\u202F\u2007\u3000]/.test(f.ch)
                ? '<span class="muted">(invisible)</span>' : esc(f.ch);
              return '<tr><td class="v mono">' + vis + '</td><td class="v">' + esc(charName(f.ch)) +
                '</td><td class="num">' + f.n + '</td><td class="v mono">U+' +
                f.code.toString(16).toUpperCase().padStart(4, '0') + '</td></tr>';
            }).join('') + '</tbody></table></div>'
          : '<div class="ok">Nothing unusual. Every character is plain ASCII, so whatever is wrong is not the characters.</div>') +
        '</div>' +
        '<div class="card"><h3>Cleaned</h3>' +
        (changed ? '' : '<div class="hint">Nothing needed changing with the options you have ticked.</div>') +
        '<div class="out mono" id="cl-res" style="white-space:pre-wrap">' + esc(out) + '</div>' +
        '<div class="inline" style="margin-top:11px"><button class="primary" id="cl-copy">Copy the clean version</button>' +
        '<span class="muted">' + src.length + ' characters in, ' + out.length + ' out</span></div></div>';

      el('cl-copy').onclick = function (e) { copyText(out, e.currentTarget); };
    }
  }

/* A fill-in value normally lands inside a single-quoted string in the script,
   and a single quote inside one of those ends the string early and breaks
   everything after it. Doubling it is how both PowerShell and shell single
   quoting escapes it, so an app called O'Reilly or a path with an apostrophe
   in it copies out as working code instead of a syntax error. */
const subst = v => String(v).replace(/'/g, "''");
const fill  = code => code.replace(/\{\{(\w+)\}\}/g, (m, k) => (k in vars ? subst(vars[k]) : m));
// Anything that is not PowerShell: it decides the shell label on the card, the
// file extension on download and whether a shebang is prepended.

/* Light syntax colouring. A whole-line comment is treated as a comment and
   left alone; otherwise quoted strings, $variables and {{fill-ins}} get
   picked out. Deliberately simple: anything cleverer would need a real
   parser and would still get PowerShell wrong somewhere. */
const CODE_RE = /(\{\{\w+\}\})|('(?:[^']|'')*')|("(?:[^"]|"")*")|(\$[A-Za-z_][A-Za-z0-9_:]*)/g;

function pill(k){
  return '<span class="tk-v" title="Fill-in: ' + esc(k) + '">' +
         esc(k in vars ? subst(vars[k]) : '{{' + k + '}}') + '</span>';
}

/* A fill-in almost always sits inside a quoted string, and the string pattern
   would otherwise swallow it whole and leave {{APP}} showing on screen. So a
   matched string is split on its placeholders and the pieces coloured either
   side of them. */
function strWithFills(raw){
  return raw.split(/(\{\{\w+\}\})/).map(part => {
    if (!part) return '';
    const m = /^\{\{(\w+)\}\}$/.exec(part);
    return m ? pill(m[1]) : '<span class="tk-s">' + esc(part) + '</span>';
  }).join('');
}

function renderCode(code){
  return code.split('\n').map(line => {
    if (/^\s*#/.test(line)) return '<span class="tk-c">' + esc(line) + '</span>';
    let out = '', last = 0, m;
    CODE_RE.lastIndex = 0;
    while ((m = CODE_RE.exec(line)) !== null){
      out += esc(line.slice(last, m.index));
      if (m[1])                out += pill(m[1].slice(2, -2));
      else if (m[2] || m[3])   out += strWithFills(m[0]);
      else                     out += '<span class="tk-d">' + esc(m[0]) + '</span>';
      last = CODE_RE.lastIndex;
    }
    return out + esc(line.slice(last));
  }).join('\n');
}

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1600);
}

function copyText(text, btn){
  const done = () => {
    if (btn){ const o = btn.dataset.lbl || btn.textContent; btn.dataset.lbl = o;
      btn.textContent = 'Copied'; btn.classList.add('ok');
      setTimeout(() => { btn.textContent = o; btn.classList.remove('ok'); }, 1300); }
    toast('Copied to clipboard');
  };
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch(e){ toast('Copy failed, select the text manually'); }
    ta.remove();
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
}

function download(name, text, crlf){
  // Windows line endings for .ps1, plain LF for shell scripts. A .sh full of
  // carriage returns fails on a Mac with a baffling "command not found".
  const body = crlf ? '﻿' + text.replace(/\n/g, '\r\n') : text;
  const blob = new Blob([body], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Saved. Windows may block it: right-click, Properties, Unblock.');
}

  h += '<div class="navh">Scripts by area</div>' +
    activeCats().map(c => item(c.id, c.name,
      activeScripts().filter(s => s.cat === c.id).length, CAT_ICON[c.id])).join('');
  h += '<div class="navh">Other</div>' +
    item('runs',  'Run-box shortcuts', RUNS.length, 'run') +
    item('notes', 'Ticket notes', undefined, 'note');
  $('#nav').innerHTML = h;
  $('#maint').innerHTML = 'Built by <b>' + esc(MAINT.owner) + '</b><br>' +
    'Free to use, copy and change.';
}

/* ---------------- views ---------------- */

function homeView(){
  const tiles = TILES.map(id => activeGuides().find(x => x.id === id)).filter(Boolean)
    .map((g, i) => {
    return '<button class="tile" data-openguide="' + g.id + '">' +
      '<span class="tn">' + String(i + 1).padStart(2, '0') + '</span>' +
      '<span class="ti">' + svg(TILE_ICON[g.id] || 'guide') + '</span>' +
      '<span class="tt">' + esc(g.title) + '</span>' +
      '<span class="tb">' + esc(g.sub) + '</span></button>';
  }).join('');

  return '<section class="hero">' +
      '<div class="hero-main">' +
        '<span class="eyebrow">' + esc(BRAND.name) + '</span>' +
        '<h1>What are you fixing?</h1>' +
        '<p>Start with a guide if you are working a ticket, or search if you already know the ' +
        'command you want. Everything runs in this page, on any machine, with or without ' +
        'an internet connection.</p>' +
        '<div class="hero-cta">' +
          '<button class="cta-go" data-view="guides">' + svg('guide') + 'Start with a guide</button>' +
          '<button class="cta-alt" data-focus="search">' + svg('list') +
            'Search everything <kbd>/</kbd></button>' +
        '</div>' +
      '</div>' +
      '<div class="hero-stats">' +
        '<div class="hs"><b>' + activeScripts().length + '</b><span>scripts</span></div>' +
        '<div class="hs"><b>' + activeGuides().length + '</b><span>guides</span></div>' +
        '<div class="hs"><b>' + RUNS.length + '</b><span>shortcuts</span></div>' +
        '<div class="hs"><b>' + UTILS.length + '</b><span>utilities</span></div>' +
      '</div>' +
    '</section>' +
    '<div class="sectlabel">Most common jobs</div>' +
    '<div class="tiles">' + tiles + '</div>' +
    '<div class="sectlabel">Everything else</div>' +
    '<div class="quick">' +
      '<button data-view="guides">' + svg('guide') + 'All ' + activeGuides().length + ' guides</button>' +
      '<button data-view="all">' + svg('list') + 'All ' + activeScripts().length + ' scripts</button>' +
      '<button data-view="utils">' + svg('wrench') + UTILS.length + ' utilities</button>' +
      '<button data-view="favs">' + svg('star') + 'Favourites</button>' +
      '<button data-view="runs">' + svg('run') + 'Run-box shortcuts</button>' +
      '<button data-view="notes">' + svg('note') + 'Ticket notes</button>' +
    '</div>' +
    '<div class="callout info keepit">' + svg('info') +
      '<div><b>Keep a copy.</b> Press <b>Ctrl+S</b>, or <b>Cmd+S</b> on a Mac, and save this page ' +
      'as an HTML file. That one file is the whole toolkit. Put it on a USB stick, or on the ' +
      'desktop of a machine you visit often, double-click it, and it works exactly as it does ' +
      'here with the network unplugged. Worth doing before you need it.</div></div>';
}

function notesView(){
  return headBlock('Ticket notes', 'Scratchpad for the job in hand. Saved in this browser only, so it is yours.') +
    '<div class="panel"><div class="notes-row">' +
      '<button class="ghostbtn" id="nStamp">Add timestamp</button>' +
      '<button class="ghostbtn" id="nInfo">Add machine and user</button>' +
      '<button class="ghostbtn" id="nCopy">Copy all</button>' +
      '<button class="ghostbtn" id="nClear">Clear</button></div>' +
    '<textarea id="notes" placeholder="What was reported, what you checked, what you changed, outcome..."></textarea></div>';
}

function wireNotes(){
  const ta = $('#notes');
  ta.value = store.get('notes', '');
  const ins = t => {
    const pos = ta.selectionStart;
    ta.value = ta.value.slice(0, pos) + t + ta.value.slice(pos);
    ta.focus(); ta.selectionStart = ta.selectionEnd = pos + t.length;
    store.set('notes', ta.value);
  };
  ta.addEventListener('input', () => store.set('notes', ta.value));
  $('#nStamp').onclick = () => ins((ta.value && !ta.value.endsWith('\n') ? '\n' : '') +
                                   '[' + new Date().toLocaleString('en-GB') + '] ');
  $('#nInfo').onclick  = () => ins('Machine: ' + vars.COMPUTER + '   User: ' + vars.USER + '\n');
  $('#nCopy').onclick  = e => copyText(ta.value, e.currentTarget);
  $('#nClear').onclick = () => { if (confirm('Clear all notes?')){ ta.value = ''; store.set('notes', ''); } };
}

function renderMain(){
  const m = $('#main');
  // Removing and re-adding the class restarts the entrance animation; reading
  // offsetWidth in between is what forces the browser to notice.
  m.classList.remove('swap');
  // Any window or document listener a utility registered belongs to the view
  // we are leaving, not the one we are about to draw.
  utilCleanup();

  if (query){
    const words = query.toLowerCase().split(/\s+/).filter(Boolean);
    const hit = txt => words.every(w => txt.toLowerCase().includes(w));
    const ss = SCRIPTS.filter(s => hit(s.title + ' ' + s.desc + ' ' + s.code + ' ' + s.cat));
    const gg = activeGuides().filter(g => hit(g.title + ' ' + g.sub + ' ' + g.steps.join(' ')));
    let h = headBlock('Results for "' + query + '"', gg.length + ' guides, ' + ss.length + ' scripts');
    if (!ss.length && !gg.length)
      h += '<div class="empty">Nothing found. Try a shorter word like "slack", "vpn", "mac", "ip" or "lock".</div>';
    if (gg.length) h += '<div class="sectlabel">Guides</div>' + gg.map(g => guideCard(g, gg.length <= 2)).join('');
    if (ss.length) h += '<div class="sectlabel">Scripts</div>' + ss.map(scriptCard).join('');
    m.innerHTML = h;
    return;
  }

  if (view === 'home'){
    m.innerHTML = homeView();
  } else if (view === 'guides'){
    m.innerHTML = headBlock('Fix-it guides',
      'Work down the steps. The green chips jump straight to the matching script.') +
      activeGuides().map(g => guideCard(g, false)).join('');
  } else if (view === 'favs'){
    const list = activeScripts().filter(s => favs.has(s.id));
    m.innerHTML = headBlock('Favourites', 'Star any script to pin it here. Saved in this browser only, ' +
      'so the list is yours alone - it does not follow you to another machine, and clearing your ' +
      'browsing data clears it.') +
      (list.length ? list.map(scriptCard).join('')
                   : '<div class="empty">Nothing starred yet. Star the ones you reach for most.</div>');
  } else if (view === 'all'){
    m.innerHTML = headBlock('All scripts', fillNote()) + legend() +
      activeCats().map(c => {
        const list = activeScripts().filter(s => s.cat === c.id);
        return list.length ? '<div class="sectlabel">' + esc(c.name) + '</div>' + list.map(scriptCard).join('') : '';
      }).join('');
  } else if (view === 'runs'){
    m.innerHTML = headBlock('Run-box shortcuts', 'Press Windows + R, type it, press Enter. Click a row to copy it.') +
      '<div class="tablewrap"><table class="runs"><thead><tr><th>Command</th><th>Opens</th></tr></thead><tbody>' +
      RUNS.map(r => '<tr data-copytext="' + esc(r[0]) + '"><td class="cmd">' + esc(r[0]) +
                    '</td><td>' + esc(r[1]) + '</td></tr>').join('') + '</tbody></table></div>';
  } else if (view === 'notes'){
    m.innerHTML = notesView(); wireNotes();
  } else if (view === 'utils'){
    m.innerHTML = utilsIndex();
  } else if (view.indexOf('util:') === 0){
    m.innerHTML = utilView(view.slice(5));
    mountUtil(view.slice(5));
  } else {
    const c = catOf(view) || CATS[0];
    m.innerHTML = headBlock(c.name, fillNote()) +
      activeScripts().filter(s => s.cat === c.id).map(scriptCard).join('');
  }
}

/* Which scripts is the user actually looking at? Used to decide which
   fill-in boxes are worth showing. */
function visibleScripts(){
  if (query){
    const words = query.toLowerCase().split(/\s+/).filter(Boolean);
    const hit = txt => words.every(w => txt.toLowerCase().includes(w));
    return activeScripts().filter(s => hit(s.title + ' ' + s.desc + ' ' + s.code + ' ' + s.cat));
  }
  if (view === 'all')  return activeScripts();
  if (view === 'favs') return activeScripts().filter(s => favs.has(s.id));
  if (catOf(view))     return activeScripts().filter(s => s.cat === view);
  return [];                       // front page, guides, utilities, notes, help
}

/* The bar was sitting on every screen, including the ones with no scripts on
   them at all, and showing seven boxes when the view in front of you might
   use one. Now it shows the boxes those scripts actually reference, and
   disappears entirely when nothing on screen takes a fill-in. */
function usedVars(){
  const wanted = new Set();
  visibleScripts().forEach(s => (s.code.match(/\{\{(\w+)\}\}/g) || [])
    .forEach(m => wanted.add(m.slice(2, -2))));
  return wanted;
}

/* Only mention the yellow highlighting when there is actually a box on screen
   producing it. On a view like Printing there is not. */
function fillNote(){
  return usedVars().size ? 'Yellow text comes from the fill-in boxes at the top.' : '';
}

function paintFills(){
  const wanted = usedVars();
  let shown = 0;
  document.querySelectorAll('[data-fill]').forEach(box => {
    const on = wanted.has(box.dataset.fill);
    box.hidden = !on;
    if (on) shown++;
  });
  document.querySelector('.fills').hidden = shown === 0;
}

function paintStack(){
  const now = stack.google && stack.microsoft ? 'both' : (stack.google ? 'google' : 'microsoft');
  document.querySelectorAll('[data-stackset]').forEach(btn => {
    const on = btn.dataset.stackset === now;
    btn.classList.toggle('on', on);
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
}

function render(){
  renderNav(); renderMain(); paintFills(); paintStack();
  const m = $('#main');
  void m.offsetWidth;          // forces the browser to notice the class went away
  m.classList.add('swap');     // ...so the entrance animation replays on every view
}

function gotoScript(id){
  const s = activeScripts().find(x => x.id === id); if (!s) return;
  query = ''; $('#q').value = ''; view = s.cat; store.set('view', view); render();
  const el = document.getElementById('s-' + id);
  if (el){
    el.scrollIntoView({behavior:'smooth', block:'center'});
    el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1800);
  }
}

function openGuide(id){
  query = ''; $('#q').value = ''; view = 'guides'; store.set('view', view); render();
  const el = document.getElementById('gd-' + id);
  if (el){ el.open = true; el.scrollIntoView({behavior:'smooth', block:'start'}); }
}

/* ---------------- events ---------------- */

document.addEventListener('click', e => {
  const t = e.target.closest('[data-view],[data-copy],[data-dl],[data-fav],[data-goto],[data-copytext],[data-openguide],[data-stackset],[data-focus]');
  if (!t) return;
  if (t.dataset.focus === 'search'){ $('#q').focus(); $('#q').select(); return; }
  if (t.dataset.stackset){
    const pick = t.dataset.stackset;
    stack = { google: pick !== 'microsoft', microsoft: pick !== 'google' };
    store.set('stack', stack);
    // If the section being viewed has just been hidden, fall back to the front page.
    if (catOf(view) && !activeCats().some(c => c.id === view)) view = 'home';
    render(); window.scrollTo(0, 0);
    return;
  }
  if (t.dataset.view){
    view = t.dataset.view; query = ''; $('#q').value = '';
    store.set('view', view); render(); window.scrollTo(0, 0);
  } else if (t.dataset.openguide){
    openGuide(t.dataset.openguide);
  } else if (t.dataset.copy){
    copyText(fill(SCRIPTS.find(s => s.id === t.dataset.copy).code), t);
  } else if (t.dataset.dl){
    const s = SCRIPTS.find(x => x.id === t.dataset.dl);
    const sh = isShell(s);
    const head = (sh ? '#!/usr/bin/env bash\n' : '') + '# ' + s.title + '\n';
    download(s.id + (sh ? '.sh' : '.ps1'), head + fill(s.code) + '\n', !sh);
  } else if (t.dataset.fav){
    const id = t.dataset.fav;
    favs.has(id) ? favs.delete(id) : favs.add(id);
    store.set('favs', [...favs]);
    const y = window.scrollY; render(); window.scrollTo(0, y);
  } else if (t.dataset.goto){
    e.preventDefault(); gotoScript(t.dataset.goto);
  } else if (t.dataset.copytext){
    copyText(t.dataset.copytext);
  }
});

$('#b-mark').textContent = BRAND.mark;
$('#b-name').textContent = BRAND.name;
$('#b-sub').textContent  = BRAND.sub;
document.title = BRAND.name;

$('#brand').onclick = () => { view = 'home'; query = ''; $('#q').value = ''; store.set('view', view); render(); window.scrollTo(0,0); };

document.querySelectorAll('.fills input').forEach(inp => {
  inp.value = vars[inp.dataset.var];
  inp.addEventListener('input', () => {
    vars[inp.dataset.var] = inp.value || DEFAULTS[inp.dataset.var];
    store.set('vars', vars);
    // Repaint the code blocks in place rather than re-rendering the page, so
    // the view does not jump while someone is typing a machine name.
    document.querySelectorAll('.card[id^="s-"]').forEach(card => {
      const s = SCRIPTS.find(x => 's-' + x.id === card.id);
      if (s) card.querySelector('pre').innerHTML = renderCode(s.code);
    });
  });
});

$('#q').addEventListener('input', e => { query = e.target.value.trim(); render(); });

/* ---------------- command palette ----------------
   The box in the top bar filters the view you are on. This is the other half:
   one keystroke from anywhere to any script, guide, tool or shortcut. The index
   is rebuilt on every open because the Google / Microsoft switch changes what
   exists, and scoring two hundred items per keystroke costs nothing. */
const PAL_ICON  = { guide:'guide', script:'list', util:'wrench', run:'run', view:'home' };
const PAL_ORDER = ['Go to', 'Fix-it guides', 'Scripts', 'Utilities', 'Run-box shortcuts'];
const IS_MAC    = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent || '');
let palOn = false, palSel = 0, palHits = [];

function palIndex(){
  const out = [];
  [['home','Front page'], ['guides','All fix-it guides'], ['all','All scripts'],
   ['favs','Favourites'], ['utils','Utilities'], ['runs','Run-box shortcuts'],
   ['notes','Ticket notes']].forEach(v =>
    out.push({ k:'view', kind:'Go to', id:v[0], t:v[1], s:'Section', blob:v[1].toLowerCase() }));
  activeGuides().forEach(g => out.push({ k:'guide', kind:'Fix-it guides', id:g.id,
    t:g.title, s:g.sub, blob:(g.title + ' ' + g.sub + ' ' + g.steps.join(' ')).toLowerCase() }));
  activeScripts().forEach(x => out.push({ k:'script', kind:'Scripts', id:x.id, code:x.code,
    t:x.title, s:(catOf(x.cat) || { name:x.cat }).name,
    blob:(x.title + ' ' + x.desc + ' ' + x.code + ' ' + x.cat).toLowerCase() }));
  UTILS.forEach(u => out.push({ k:'util', kind:'Utilities', id:u.id,
    t:u.name, s:u.blurb, blob:(u.name + ' ' + u.blurb + ' ' + u.desc).toLowerCase() }));
  RUNS.forEach(r => out.push({ k:'run', kind:'Run-box shortcuts', id:r[0],
    t:r[0], s:r[1], blob:(r[0] + ' ' + r[1]).toLowerCase() }));
  return out;
}

/* Every word has to match something. A word that hits the title scores far
   higher than one buried in the code, so typing "slack" lands on the Slack
   guide rather than the thirty scripts that mention it in passing. */
function palScore(it, words){
  const t = it.t.toLowerCase();
  let total = 0;
  for (const w of words){
    const at = t.indexOf(w);
    if (at === 0)       total += 130;
    else if (at > 0)    total += 85 - Math.min(at, 32);
    else if (it.blob.indexOf(w) >= 0) total += 30;
    else {
      // Subsequence, so "psx" still finds PsExec. It has to be tight, though:
      // without the span check "slack" matches "Software instaLl or updAte
      // request" and the results fill up with nonsense.
      let i = 0, first = -1, last = -1, ok = true;
      for (const ch of w){
        const c = t.indexOf(ch, i);
        if (c < 0){ ok = false; break; }
        if (first < 0) first = c;
        last = c; i = c + 1;
      }
      const span = ok ? last - first + 1 : 0;
      if (!ok || span > w.length * 2.5) return -1;
      total += 24 - Math.min(span - w.length, 14);
    }
  }
  if (it.k === 'guide') total += 14;              // a guide is usually the better landing place
  if (it.k === 'view')  total += 5;
  return total;
}

function palHi(text, words){
  const low = text.toLowerCase(), marks = [];
  words.forEach(w => { let from = 0, at;
    while (w && (at = low.indexOf(w, from)) >= 0){ marks.push([at, at + w.length]); from = at + w.length; } });
  if (!marks.length) return esc(text);
  marks.sort((a, b) => a[0] - b[0]);
  const merged = [];
  marks.forEach(m => {
    const last = merged[merged.length - 1];
    if (last && m[0] <= last[1]) last[1] = Math.max(last[1], m[1]); else merged.push([m[0], m[1]]);
  });
  let out = '', i = 0;
  merged.forEach(r => { out += esc(text.slice(i, r[0])) + '<mark>' + esc(text.slice(r[0], r[1])) + '</mark>'; i = r[1]; });
  return out + esc(text.slice(i));
}

function palRender(){
  const raw   = $('#palQ').value.trim().toLowerCase();
  const words = raw ? raw.split(/\s+/) : [];
  const idx   = palIndex();

  if (!words.length){
    // Nothing typed yet: offer the places worth going rather than an empty box.
    palHits = idx.filter(i => i.k === 'view')
      .concat(idx.filter(i => i.k === 'util'))
      .concat(idx.filter(i => i.k === 'guide').slice(0, 6));
  } else {
    palHits = idx.map(i => { i._s = palScore(i, words); return i; })
      .filter(i => i._s >= 0).sort((a, b) => b._s - a._s).slice(0, 40);
  }
  if (palSel >= palHits.length) palSel = Math.max(0, palHits.length - 1);

  const box = $('#palRes');
  if (!palHits.length){
    box.innerHTML = '<div class="pal-none">Nothing matches that. Try a shorter word - ' +
      '"slack", "vpn", "mac", "cert", "lock".</div>';
    return;
  }
  let html = '', seen = null, i = 0;
  PAL_ORDER.forEach(group => {
    palHits.forEach(it => {
      if (it.kind !== group) return;
      if (seen !== group){ html += '<div class="pal-grp">' + esc(group) + '</div>'; seen = group; }
      const me = palHits.indexOf(it);
      html += '<button class="pal-it' + (me === palSel ? ' sel' : '') + '" data-pal="' + me + '">' +
        '<span class="pi">' + svg(PAL_ICON[it.k]) + '</span>' +
        '<span class="pt"><span class="p1">' + palHi(it.t, words) + '</span>' +
        '<span class="p2">' + esc(it.s || '') + '</span></span>' +
        '<span class="pk">' + (it.k === 'script' ? 'open' : it.k === 'run' ? 'copy' : 'go') + '</span>' +
        '</button>';
      i++;
    });
  });
  box.innerHTML = html;
  const sel = box.querySelector('.pal-it.sel');
  if (sel) sel.scrollIntoView({ block:'nearest' });
}

function palMove(d){
  if (!palHits.length) return;
  palSel = (palSel + d + palHits.length) % palHits.length;
  palRender();
}

function palRun(i, copy){
  const it = palHits[i];
  if (!it) return;
  if (copy && it.k === 'script'){ copyText(fill(it.code)); palClose(); return; }
  if (copy && it.k === 'run'){ copyText(it.id); palClose(); return; }
  palClose();
  if (it.k === 'guide')       openGuide(it.id);
  else if (it.k === 'script') gotoScript(it.id);
  else if (it.k === 'run')    copyText(it.id);
  else if (it.k === 'util'){  view = 'util:' + it.id; store.set('view', view); render(); window.scrollTo(0, 0); }
  else { view = it.id; query = ''; $('#q').value = ''; store.set('view', view); render(); window.scrollTo(0, 0); }
}

function palOpen(){
  palOn = true; palSel = 0;
  $('#palwrap').classList.add('on');
  $('#palQ').value = '';
  palRender();
  $('#palQ').focus();
}
function palClose(){ palOn = false; $('#palwrap').classList.remove('on'); }

$('#palBtn').addEventListener('click', palOpen);
$('#palQ').addEventListener('input', () => { palSel = 0; palRender(); });
$('#palwrap').addEventListener('mousedown', e => { if (e.target === $('#palwrap')) palClose(); });
$('#palRes').addEventListener('click', e => {
  const b = e.target.closest('[data-pal]');
  if (b) palRun(Number(b.dataset.pal), e.metaKey || e.ctrlKey);
});
if (IS_MAC){ $('#palKey').textContent = '⌘ K'; $('#palCopyKey').innerHTML = '⌘ &crarr;'; }

document.addEventListener('keydown', e => {
  const tag = document.activeElement.tagName;

  // Cmd+K / Ctrl+K works from anywhere, including from inside a text box.
  if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')){
    e.preventDefault(); palOn ? palClose() : palOpen(); return;
  }
  if (palOn){
    if (e.key === 'ArrowDown'){ e.preventDefault(); palMove(1); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); palMove(-1); }
    else if (e.key === 'Enter'){ e.preventDefault(); palRun(palSel, e.metaKey || e.ctrlKey); }
    else if (e.key === 'Escape'){ e.preventDefault(); palClose(); }
    return;                                   // nothing else gets a look in
  }

  if (e.key === '/' && tag !== 'INPUT' && tag !== 'TEXTAREA'){ e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape' && document.activeElement === $('#q')){ $('#q').value = ''; query = ''; render(); }
});

const savedTheme = store.get('theme', null);
if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
$('#themeBtn').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme') ||
              (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  store.set('theme', next);
};

render();
</script>
