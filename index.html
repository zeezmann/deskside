/* ============================================================
   IT Tech Toolkit - visual layer
   No web fonts, no CDN, no images. Everything here is system
   type and CSS so the file works off a shared drive with the
   network down, which is exactly when you need it most.
   ============================================================ */
:root{
  color-scheme: light;
  /* The neutrals are very slightly cool so the indigo never looks like it is
     fighting the page. --on-accent is whatever text sits ON the accent: a token
     rather than a literal, because it has to flip between the two themes. */
  --bg:#fafafb; --surface:#ffffff; --surface2:#f3f3f7; --sunk:#edeef3;
  --ink:#131318; --ink2:#4a4a57; --muted:#686874;   /* 4.74:1 on the palest surface - AA on 11px text */
  --line:#e5e5ec; --line2:#f0f0f4; --border:rgba(19,19,24,.09);
  --accent:#1668d9; --accent2:#0f57bd; --accent-grad:#06a6d4; --accent-soft:#e3f0fe;
  --on-accent:#ffffff; --accent-glow:rgba(22,104,217,.34);
  --code-bg:#0e0e15; --code-ink:#dcdcea; --code-dim:#7b7b92;
  --tk-str:#9ad9b0; --tk-var:#8ec2f0; --tk-fill:#f5c842; --tk-fill-ink:#231c00;
  --star:#f0b429;
  --amber:#8a5600; --amber-soft:#fdf2d9; --amber-line:#f2dca8;
  --red:#b02418; --red-soft:#fee8e5; --red-line:#f7c7c1;
  --blue:#1a4fa8; --blue-soft:#e6edfd; --blue-line:#c5d7f7;
  --teal:#0f766e; --teal-soft:#dbf3f0; --teal-line:#a9ddd8;
  --plum:#6d28d9; --plum-soft:#f0eafe; --plum-line:#d6c8f8;
  --green:#12703f; --green-soft:#defaea; --green-line:#b1e6c9;
  --shadow:0 1px 2px rgba(19,19,24,.04), 0 8px 24px -14px rgba(19,19,24,.14);
  --shadow-lg:0 2px 6px rgba(19,19,24,.06), 0 26px 52px -22px rgba(19,19,24,.26);
  --shadow-xl:0 8px 20px rgba(19,19,24,.10), 0 40px 90px -30px rgba(19,19,24,.42);
  --r:14px; --r-sm:9px;
  /* aliases used by the ported utility markup */
  --text-primary:var(--ink); --text-secondary:var(--ink2);
  --ui:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI Variable Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --display:'Segoe UI Variable Display',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,'Cascadia Mono','Cascadia Code',Consolas,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0a0a0f; --surface:#131319; --surface2:#1b1b23; --sunk:#0f0f15;
    --ink:#f4f4f8; --ink2:#b3b3c1; --muted:#83838f;
    --line:#26262f; --line2:#1d1d25; --border:rgba(255,255,255,.09);
    --accent:#5aa9ff; --accent2:#8ac3ff; --accent-grad:#37e0ef; --accent-soft:#0c2340;
    --on-accent:#041428; --accent-glow:rgba(90,169,255,.42);
    --code-bg:#08080d; --code-ink:#dcdcea; --code-dim:#6d6d84;
    --tk-str:#8ad3a7; --tk-var:#7fc0e4; --tk-fill:#e8bf3f; --tk-fill-ink:#1a1400;
    --star:#f5c542;
    --amber:#f5be6a; --amber-soft:#332409; --amber-line:#5a4216;
    --red:#ff9086; --red-soft:#3b1613; --red-line:#66261f;
    --blue:#7fb4f5; --blue-soft:#101f38; --blue-line:#1e3a5c;
    --teal:#5ad6c8; --teal-soft:#0a2b28; --teal-line:#14504a;
    --plum:#bda4fb; --plum-soft:#1e1436; --plum-line:#3b2d5f;
    --green:#5fd99b; --green-soft:#0b2d1e; --green-line:#175033;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.7);
    --shadow-lg:0 2px 6px rgba(0,0,0,.55), 0 28px 56px -24px rgba(0,0,0,.85);
    --shadow-xl:0 10px 28px rgba(0,0,0,.6), 0 44px 96px -28px rgba(0,0,0,.92);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0a0a0f; --surface:#131319; --surface2:#1b1b23; --sunk:#0f0f15;
  --ink:#f4f4f8; --ink2:#b3b3c1; --muted:#83838f;
  --line:#26262f; --line2:#1d1d25; --border:rgba(255,255,255,.09);
  --accent:#5aa9ff; --accent2:#8ac3ff; --accent-grad:#37e0ef; --accent-soft:#0c2340;
  --on-accent:#041428; --accent-glow:rgba(90,169,255,.42);
  --code-bg:#08080d; --code-ink:#dcdcea; --code-dim:#6d6d84;
  --tk-str:#8ad3a7; --tk-var:#7fc0e4; --tk-fill:#e8bf3f; --tk-fill-ink:#1a1400;
  --star:#f5c542;
  --amber:#f5be6a; --amber-soft:#332409; --amber-line:#5a4216;
  --red:#ff9086; --red-soft:#3b1613; --red-line:#66261f;
  --blue:#7fb4f5; --blue-soft:#101f38; --blue-line:#1e3a5c;
  --teal:#5ad6c8; --teal-soft:#0a2b28; --teal-line:#14504a;
  --plum:#bda4fb; --plum-soft:#1e1436; --plum-line:#3b2d5f;
  --green:#5fd99b; --green-soft:#0b2d1e; --green-line:#175033;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.7);
  --shadow-lg:0 2px 6px rgba(0,0,0,.55), 0 28px 56px -24px rgba(0,0,0,.85);
  --shadow-xl:0 10px 28px rgba(0,0,0,.6), 0 44px 96px -28px rgba(0,0,0,.92);
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15.5px/1.62 var(--ui);
  background-image:radial-gradient(120% 70% at 50% -12%, color-mix(in srgb,var(--accent) 9%,transparent) 0%, transparent 58%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  font-optical-sizing:auto;text-rendering:optimizeLegibility;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
.mono,code,pre{font-family:var(--mono)}
::placeholder{color:var(--muted);opacity:1}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* Scrollbars, so the rail and the code blocks do not look like a 2009 web app.
   Firefox gets the standard property, everything else the WebKit one. */
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:20px;
  border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:content-box;
  border:3px solid transparent}

/* ---------- motion ----------
   Every view swap runs through .swap so the page never just blinks. Anyone who
   has asked their system to calm down gets none of it. */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.86)}55%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes sheet{from{opacity:0;transform:translateY(-10px) scale(.985)}to{opacity:1;transform:none}}
.swap > *{animation:rise .26s cubic-bezier(.22,.8,.3,1) backwards}
.swap > *:nth-child(1){animation-delay:0ms}
.swap > *:nth-child(2){animation-delay:22ms}
.swap > *:nth-child(3){animation-delay:44ms}
.swap > *:nth-child(4){animation-delay:60ms}
.swap > *:nth-child(n+5){animation-delay:72ms}
.tiles .tile{animation:rise .3s cubic-bezier(.22,.8,.3,1) backwards}
.tiles .tile:nth-child(1){animation-delay:40ms}
.tiles .tile:nth-child(2){animation-delay:70ms}
.tiles .tile:nth-child(3){animation-delay:100ms}
.tiles .tile:nth-child(4){animation-delay:130ms}
.tiles .tile:nth-child(5){animation-delay:160ms}
.tiles .tile:nth-child(6){animation-delay:190ms}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important;scroll-behavior:auto !important}
}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:262px minmax(0,1fr);min-height:100vh}

.rail{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);
  border-right:1px solid var(--line);padding:18px 14px 22px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 18px;background:none;border:0;
  cursor:pointer;text-align:left;width:100%}
.brand:hover .bname{color:var(--accent)}
.logo{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(142deg,var(--accent) 0%,var(--accent-grad) 118%);color:var(--on-accent);
  font:700 13px/1 var(--mono);letter-spacing:-.04em;box-shadow:0 2px 12px -3px var(--accent-glow)}
.brand > span:last-child{min-width:0}
.bname{display:block;font-family:var(--display);font-weight:700;font-size:15.5px;
  letter-spacing:-.02em;line-height:1.2}
.bsub{display:block;font-size:11.5px;color:var(--muted);letter-spacing:.01em;
  line-height:1.35;margin-top:2px}

.navh{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin:18px 10px 7px}
.navh:first-of-type{margin-top:4px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;
  background:none;padding:7px 10px;border-radius:var(--r-sm);cursor:pointer;color:var(--ink2);
  font-size:14.5px;position:relative;transition:background .12s,color .12s}
.nav button .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button.on::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;
  border-radius:0 3px 3px 0;background:var(--accent)}
.nav .ct{font-size:11px;color:var(--ink2);background:var(--surface2);border-radius:20px;
  padding:1px 7px;min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
.nav button.on .ct{background:var(--surface);color:var(--accent)}
.nav .ic{width:16px;height:16px;flex:none;opacity:.62}
.nav button:hover .ic,.nav button.on .ic{opacity:1}

.maint{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line2);
  font-size:11.5px;line-height:1.65;color:var(--muted)}
.maint b{color:var(--ink2);font-weight:600}

/* ---------- top bar ---------- */
.topwrap{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.toprow{display:flex;align-items:center;gap:10px;padding:13px 26px 11px;flex-wrap:wrap}
.search{flex:1;position:relative;max-width:640px}
.search input{width:100%;padding:10px 82px 10px 38px;border:1px solid var(--border);
  border-radius:11px;background:var(--surface);outline:none;font-size:14.5px;
  box-shadow:0 1px 2px rgba(11,22,20,.04)}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search .mag{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5;pointer-events:none}
.search .hint{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;
  color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px;
  background:var(--surface2);pointer-events:none}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--border);
  border-radius:11px;padding:3px;gap:2px;flex:none}
.seg button{border:0;background:none;border-radius:8px;padding:6px 13px;cursor:pointer;
  font-size:13px;color:var(--muted);white-space:nowrap;transition:background .13s,color .13s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--surface);color:var(--accent);font-weight:600;
  box-shadow:0 1px 2px rgba(11,22,20,.10)}
:root[data-theme="dark"] .seg button.on,
:root:not([data-theme="light"]) .seg button.on{box-shadow:0 1px 3px rgba(0,0,0,.5)}

.ghostbtn{border:1px solid var(--border);background:var(--surface);border-radius:10px;
  padding:8px 13px;cursor:pointer;font-size:13.5px;color:var(--ink2);display:inline-flex;
  align-items:center;gap:7px;white-space:nowrap}
.ghostbtn:hover{border-color:var(--accent);color:var(--accent)}
.ghostbtn:active,.quick button:active,.tile:active,.utabs button:active{transform:translateY(1px)}

.fills{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 26px 12px}
.fills .tag{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin-right:2px}
.fill{display:flex;align-items:center;background:var(--surface);border:1px solid var(--border);
  border-radius:9px;overflow:hidden}
.fill:focus-within{border-color:var(--tk-fill);box-shadow:0 0 0 2px color-mix(in srgb,var(--tk-fill) 30%,transparent)}
.fill label{font-size:11.5px;color:var(--muted);padding:0 2px 0 10px;white-space:nowrap}
.fill input{width:132px;border:0;background:none;outline:none;padding:6px 10px 6px 6px;
  font-family:var(--mono);font-size:12.5px}
.fill.w input{width:230px}

/* ---------- main ---------- */
main{padding:26px 26px 90px;min-width:0;max-width:1080px}
.vh{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:-9999px;top:0;z-index:200;background:var(--accent);color:var(--on-accent);
  padding:12px 18px;border-radius:0 0 10px 0;font-weight:600;text-decoration:none}
.skip:focus{left:0}
.head{margin:0 0 20px}
.head h1{font-family:var(--display);font-size:27px;line-height:1.2;letter-spacing:-.028em;
  margin:0 0 5px;font-weight:700}
.head p{margin:0;color:var(--ink2);font-size:15px;max-width:66ch}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--accent)}
.sectlabel{display:flex;align-items:center;gap:10px;margin:36px 0 16px;
  font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.sectlabel::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.sectlabel::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- home ---------- */
.hero{position:relative;overflow:hidden;background:
   radial-gradient(105% 150% at 0% 0%, var(--accent-soft) 0%, transparent 62%),
   radial-gradient(80% 125% at 100% 108%, color-mix(in srgb,var(--accent-grad) 22%,transparent) 0%, transparent 58%),
   radial-gradient(60% 100% at 88% 0%, color-mix(in srgb,var(--accent) 10%,transparent) 0%, transparent 60%),
   var(--surface);
  border:1px solid var(--border);border-radius:18px;padding:34px 32px;margin-bottom:30px;
  box-shadow:var(--shadow);
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:36px;align-items:center}
.hero::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;
  background:linear-gradient(90deg,var(--accent) 0%,var(--accent-grad) 55%,
    color-mix(in srgb,var(--accent-grad) 15%,transparent) 100%)}
.hero-main{min-width:0}
.hero h1{font-family:var(--display);font-size:40px;letter-spacing:-.035em;margin:9px 0 11px;
  font-weight:700;line-height:1.06}
.hero p{margin:0;color:var(--ink2);max-width:50ch;font-size:16px;line-height:1.6}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.hero-cta button{display:inline-flex;align-items:center;gap:8px;border-radius:11px;
  padding:10px 17px;cursor:pointer;font-size:14.5px;font-weight:600;
  transition:transform .12s ease,box-shadow .13s,border-color .13s,color .13s}
.hero-cta button svg{width:16px;height:16px;flex:none}
.hero-cta .cta-go{border:0;background:linear-gradient(118deg,var(--accent) 0%,var(--accent-grad) 155%);
  color:var(--on-accent);box-shadow:0 2px 10px -3px color-mix(in srgb,var(--accent) 70%,transparent)}
.hero-cta .cta-go:hover{transform:translateY(-1px);
  box-shadow:0 5px 16px -4px color-mix(in srgb,var(--accent) 75%,transparent)}
.hero-cta .cta-alt{border:1px solid var(--border);background:var(--surface);color:var(--ink2);font-weight:500}
.hero-cta .cta-alt:hover{border-color:var(--accent);color:var(--accent)}
.hero-cta kbd{font:600 11px/1 var(--mono);border:1px solid var(--line);background:var(--surface2);
  border-radius:5px;padding:2px 5px;color:var(--muted)}
.hero-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;flex:none;width:262px}
.hs{background:color-mix(in srgb,var(--surface) 72%,transparent);border:1px solid var(--line2);
  border-radius:13px;padding:13px 15px}
.hs b{display:block;font-family:var(--display);font-size:25px;font-weight:700;letter-spacing:-.035em;
  color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.05}
.hs span{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;letter-spacing:.015em}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:14px}
.tile{position:relative;text-align:left;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:17px 17px 16px;cursor:pointer;overflow:hidden;
  transition:transform .13s ease,border-color .13s,box-shadow .13s}
.tile:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:var(--shadow-lg)}
.tile .ti{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent);margin-bottom:13px;
  transition:background .14s ease,color .14s ease,transform .14s ease}
.tile:hover .ti{background:linear-gradient(142deg,var(--accent) 0%,var(--accent-grad) 125%);color:var(--on-accent);
  transform:scale(1.04)}
.tile .tt{display:block;font-family:var(--display);font-weight:650;font-size:16.5px;
  letter-spacing:-.02em;line-height:1.28}
.tile .tb{display:block;color:var(--muted);font-size:13px;margin-top:4px;line-height:1.45}
.tile .tn{position:absolute;top:14px;right:16px;font:700 12px/1 var(--mono);
  color:color-mix(in srgb,var(--muted) 55%,transparent);letter-spacing:-.04em}
.tile:hover .tn{color:var(--accent)}

.quick{display:flex;gap:9px;flex-wrap:wrap}
.quick button{display:inline-flex;align-items:center;gap:8px;background:var(--surface);
  border:1px solid var(--border);border-radius:11px;padding:9px 14px;cursor:pointer;font-size:14px;color:var(--ink2)}
.quick button:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- badges ---------- */
.badges{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:2.5px 8px;border-radius:20px;white-space:nowrap;border:1px solid transparent;
  display:inline-flex;align-items:center;gap:5px}
.badge::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.b-admin{background:var(--amber-soft);color:var(--amber);border-color:var(--amber-line)}
.b-changes{background:var(--blue-soft);color:var(--blue);border-color:var(--blue-line)}
.b-risk{background:var(--red-soft);color:var(--red);border-color:var(--red-line);font-weight:800}
.b-remote{background:var(--teal-soft);color:var(--teal);border-color:var(--teal-line)}
.b-net{background:var(--green-soft);color:var(--green);border-color:var(--green-line)}
.b-mac{background:var(--teal-soft);color:var(--teal);border-color:var(--teal-line)}
.b-linux{background:var(--plum-soft);color:var(--plum);border-color:var(--plum-line)}
.b-mod{background:var(--surface2);color:var(--ink2);border-color:var(--teal)}
.legend{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:12px}

/* ---------- script card ---------- */
.card{position:relative;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);margin-bottom:15px;overflow:hidden;box-shadow:var(--shadow);
  scroll-margin-top:150px;transition:box-shadow .15s ease}
.card::before,.guide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:transparent;transition:background .15s ease;z-index:2}
.card:hover::before,.guide:hover::before,.guide[open]::before{background:var(--accent)}
.card:hover{box-shadow:var(--shadow-lg)}
.card-top{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;padding:15px 18px 0}
.card-top h3{font-family:var(--display);font-size:17.5px;font-weight:650;letter-spacing:-.02em;
  margin:4px 0 0;line-height:1.28}
.desc{padding:10px 18px 15px;color:var(--ink2);font-size:15px;line-height:1.65;margin:0;max-width:74ch}
.desc b,.desc strong{color:var(--ink);font-weight:650}
.desc i{color:var(--ink2)}

.codebox{background:var(--code-bg);border-top:1px solid var(--border)}
.codebar{display:flex;align-items:center;gap:8px;padding:8px 12px 8px 16px;
  border-bottom:1px solid rgba(255,255,255,.07)}
.shell{font:600 10.5px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--code-dim)}
.codebar .sp{flex:1}
.cbtn{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:var(--code-ink);
  border-radius:7px;padding:4px 11px;font-size:12.5px;cursor:pointer;display:inline-flex;
  align-items:center;gap:6px;transition:background .12s,border-color .12s}
.cbtn:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.26);color:#fff}
.cbtn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.cbtn.pri:hover{background:var(--accent2);color:var(--on-accent)}
.cbtn.ok{background:var(--green);border-color:var(--green);color:var(--on-accent);
  animation:pop .3s cubic-bezier(.22,.8,.3,1)}
.star.on{animation:pop .32s cubic-bezier(.22,.8,.3,1)}
.star{border:0;background:none;cursor:pointer;font-size:16px;line-height:1;color:var(--code-dim);padding:3px 4px}
.star:hover{color:var(--star)}
.star.on{color:var(--star)}
pre{margin:0;padding:15px 18px;color:var(--code-ink);font-size:12.9px;line-height:1.62;
  overflow:auto;white-space:pre;tab-size:2}
pre .tk-c{color:var(--code-dim);font-style:italic}
pre .tk-s{color:var(--tk-str)}
pre .tk-d{color:var(--tk-var)}
pre .tk-v{background:var(--tk-fill);color:var(--tk-fill-ink);border-radius:4px;padding:0 4px;font-weight:600}

/* ---------- guides ---------- */
.guide{position:relative;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);margin-bottom:11px;overflow:hidden;box-shadow:var(--shadow);
  scroll-margin-top:150px}
.guide summary{list-style:none;cursor:pointer;padding:15px 18px;display:flex;
  justify-content:space-between;gap:14px;align-items:center}
.guide summary::-webkit-details-marker{display:none}
.guide summary:hover .gt{color:var(--accent)}
.gt{font-family:var(--display);font-weight:650;font-size:16px;letter-spacing:-.018em;line-height:1.3}
.gs{color:var(--muted);font-size:13.5px;margin-top:2px}
.chev{flex:none;color:var(--muted);transition:transform .16s ease}
.guide[open] .chev{transform:rotate(90deg);color:var(--accent)}
.guide[open] summary{border-bottom:1px solid var(--line2);background:var(--surface2)}
.steps{list-style:none;counter-reset:st;margin:0;padding:18px 20px 20px 20px;position:relative}
.steps li{position:relative;padding-left:40px;padding-bottom:18px;counter-increment:st;
  color:var(--ink2);line-height:1.68}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:counter(st);position:absolute;left:0;top:-2px;width:26px;height:26px;
  border-radius:50%;display:grid;place-items:center;font:700 12px/1 var(--mono);
  background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);z-index:1;
  box-shadow:0 1px 4px -1px var(--accent-glow)}
.steps li::after{content:"";position:absolute;left:12px;top:26px;bottom:-1px;width:1px;background:var(--line)}
.steps li:last-child::after{display:none}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);
  color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:2px 9px;
  font-size:12.5px;cursor:pointer;margin:3px 3px 0 0;font-weight:600;white-space:nowrap}
.chip::before{content:"";width:12px;height:12px;flex:none;border-radius:3px;
  background:currentColor;opacity:.25}
.chip:hover{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

/* ---------- tables, notes, help ---------- */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r);max-width:100%}
table.runs{width:100%;min-width:340px;border-collapse:separate;border-spacing:0;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.runs th,.runs td{text-align:left;padding:10px 16px;border-bottom:1px solid var(--line2)}
.runs tr:last-child td{border-bottom:0}
.runs th{background:var(--surface2);font-size:10.5px;text-transform:uppercase;
  letter-spacing:.09em;color:var(--muted);font-weight:700}
.runs td.cmd{font-family:var(--mono);white-space:nowrap;color:var(--accent);font-size:13px}
.runs tbody tr{cursor:pointer}
.runs tbody tr:hover td{background:var(--accent-soft)}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:20px 22px;box-shadow:var(--shadow)}
.callout{display:flex;gap:13px;align-items:flex-start;background:var(--amber-soft);
  border:1px solid var(--amber-line);border-radius:var(--r);padding:14px 17px;margin-bottom:20px;
  color:var(--ink2);font-size:14.5px;line-height:1.6}
.callout svg{width:18px;height:18px;flex:none;color:var(--amber);margin-top:3px}
.callout b{color:var(--ink);font-weight:650}
.callout.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 32%,transparent)}
.callout.info svg{color:var(--accent)}
.keepit{margin:30px 0 0}
.panel p{margin:0 0 13px;color:var(--ink2);max-width:80ch}
.panel p:last-child{margin-bottom:0}
.panel b{color:var(--ink);font-weight:650}
.notes-row{display:flex;gap:8px;margin-bottom:11px;flex-wrap:wrap}
textarea#notes{width:100%;min-height:400px;border:1px solid var(--border);border-radius:11px;
  padding:14px 16px;background:var(--sunk);font-family:var(--mono);font-size:13px;resize:vertical;outline:none}
textarea#notes:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.empty{padding:48px 20px;text-align:center;color:var(--muted);background:var(--surface);
  border:1px dashed var(--line);border-radius:var(--r)}

.flash{animation:flash 1.7s ease}
@keyframes flash{0%,35%{box-shadow:0 0 0 3px var(--tk-fill),var(--shadow)}100%{box-shadow:0 0 0 0 transparent,var(--shadow)}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(14px);
  background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:10px;opacity:0;
  transition:.18s;pointer-events:none;z-index:99;font-size:14px;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:row;align-items:center;gap:6px;
    overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px 14px}
  .brand{width:auto;padding:5px 10px 5px 0;flex:none}
  .bsub{display:none}
  .navh,.maint{display:none}
  .nav{display:flex;gap:6px}
  .nav button{width:auto;white-space:nowrap;padding:7px 12px}
  .nav button.on::before{display:none}
  main{padding:18px 15px 70px}
  .toprow,.fills{padding-left:15px;padding-right:15px}
  .search{flex:1 1 100%;order:-1}
  .seg button{padding:6px 10px;font-size:12.5px}
  .fill input{width:104px}.fill.w input{width:150px}
  .hero{padding:22px 20px;grid-template-columns:minmax(0,1fr);gap:24px;border-radius:15px}
  .hero h1{font-size:28px}
  .hero p{font-size:15px}
  .hero-stats{width:auto}
  .hs b{font-size:21px}
  .hero-cta button{flex:1 1 auto;justify-content:center}

  /* Code is most of the reason to open this on a phone, so it gets a little
     more size, and momentum scrolling so a long line does not feel stuck. */
  pre{font-size:13px;padding:14px 15px;-webkit-overflow-scrolling:touch}
  .card-top{padding:14px 15px 0}
  .desc{padding:10px 15px 14px;font-size:14.5px}
  .guide summary{padding:14px 15px}
  .steps{padding:16px 15px 18px}
  .steps li{padding-left:36px}
  .panel{padding:16px 15px}
  .callout{padding:13px 14px;gap:11px}
  .sectlabel{margin:28px 0 14px}
  .chip{max-width:100%;overflow:hidden;text-overflow:ellipsis}

  /* The rail is a horizontal scroller at this width. Snapping stops it
     settling half way through a label. */
  .rail{scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
  .nav button{scroll-snap-align:start}
}


/* ---------- command palette ----------
   The inline search box filters the page you are on. This is the other thing:
   one keystroke from anywhere to any script, guide, tool or shortcut. */
.palwrap{position:fixed;inset:0;z-index:100;display:none;padding:11vh 20px 20px;
  background:color-mix(in srgb,var(--bg) 52%,rgba(0,0,0,.5));backdrop-filter:blur(7px);
  animation:fade .13s ease}
.palwrap.on{display:block}
.pal{max-width:660px;margin:0 auto;background:var(--surface);border:1px solid var(--border);
  border-radius:16px;box-shadow:var(--shadow-xl);overflow:hidden;
  animation:sheet .19s cubic-bezier(.22,.8,.3,1)}
.pal-in{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line)}
.pal-in > svg{width:18px;height:18px;flex:none;color:var(--muted)}
.pal-in input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16.5px;letter-spacing:-.012em}
.pal-esc{font:600 10.5px/1 var(--mono);border:1px solid var(--line);background:var(--surface2);
  border-radius:5px;padding:4px 7px;color:var(--muted);flex:none}
.pal-res{max-height:50vh;overflow:auto;padding:7px;overscroll-behavior:contain}
.pal-grp{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);padding:12px 11px 6px}
.pal-grp:first-child{padding-top:5px}
.pal-it{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;
  background:none;padding:9px 11px;border-radius:10px;cursor:pointer;color:var(--ink);
  scroll-margin:8px}
.pal-it .pi{width:29px;height:29px;flex:none;border-radius:8px;display:grid;place-items:center;
  background:var(--surface2);color:var(--muted)}
.pal-it .pi svg{width:15px;height:15px}
.pal-it .pt{flex:1;min-width:0}
.pal-it .p1,.pal-it .p2{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-it .p1{font-size:14.5px;line-height:1.35}
.pal-it .p2{font-size:12px;color:var(--muted);margin-top:1px}
.pal-it mark{background:none;color:var(--accent);font-weight:700;padding:0}
.pal-it .pk{font:600 10.5px/1 var(--mono);color:var(--accent);flex:none;opacity:0}
.pal-it.sel{background:var(--accent-soft)}
.pal-it.sel .pi{background:var(--accent);color:var(--on-accent)}
.pal-it.sel .p1{color:var(--accent);font-weight:600}
.pal-it.sel mark{color:var(--accent);text-decoration:underline;text-underline-offset:3px;
  text-decoration-thickness:2px}
.pal-it.sel .pk{opacity:1}
.pal-foot{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:10px 18px;
  border-top:1px solid var(--line);background:var(--surface2);font-size:11.5px;color:var(--muted)}
.pal-foot kbd{font:600 10.5px/1 var(--mono);border:1px solid var(--line);background:var(--surface);
  border-radius:4px;padding:3px 5px;margin-right:5px;color:var(--ink2)}
.pal-none{padding:30px 18px;text-align:center;color:var(--muted);font-size:14px}
#palBtn kbd{font:600 10px/1 var(--mono);border:1px solid var(--line);background:var(--surface2);
  border-radius:4px;padding:3px 5px;color:var(--muted)}
@media (max-width:900px){
  .palwrap{padding:7vh 12px 12px}
  .pal-res{max-height:58vh}
  .pal-foot{display:none}
  #palBtn .lbl{display:none}
}

.utabs{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 18px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.utabs button{display:inline-flex;align-items:center;gap:7px;background:var(--surface);
  border:1px solid var(--border);border-radius:10px;padding:7px 13px;cursor:pointer;
  font-size:13.5px;color:var(--ink2)}
.utabs button:hover{border-color:var(--accent);color:var(--accent)}
.utabs button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.utabs svg{width:15px;height:15px;flex:none}

/* ---------- utilities (the five in-page tools) ----------
   Scoped under .util because the ported tools use generic class names such as
   .card and .badge that already mean something else here. */
.util .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow)}
.util .card h3{font-family:var(--display);font-size:14.5px;margin:0 0 13px;font-weight:650;letter-spacing:-.01em}
.util label.f{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:500}
.util input[type=text],.util input[type=number],.util input[type=password],
.util select,.util textarea{width:100%;padding:9px 12px;border:1px solid var(--border);
  border-radius:9px;background:var(--sunk);color:var(--ink);outline:none;font-size:14px}
.util input:focus,.util select:focus,.util textarea:focus{border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft)}
.util textarea{font-family:var(--mono);font-size:13px;min-height:110px;resize:vertical}
.util .row2{display:flex;gap:14px;flex-wrap:wrap}
.util .row2 > *{flex:1;min-width:180px}
.util .inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.util button{font:inherit;padding:8px 14px;border:1px solid var(--border);background:var(--surface);
  color:var(--ink2);border-radius:9px;cursor:pointer;font-size:14px}
.util button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.util button:disabled{opacity:.45;cursor:default}
.util button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
:root[data-theme="dark"] .util button.primary,
:root:not([data-theme="light"]) .util button.primary{color:var(--on-accent)}
.util button.primary:hover:not(:disabled){background:var(--accent2);border-color:var(--accent2)}
.util .mini{padding:4px 10px;font-size:12.5px;border-radius:7px}
.util table{border-collapse:collapse;width:100%;font-size:13.5px}
.util th,.util td{text-align:left;padding:7px 11px;border-bottom:1px solid var(--line2)}
.util th{color:var(--muted);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em}
.util td.k{color:var(--muted);width:200px}
.util td.v{font-family:var(--mono);font-size:13px}
.util td.num,.util th.num{text-align:right;font-variant-numeric:tabular-nums}
.util .scroll{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.util .out{font-family:var(--mono);font-size:15px;word-break:break-all;background:var(--sunk);
  border:1px solid var(--line);border-radius:9px;padding:12px 14px;line-height:1.55}
.util .err{color:var(--red);font-size:13.5px;margin-top:9px}
.util .ok{color:var(--green);font-size:13.5px;margin-top:9px}
.util .hint{color:var(--ink2);font-size:13.5px;margin:0 0 13px}
.util .muted{color:var(--muted);font-size:12.5px}
.util .drop{border:2px dashed var(--line);border-radius:12px;padding:30px;text-align:center;
  cursor:pointer;color:var(--muted);background:var(--sunk)}
.util .drop:hover,.util .drop.over{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.util .chk{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink2)}
.util .chk input{width:auto;accent-color:var(--accent)}
/* the ported badges carry their own dot element, so switch off the pseudo one */
.util .badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;
  padding:2px 9px;border-radius:20px;background:var(--surface2);color:var(--ink2);
  border:1px solid var(--line);text-transform:none;letter-spacing:0}
.util .badge::before{display:none}
.util .badge .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.util .b-critical .dot{background:var(--red)}
.util .b-warning  .dot{background:var(--amber)}
.util .b-good     .dot{background:var(--green)}
.util .b-serious  .dot{background:var(--teal)}
.util #stage{position:relative;height:calc(100vh - 330px);min-height:360px;overflow:hidden;
  background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);cursor:grab;
  touch-action:none}
.util #stage.drag{cursor:grabbing}
.util #inner{transform-origin:0 0}
.util #inner svg{display:block}
.util #v-drop{pointer-events:none}
.util table.difftab td.dl{font-family:var(--mono);font-size:12.6px;white-space:pre-wrap;
  word-break:break-word;line-height:1.55}
.util table.difftab td.num{width:52px;color:var(--muted);font-size:11.5px;
  font-variant-numeric:tabular-nums;vertical-align:top;padding-top:7px}
.util table.difftab tr.add td{background:var(--green-soft)}
.util table.difftab tr.add td.dl{color:var(--green);font-weight:600}
.util table.difftab tr.del td{background:var(--red-soft)}
.util table.difftab tr.del td.dl{color:var(--red);font-weight:600}
.util table.difftab tr.gap td{text-align:center;color:var(--muted);background:var(--surface2);
  font-family:var(--mono);font-size:11px;letter-spacing:.2em}
.util .hl{fill:none;stroke:#ff3b8d;stroke-width:3;vector-effect:non-scaling-stroke}
.util .hl.cur{stroke-width:5}
/* Touch devices at any width, including an iPad in landscape running the full
   desktop layout. The Copy button is the entire point of the page and at 26px
   tall it was under every accessibility guideline going. */
@media (pointer:coarse){
  .cbtn{padding:10px 14px;font-size:13.5px}
  .star{padding:10px 11px;font-size:19px}
  .nav button{padding:12px 13px}
  .quick button{padding:12px 16px}
  .utabs button{padding:12px 15px}
  .seg button{padding:10px 14px}
  .ghostbtn{padding:11px 14px}
  .chip{padding:7px 11px;font-size:13px}
  .runs th,.runs td{padding:14px 16px}
  .tile{padding:19px 18px 18px}
  .util button{padding:12px 15px}
  .util .mini{padding:10px 14px;font-size:13px}
  .mini{padding:10px 14px}
  .util input[type=text],.util select{padding:11px 12px}
  .pal-it{padding:12px 11px}
  .search input{padding-top:12px;padding-bottom:12px}
}
</style>

<div class="app">
  <aside class="rail">

      <span>
        <span class="bname" id="b-name"></span>
        <span class="bsub" id="b-sub"></span>
      </span>
    </button>
    <div class="nav" id="nav"></div>
    <div class="maint" id="maint"></div>
  </aside>

  <div>
    <div class="topwrap">
      <div class="toprow">
        <div class="search">
          <svg class="mag" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input id="q" type="search" autocomplete="off" spellcheck="false"
                 aria-label="Search scripts and guides"
                 placeholder="Search scripts and guides - slack, vpn, winget, mac, locked, slow">

<script>
/* ============================================================
   IT TECH TOOLKIT
   Everything lives in this one file. To add a script, copy one
   of the S(...) lines below and change the text.
   Fill-ins: {{COMPUTER}} {{IP}} {{USER}} {{PROCESS}} {{APP}} {{FILE}}
   Badges: admin, changes, remote, rsat, net, cmd
   ============================================================ */

const DEFAULTS = {
  COMPUTER:'PC-NAME', IP:'203.0.113.10', USER:'jsmith', PROCESS:'wermgr',
  APP:'Chrome', FILE:'C:\\Users\\Public\\Downloads\\file.exe', SERVICE:'nginx'
};

const CATS = [
  {id:'info',     name:'System info'},
  {id:'software', name:'Software installs & updates'},
  {id:'mac',      name:'macOS'},
  {id:'linux',    name:'Linux'},
  {id:'network',  name:'Network & VPN'},
  {id:'cloud',    name:'Chat, calls & sync'},
  {id:'ms365',    name:'Microsoft 365', stack:'microsoft'},
  {id:'security', name:'Security & triage'},
  {id:'perf',     name:'Performance & disk'},
  {id:'accounts', name:'Accounts & AD'},
  {id:'remote',   name:'Remote admin'},
  {id:'hardware', name:'Hardware & drivers'},
  {id:'updates',  name:'Windows Update'},
  {id:'print',    name:'Printing'}
];

const SCRIPTS = [];
/* Scripts that only make sense on one stack. Everything not listed here is
   universal and shows whatever the toolkit is set to. */
const STACK_OF = {
  'chrome-profiles':'google', 'gdrive-restart':'google', 'gdrive-reset':'google', 'gdrive-space':'google'
};
function S(id, cat, title, badges, desc, code){
  SCRIPTS.push({ id, cat, title, badges, desc,
                 stack: STACK_OF[id] || (cat === 'ms365' ? 'microsoft' : null),
                 code: code.replace(/^\n/, '').replace(/\s+$/, '') });
}

/* ---------------- SYSTEM INFO ---------------- */
S('sys-snapshot','info','Full system snapshot',[],
'One-shot overview: user, model, serial, OS build, CPU, RAM and uptime. Great first thing to run on any machine.',
String.raw`
$os   = Get-CimInstance Win32_OperatingSystem
$cs   = Get-CimInstance Win32_ComputerSystem
$bios = Get-CimInstance Win32_BIOS
$cpu  = Get-CimInstance Win32_Processor | Select-Object -First 1
[PSCustomObject]@{
  ComputerName = $env:COMPUTERNAME
  LoggedOnUser = $cs.UserName
  Domain       = $cs.Domain
  Manufacturer = $cs.Manufacturer
  Model        = $cs.Model
  SerialNumber = $bios.SerialNumber
  OS           = $os.Caption
  Build        = $os.BuildNumber
  CPU          = $cpu.Name
  RAM_GB       = [math]::Round($cs.TotalPhysicalMemory / 1GB, 1)
  LastBoot     = $os.LastBootUpTime
  UptimeDays   = [math]::Round(((Get-Date) - $os.LastBootUpTime).TotalDays, 1)
} | Format-List`);

S('os-version','info','Windows version and build',[],
'Shows the edition, feature version (e.g. 23H2 / 24H2) and exact build. ProductName can still say "Windows 10" on Windows 11 machines; a build of 22000 or higher means Windows 11.',
String.raw`
Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion' |
  Select-Object ProductName, EditionID, DisplayVersion, CurrentBuild, UBR |
  Format-List`);

S('logged-on','info','Who is logged on',[],
'Shows every session on the machine, including disconnected RDP sessions that may be holding files or licences open.',
String.raw`
quser`);

S('installed-apps','info','List all installed software',[],
'Pulls from all three uninstall registry locations (64-bit, 32-bit and per-user), so it catches things Programs and Features sometimes misses.',
String.raw`
$paths = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
         'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
         'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*'
Get-ItemProperty $paths -ErrorAction SilentlyContinue |
  Where-Object DisplayName |
  Select-Object DisplayName, DisplayVersion, Publisher, InstallDate |
  Sort-Object DisplayName |
  Format-Table -AutoSize`);

S('find-app','info','Is a specific app installed? (uses App)',[],
'Searches installed software for the name in the <b>App</b> fill-in box and shows version and uninstall string.',
String.raw`
$name  = '{{APP}}'
$paths = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
         'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
         'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*'
Get-ItemProperty $paths -ErrorAction SilentlyContinue |
  Where-Object { $_.DisplayName -like "*$name*" } |
  Select-Object DisplayName, DisplayVersion, Publisher, InstallDate, UninstallString |
  Format-List`);

S('reboot-history','info','Recent shutdowns, restarts and crashes',[],
'Event 1074 = someone or something restarted it (shows who/what). 6008 = unexpected shutdown. 41 = lost power or hard crash.',
String.raw`
Get-WinEvent -FilterHashtable @{ LogName='System'; Id=1074,6008,41 } -MaxEvents 20 -ErrorAction SilentlyContinue |
  Select-Object TimeCreated, Id, @{n='Message';e={ ($_.Message -split "\r?\n")[0] }} |
  Format-Table -AutoSize -Wrap`);

/* ---------------- SOFTWARE INSTALLS & UPDATES ----------------
   Usually the biggest category of all. Most of it comes down to standard
   users having no rights to install or update anything, so this is the
   section you will open most. winget runs in the logged-on
   user's context, so run these as them, not as a different admin account,
   or per-user installs like Slack will be invisible. --------------------- */
S('winget-check','software','Is winget available, and what version?',[],
'Windows Package Manager ships with Windows 11 and recent Windows 10. If this errors, the machine needs App Installer from the Microsoft Store before the rest of this section works.',
String.raw`
winget --version
winget source list`);

S('winget-search','software','Find a package by name (uses App)',['net'],
'Searches the winget catalogue for whatever is in the <b>App</b> box and gives you the exact Id to use in the install and upgrade scripts. Always take the Id, not the name.',
String.raw`
winget search "{{APP}}" --accept-source-agreements`);

S('winget-outdated','software','What is out of date on this machine?',['net'],
'The honest answer to "do I need to update anything". Run this at the start of any update ticket: people raise one app and three others are due as well, and you may as well do them in the same visit.',
String.raw`
winget upgrade --include-unknown --accept-source-agreements`);

S('winget-upgrade-one','software','Update one app (uses App)',['net','changes'],
'Updates the single package whose Id is in the <b>App</b> box. Use winget-search first to get the exact Id. Close the app before running it.',
String.raw`
winget upgrade --id "{{APP}}" -e --accept-package-agreements --accept-source-agreements`);

S('winget-upgrade-all','software','Update everything winget knows about',['net','changes','risk'],
'The big one. Updates every package with an update available. Apps close as they go, so agree a time with the user first and never run it mid-call. Skips anything pinned or unknown to winget.',
String.raw`
winget upgrade --all --accept-package-agreements --accept-source-agreements`);

S('winget-install','software','Install an approved app (uses App)',['net','changes'],
'Put the exact winget Id in the <b>App</b> box. Only install software that is already approved. If it is not on the approved list yet, it needs signing off before it goes anywhere near a machine.',
String.raw`
winget install --id "{{APP}}" -e --accept-package-agreements --accept-source-agreements`);

S('winget-uninstall','software','Remove an app (uses App)',['changes','risk'],
'Uninstalls by winget Id. Check nobody is mid-something in it first.',
String.raw`
winget uninstall --id "{{APP}}" -e`);

S('install-failures','software','Why did that install fail?',['admin'],
'Recent MsiInstaller events. Error 1603 is usually a pending reboot or a file in use, 1618 means another install is already running, 1619 means the package could not be opened.',
String.raw`
Get-WinEvent -FilterHashtable @{ LogName='Application'; ProviderName='MsiInstaller' } -MaxEvents 25 -ErrorAction SilentlyContinue |
  Select-Object TimeCreated, Id, @{n='Message';e={ ($_.Message -split "\r?\n")[0] }} |
  Format-Table -AutoSize -Wrap`);

/* ---------------- macOS ----------------
   For shops that issue MacBooks alongside Windows. Paste these into Terminal. Anything marked sudo will ask for the
   user's password, and a standard user here does not have it, so those need
   an admin account. ---------------------------------------------------- */
S('mac-snapshot','mac','Full Mac snapshot',['mac'],
'The first thing to run on any Mac. Model, serial, chip, memory, macOS version, uptime and free space in one go.',
String.raw`
echo "--- Hardware ---"
system_profiler SPHardwareDataType | grep -E "Model Name|Model Identifier|Chip|Processor|Memory|Serial Number"
echo "--- macOS ---"
sw_vers
echo "--- Uptime ---"
uptime
echo "--- Disk ---"
df -h / | tail -1
echo "--- Logged in ---"
whoami`);

S('mac-serial','mac','Serial number only',['mac'],
'For asset records and warranty lookups. Also on the underside of the case in very small print.',
String.raw`
system_profiler SPHardwareDataType | awk '/Serial Number/{print $4}'`);

S('mac-updates','mac','Check for and install macOS updates',['mac','admin','changes','risk'],
'The Mac half of the update tickets. The first line lists what is waiting. The second installs everything and restarts if needed, so agree it with the user first.',
String.raw`
softwareupdate --list
# Install everything and restart if required:
# sudo softwareupdate --install --all --restart`);

S('mac-disk','mac','Disk space and what is using it',['mac'],
'Free space first, then the biggest folders in the home directory. Downloads, Desktop and an old iOS backup are the usual answers.',
String.raw`
df -h /
echo "--- Biggest folders in home ---"
du -sh ~/* 2>/dev/null | sort -h | tail -15`);

S('mac-reclaim','mac','Reclaim disk space on a Mac, including purgeable',['mac'],
'The Mac equivalent, measured rather than deleted. Includes the one that confuses everybody: <b>purgeable space</b>. Finder reports it as free, the disk behaves as though it is not, and it is nearly always Time Machine local snapshots sitting on the internal drive.',
String.raw`
echo "--- what the disk thinks ---"
df -h / | tail -1
echo
echo "--- what macOS thinks, including purgeable ---"
diskutil info / | grep -E "Container Free Space|Volume Free Space|Volume Used Space"
echo
echo "--- Time Machine local snapshots (usually the purgeable space) ---"
tmutil listlocalsnapshots / 2>/dev/null | tail -n +2 || echo "none"
echo
echo "To remove them all:"
echo "  for d in \$(tmutil listlocalsnapshots / | sed 's/.*com.apple.TimeMachine.//;s/.local//'); do"
echo "    sudo tmutil deletelocalsnapshots \$d"
echo "  done"
echo
echo "--- the usual space ---"
for p in \
  "$HOME/Library/Caches" \
  "$HOME/Library/Developer/Xcode/DerivedData" \
  "$HOME/Library/Application Support/MobileSync/Backup" \
  "$HOME/Downloads" \
  "$HOME/.Trash" \
  "/Library/Caches"
do
  if [ -e "$p" ]; then
    printf "%10s  %s\n" "$(du -sh "$p" 2>/dev/null | cut -f1)" "$p"
  fi
done
echo
echo "Caches and DerivedData are safe to remove - applications rebuild them."
echo "Downloads and Trash are the user's, so ask before touching either."
echo
echo "  rm -rf ~/Library/Caches/*"
echo "  rm -rf ~/Library/Developer/Xcode/DerivedData/*"`);


S('mac-network','mac','Network, IP, DNS and Wi-Fi',['mac'],
'Everything network in one pass. A 169.254.x.x address means DHCP failed, same as on Windows.',
String.raw`
echo "--- Interfaces ---"
ifconfig | grep -E "^[a-z0-9]+:|inet " | grep -v inet6
echo "--- Router ---"
netstat -rn | grep default
echo "--- DNS ---"
scutil --dns | grep nameserver | sort -u
echo "--- Wi-Fi ---"
sudo wdutil info 2>/dev/null | grep -E "SSID|RSSI|Channel|Tx Rate" || echo "Run with sudo for Wi-Fi detail"`);

S('mac-dns-flush','mac','Flush the DNS cache',['mac','admin','changes'],
'Safe and instant. Same job as the Windows flush: fixes a name still pointing at an old address.',
String.raw`
sudo dscacheutil -flushcache
sudo killall -HUP mDNSResponder
echo "DNS cache cleared."`);

S('mac-top','mac','What is using the CPU and memory?',['mac'],
'A live snapshot of the heaviest processes. Chrome with fifty tabs is usually the answer.',
String.raw`
echo "--- Top by CPU ---"
ps -Ao pcpu,pmem,comm -r | head -12
echo "--- Memory pressure ---"
memory_pressure | tail -4`);

S('mac-apps','mac','What is installed?',['mac'],
'Applications folder with install dates. Faster and more readable than the full system_profiler listing.',
String.raw`
ls -la /Applications | awk '{print $6, $7, $8, $9}' | sort -k4`);

S('mac-slack-cache','mac','Clear the Slack cache on a Mac',['mac','changes'],
'Same fix as the Windows one. Quit Slack first or this will not take.',
String.raw`
osascript -e 'quit app "Slack"' 2>/dev/null
sleep 3
rm -rf ~/Library/Application\ Support/Slack/Cache
rm -rf ~/Library/Application\ Support/Slack/Service\ Worker/CacheStorage
open -a Slack
echo "Slack cache cleared."`);

S('mac-audio','mac','Fix sound and microphone problems',['mac','admin','changes'],
'Restarting Core Audio fixes a surprising amount: no output device, a headset that connects but stays silent, a mic nothing can hear. Audio drops for a second.',
String.raw`
system_profiler SPAudioDataType | grep -E "^ {8}[A-Za-z]|Default"
sudo killall coreaudiod
echo "Core Audio restarted."`);

S('mac-displays','mac','Connected displays',['mac'],
'What the Mac can actually see, including resolution and whether it is mirrored. If a screen is missing here, it is a cable, dock or adapter problem rather than a settings one.',
String.raw`
system_profiler SPDisplaysDataType | grep -E "Display Type|Resolution|Mirror|Connection Type|^ {8}[A-Za-z].*:$"`);

S('mac-battery','mac','Battery health',['mac'],
'Cycle count and condition. "Service Recommended" or a cycle count over about 1000 means it is due for replacement.',
String.raw`
system_profiler SPPowerDataType | grep -E "Cycle Count|Condition|Maximum Capacity|Full Charge Capacity"`);

S('mac-security','mac','FileVault, firewall and MDM enrolment',['mac'],
'The three things to check before signing a Mac off, and the ones an audit will ask about. FileVault should be On.',
String.raw`
echo "--- FileVault ---"
fdesetup status
echo "--- Firewall ---"
/usr/libexec/ApplicationFirewall/socketfilterfw --getglobalstate
echo "--- MDM enrolment ---"
profiles status -type enrollment`);

S('mac-finder','mac','Restart Finder or the Dock',['mac','changes'],
'For a frozen Finder window, a stuck Dock or a desktop that has stopped responding. Nothing is lost.',
String.raw`
killall Finder
# If the Dock is the problem instead:
# killall Dock`);

/* ---------------- NETWORK ---------------- */
S('net-overview','network','Network adapters, IPs, gateway and DNS',[],
'Quick view of every connected adapter with its IP, default gateway and DNS servers. A 169.254.x.x address means DHCP failed.',
String.raw`
Get-NetIPConfiguration | Where-Object { $_.NetAdapter.Status -eq 'Up' } | ForEach-Object {
  [PSCustomObject]@{
    Adapter = $_.InterfaceAlias
    IPv4    = ($_.IPv4Address.IPAddress -join ', ')
    Gateway = ($_.IPv4DefaultGateway.NextHop -join ', ')
    DNS     = ($_.DNSServer | Where-Object AddressFamily -eq 2 | ForEach-Object ServerAddresses) -join ', '
  }
} | Format-Table -AutoSize`);

S('public-ip','network','What is my public IP?',['net'],
'Shows the public IP this machine is coming out from, plus the ISP and location. Handy for checking if the VPN is actually in use.',
String.raw`
Invoke-RestMethod "https://ipinfo.io/json"`);

S('ip-lookup','network','Who owns this IP? (uses IP)',['net'],
'Your favourite. Looks up the IP in the <b>IP</b> fill-in box. The <b>org</b> field tells you who owns it. If the corporate proxy blocks it, paste the IP into ipinfo.io, AbuseIPDB or VirusTotal in a browser instead.',
String.raw`
Invoke-RestMethod "https://ipinfo.io/{{IP}}/json"`);

S('conn-owners','network','Every live connection with its owner (IP lookup on steroids)',['net'],
'Takes every established outbound connection, skips private and internal addresses, and looks each public IP up on ipinfo.io. Process name, PID, remote IP and owner in one table, which is how you spot something talking to a host it has no business talking to.<br><br><b>Two things to know before you run it.</b> Every address this machine is connected to gets sent to a third party, so it maps where a corporate machine talks; for a single suspicious address use the IP lookup script instead. And ipinfo has a daily free limit, so this is a deliberate investigation step rather than something to run on every job. Capped at 25 addresses.',
String.raw`
$private = '^(10\.|127\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|169\.254\.|0\.0\.0\.0|::|fe80)'
$cache   = @{}
Get-NetTCPConnection -State Established |
  Where-Object { $_.RemoteAddress -notmatch $private } |
  Select-Object -First 25 |
  ForEach-Object {
    $ip = $_.RemoteAddress
    if (-not $cache.ContainsKey($ip)) {
      try   { $cache[$ip] = Invoke-RestMethod "https://ipinfo.io/$ip/json" -TimeoutSec 5 }
      catch { $cache[$ip] = [PSCustomObject]@{ org = 'lookup failed'; country = '' } }
      Start-Sleep -Milliseconds 200
    }
    [PSCustomObject]@{
      Process  = (Get-Process -Id $_.OwningProcess -ErrorAction SilentlyContinue).ProcessName
      PID      = $_.OwningProcess
      RemoteIP = $ip
      Port     = $_.RemotePort
      Owner    = $cache[$ip].org
      Country  = $cache[$ip].country
    }
  } | Sort-Object Process | Format-Table -AutoSize`);

S('test-port','network','Can I reach a host on a port? (uses Computer)',['net'],
'Tests ping and a TCP port to the host in the <b>Computer</b> box. TcpTestSucceeded True means the port is open and reachable. Change 443 to 3389 (RDP), 445 (file shares), 5985 (WinRM) etc.',
String.raw`
Test-NetConnection {{COMPUTER}} -Port 443`);

S('traceroute','network','Trace the route to a host (uses Computer)',['net'],
'Shows each hop between here and the target. Where the hops stop replying is roughly where the problem is.',
String.raw`
Test-NetConnection {{COMPUTER}} -TraceRoute`);

S('dns-lookup','network','DNS lookup (uses Computer)',['net'],
'Checks what the name resolves to. If it resolves to the wrong IP or not at all, it is a DNS problem, not a network one.',
String.raw`
Resolve-DnsName {{COMPUTER}}
# Compare against a specific DNS server:
# Resolve-DnsName {{COMPUTER}} -Server 8.8.8.8`);

S('flush-dns','network','Flush the DNS cache',['changes'],
'Safe and instant. Fixes websites or servers that have moved to a new IP but the PC still remembers the old one.',
String.raw`
Clear-DnsClientCache
ipconfig /flushdns
Write-Host 'DNS cache cleared.'`);

S('net-reset','network','Full network stack reset',['admin','changes','risk'],
'The big hammer for "no internet" when everything else looks fine. Releases/renews the IP, flushes DNS and resets Winsock and TCP/IP. <b>A reboot is required afterwards</b> and the connection will drop, so do not run this over a remote session.',
String.raw`
ipconfig /release
ipconfig /renew
ipconfig /flushdns
netsh winsock reset
netsh int ip reset
Write-Host 'Done. Restart the PC now.' -ForegroundColor Yellow`);

S('wifi-info','network','Wi-Fi signal and connection details',[],
'Shows the SSID, signal strength, band, channel and link speed. Signal below about 60% explains a lot of dropouts and choppy Meet and Zoom calls.',
String.raw`
netsh wlan show interfaces`);

S('wifi-profiles','network','Saved Wi-Fi networks',[],
'Lists the Wi-Fi profiles saved on the machine. Useful for "it connects at home but not here" and for clearing out an old network that keeps being picked. Remove one with: netsh wlan delete profile name="NETWORKNAME"<br><br><b>The key=clear switch that prints a saved Wi-Fi password is deliberately not in this toolkit.</b> If you genuinely need a corporate key, get it from whoever holds it rather than reading it off a user machine, and never put it in a ticket.',
String.raw`
netsh wlan show profiles`);

S('listening-ports','network','What is listening on this machine?',[],
'Every open listening port and the process behind it. Anything unexpected listening (especially on 0.0.0.0) is worth a closer look.',
String.raw`
Get-NetTCPConnection -State Listen |
  Select-Object LocalAddress, LocalPort, OwningProcess,
    @{n='Process';e={ (Get-Process -Id $_.OwningProcess -ErrorAction SilentlyContinue).ProcessName }} |
  Sort-Object LocalPort |
  Format-Table -AutoSize`);

S('proxy-check','network','Check proxy settings',[],
'Shows both the system (WinHTTP) proxy and the user proxy. A stale proxy setting is a classic cause of "internet works in one app but not another".',
String.raw`
netsh winhttp show proxy
Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings' |
  Select-Object ProxyEnable, ProxyServer, ProxyOverride, AutoConfigURL |
  Format-List`);

/* ---- VPN. Every shop runs a different client, so these look for whichever
   one is actually installed rather than assuming. Add yours to the list. ---- */
S('vpn-status','network','VPN: which client, is it running, is a tunnel up',[],
'Start every VPN ticket here. Finds whichever VPN client is installed, its version, whether its service is running and whether a tunnel adapter actually came up. A client asking to update is a request, not a fault.',
String.raw`
$known = @(
  @{ N = 'AWS VPN Client';      P = 'C:\Program Files\Amazon\AWS VPN Client\AWS VPN Client.exe' },
  @{ N = 'Cisco AnyConnect';    P = 'C:\Program Files (x86)\Cisco\Cisco AnyConnect Secure Mobility Client\vpnui.exe' },
  @{ N = 'Cisco Secure Client'; P = 'C:\Program Files (x86)\Cisco\Cisco Secure Client\UI\csc_ui.exe' },
  @{ N = 'GlobalProtect';       P = 'C:\Program Files\Palo Alto Networks\GlobalProtect\PanGPA.exe' },
  @{ N = 'FortiClient';         P = 'C:\Program Files\Fortinet\FortiClient\FortiClient.exe' },
  @{ N = 'OpenVPN';             P = 'C:\Program Files\OpenVPN\bin\openvpn-gui.exe' },
  @{ N = 'WireGuard';           P = 'C:\Program Files\WireGuard\wireguard.exe' },
  @{ N = 'Zscaler';             P = 'C:\Program Files\Zscaler\ZSATray\ZSATray.exe' },
  @{ N = 'Tailscale';           P = 'C:\Program Files\Tailscale\tailscale-ipn.exe' }
)
Write-Host '--- Clients installed ---' -ForegroundColor Cyan
$any = $false
foreach ($k in $known) {
  if (Test-Path $k.P) { $any = $true; '{0,-22} {1}' -f $k.N, (Get-Item $k.P).VersionInfo.ProductVersion }
}
if (-not $any) { 'None of the usual clients are in their default folder. Check Programs and Features.' }

Write-Host ''
Write-Host '--- Services ---' -ForegroundColor Cyan
Get-Service -ErrorAction SilentlyContinue |
  Where-Object { $_.Name -match 'vpn|anyconnect|csc_|PanGP|forti|openvpn|wireguard|ZSA|Tailscale' } |
  Select-Object Name, DisplayName, Status | Format-Table -AutoSize

Write-Host '--- Tunnel adapters ---' -ForegroundColor Cyan
Get-NetAdapter -ErrorAction SilentlyContinue |
  Where-Object { $_.InterfaceDescription -match 'TAP|Wintun|WireGuard|VPN|AnyConnect|GlobalProtect|Tunnel' } |
  Select-Object Name, InterfaceDescription, Status, LinkSpeed | Format-Table -AutoSize

$up = Get-NetAdapter -ErrorAction SilentlyContinue |
  Where-Object { $_.Status -eq 'Up' -and $_.InterfaceDescription -match 'TAP|Wintun|WireGuard|VPN|AnyConnect|GlobalProtect|Tunnel' }
if ($up) { Write-Host 'A tunnel adapter is UP, so the client believes it is connected.' -ForegroundColor Green }
else     { Write-Host 'No tunnel adapter is up. Whatever the client says on screen, it is not connected.' -ForegroundColor Yellow }`);

S('vpn-logs','network','VPN: find and open the client logs',[],
'The logs say why a connection failed, which beats the message on screen every time. Checks where each of the common clients writes them and opens the newest folder it finds. Attach the newest file to the ticket.',
String.raw`
$paths = @(
  "$env:APPDATA\AWSVPNClient\logs",
  "$env:LOCALAPPDATA\Cisco\Cisco AnyConnect Secure Mobility Client\Logs",
  "$env:LOCALAPPDATA\Cisco\Cisco Secure Client\Logs",
  'C:\ProgramData\Palo Alto Networks\GlobalProtect\Logs',
  'C:\Program Files\Fortinet\FortiClient\logs',
  "$env:USERPROFILE\OpenVPN\log",
  'C:\ProgramData\WireGuard\log.bin',
  "$env:LOCALAPPDATA\Zscaler"
)
$hit = $null
foreach ($p in $paths) {
  if (Test-Path $p) {
    $hit = $p
    Write-Host "--- $p ---" -ForegroundColor Cyan
    Get-ChildItem $p -File -ErrorAction SilentlyContinue |
      Sort-Object LastWriteTime -Descending | Select-Object -First 5 Name, LastWriteTime,
      @{ n = 'KB'; e = { [math]::Round($_.Length / 1KB) } } | Format-Table -AutoSize
  }
}
if ($hit) { Start-Process (Split-Path $hit -Parent) }
else { 'No VPN client logs found in the usual places. The client may be installed for a different user, or it logs to the Event Log instead.' }`);

S('vpn-restart','network','VPN: restart the client service',['admin','changes','risk'],
'For a client that will not connect or is stuck on "connecting". <b>This drops any live tunnel</b>, so never run it over a remote session that depends on the VPN, and never without telling the user first.',
String.raw`
$svc = Get-Service -ErrorAction SilentlyContinue |
  Where-Object { $_.Name -match 'vpn|anyconnect|csc_|PanGP|forti|openvpn|wireguard|ZSA|Tailscale' -and $_.Status -eq 'Running' }

$svc | ForEach-Object { Get-Service $_.Name } | Select-Object Name, Status | Format-Table -AutoSize`);

/* ---------------- SECURITY & TRIAGE ---------------- */
S('proc-inspect','security','Inspect a process: path, signature, parent (uses Process)',[],
'The standard triage check for a process you do not recognise. Put the process name in the <b>Process</b> box. Red flags: path outside System32 or Program Files (e.g. AppData, Temp, ProgramData), signature not Valid, odd parent (a document, a browser, cmd, powershell, rundll32), strange command line.',
String.raw`
$name = '{{PROCESS}}'
Get-CimInstance Win32_Process -Filter "Name LIKE '$name%'" | ForEach-Object {
  $parent = Get-CimInstance Win32_Process -Filter "ProcessId=$($_.ParentProcessId)" -ErrorAction SilentlyContinue
  $sig    = if ($_.ExecutablePath) { Get-AuthenticodeSignature $_.ExecutablePath } else { $null }
  [PSCustomObject]@{
    Name        = $_.Name
    PID         = $_.ProcessId
    Path        = $_.ExecutablePath
    CommandLine = $_.CommandLine
    Parent      = if ($parent) { "$($parent.Name) ($($_.ParentProcessId))" } else { "exited ($($_.ParentProcessId))" }
    Signature   = if ($sig) { $sig.Status } else { 'n/a (run as admin?)' }
    SignedBy    = if ($sig -and $sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { '' }
    Started     = $_.CreationDate
  }
} | Format-List`);

S('unsigned-procs','security','Running processes that are not validly signed',['admin'],
'Checks the digital signature of every running program. Unsigned is not automatically bad (some in-house or small-vendor tools are unsigned) but it is where to start looking.',
String.raw`
Get-Process | Where-Object Path | Sort-Object Path -Unique | ForEach-Object {
  $sig = Get-AuthenticodeSignature $_.Path
  if ($sig.Status -ne 'Valid') {
    [PSCustomObject]@{ Name = $_.ProcessName; PID = $_.Id; Status = $sig.Status; Path = $_.Path }
  }
} | Format-Table -AutoSize`);

S('procs-userpaths','security','Processes running from user-writable folders',[],

$before  = ($targets | ForEach-Object { Get-ChildItem $_ -Recurse -File -Force -ErrorAction SilentlyContinue } | Measure-Object Length -Sum).Sum
foreach ($t in $targets) { Get-ChildItem $t -Force -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue }
$after   = ($targets | ForEach-Object { Get-ChildItem $_ -Recurse -File -Force -ErrorAction SilentlyContinue } | Measure-Object Length -Sum).Sum
